<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Arise To Duo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,sans-serif;background:#f6f5fb;color:#15131f}
  @media (prefers-color-scheme:dark){body{background:#15131f;color:#f3f4f6}}
  .c{text-align:center;max-width:380px;padding:24px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:16px 0 6px}
  p{margin:0 0 20px;opacity:.75;line-height:1.5}
  button{border:0;border-radius:999px;background:#6d3df5;color:#fff;font:600 15px inherit;padding:12px 24px;cursor:pointer}
</style></head>
<body><div class="c">
  <img src="build/icon.png" alt="">
  <h1>You're offline</h1>
  <p>Arise To Duo needs the internet to load your hubs. Check your connection and try again.</p>
  <button id="r">Try again</button>
</div>
<script>
  const to = new URLSearchParams(location.search).get("retry") || "https://arisetodo.com/app";
  const go = () => { if (/^https:\/\/(www\.)?arisetodo\.com(\/|$)/.test(to)) location.href = to; };
  document.getElementById("r").onclick = go;
  addEventListener("online", go);
</script>
</body></html>
