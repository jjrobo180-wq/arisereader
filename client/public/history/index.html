<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arise History: K–12 History Reads with primary sources, 5-question quizzes, points, a class leaderboard and certificates. Teachers assign reads or their own questions and run live review games; parents follow along. Part of A.R.I.S.E. Reader.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://www.arisereader.com/history/">
<link rel="icon" href="/favicon.ico">
<title>Arise History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Alegreya:wght@400;700&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: Arise family shell (matches Arise Social and Arise Math) — profile card left · work center · class rail right; icon nav on top, tab bar on phones.
   Indigo for actions, sunrise gradient on covers and the quiz header, sun gold for points, parchment for anything you read or cite. */
:root{
  --bg:#f2f1f6; --card:#ffffff; --card-2:#f6f5fa; --line:#e4e2ec; --line-2:#cfccdc;
  --fg:#1a1828; --muted:#64617a; --faint:#8d8aa3;
  --primary:#3f3bd6; --primary-ink:#ffffff; --primary-soft:#ebeaff; --primary-text:#3431c4;
  --sun:#f29a14; --coral:#ef5a45; --leaf:#1e9e62; --sky:#1f8fd6;
  --build:#f29a14; --serve:#5867f0; --teach:#8b5cf6; --heal:#ef5a45; --help:#e0559d;
  --create:#12a594; --tech:#1f8fd6; --nature:#2f9e57; --fly:#c9a20c;
  --cover-a:#2b2a8f; --cover-b:#6d4fd8; --cover-c:#f29a14;
  --gold:#d9a41c; --silver:#9ea3b5; --bronze:#c27a45;
  --shadow:0 0 0 1px rgba(26,24,40,.06), 0 2px 4px rgba(26,24,40,.05);
  --shadow-lg:0 24px 60px rgba(26,24,40,.22);
  --font:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0a16; --card:#15142a; --card-2:#1c1b35; --line:#2a2846; --line-2:#3a3760;
  --fg:#eeedf7; --muted:#a19eba; --faint:#7b789a;
  --primary:#8e8bff; --primary-ink:#0b0a16; --primary-soft:#24224b; --primary-text:#aeacff;
  --sun:#ffb23f; --coral:#ff7466; --leaf:#45c985; --sky:#5cc0f5;
  --build:#ffb23f; --serve:#8b97ff; --teach:#b39bff; --heal:#ff7a6e; --help:#f58ac0;
  --create:#3fcdbf; --tech:#5cc0f5; --nature:#56d48d; --fly:#ecd257;
  --gold:#f0c24a; --silver:#b9bdcc; --bronze:#e0956a;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0a16; --card:#15142a; --card-2:#1c1b35; --line:#2a2846; --line-2:#3a3760;
  --fg:#eeedf7; --muted:#a19eba; --faint:#7b789a;
  --primary:#8e8bff; --primary-ink:#0b0a16; --primary-soft:#24224b; --primary-text:#aeacff;
  --sun:#ffb23f; --coral:#ff7466; --leaf:#45c985; --sky:#5cc0f5;
  --build:#ffb23f; --serve:#8b97ff; --teach:#b39bff; --heal:#ff7a6e; --help:#f58ac0;
  --create:#3fcdbf; --tech:#5cc0f5; --nature:#56d48d; --fly:#ecd257;
  --gold:#f0c24a; --silver:#b9bdcc; --bronze:#e0956a;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.big{font-size:16.5px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.4rem,3vw,1.7rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px}
.logo{width:36px;height:36px;flex:none;border-radius:9px;display:block}
.wordmark{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap}
.wordmark b{color:var(--primary-text);font-weight:800}
.ptsbadge{display:flex;align-items:center;gap:6px;background:color-mix(in oklab,var(--sun) 16%,var(--card));color:color-mix(in oklab,var(--sun) 55%,var(--fg));border-radius:999px;padding:4px 12px;font-weight:800;font-size:.82rem;white-space:nowrap}
.ptsbadge svg{width:15px;height:15px}
.topnav{display:flex;margin-left:auto;height:100%}
.topnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:78px;padding:0 6px;color:var(--muted);font-size:.72rem;font-weight:600;position:relative;height:100%}
.topnav button svg{width:22px;height:22px}
.topnav button:hover,.topnav button[aria-current="page"]{color:var(--fg)}
.topnav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--fg)}
.topnav .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:999px;background:var(--coral);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px;font-weight:800}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:22px;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 48px}
.left,.rail{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
main{min-width:0;display:flex;flex-direction:column;gap:12px}
.bottom{display:none}
@media (max-width:1100px){ .app{grid-template-columns:220px minmax(0,1fr)} .rail{display:none} .topnav button{min-width:64px} }
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:12px 100px}
  .left,.topnav{display:none}
  .ptsbadge{margin-left:auto}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:600;color:var(--muted);padding:4px 2px;min-width:0;flex:1;position:relative}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--fg)}
  .bottom .dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--coral)}
}

/* ---------- primitives ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.divider{height:1px;background:var(--line);margin:0 -16px}
.btn{border-radius:999px;padding:6px 16px;font-weight:700;font-size:.86rem;background:transparent;color:var(--muted);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--card-2);color:var(--fg);border-color:var(--fg)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.outline{color:var(--primary-text);border-color:var(--primary)}
.btn.outline:hover{background:var(--primary-soft)}
.btn.lg{min-height:48px;padding:10px 24px;font-size:1rem}
.btn.sm{padding:4px 12px;min-height:30px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
.btn.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.26);color:#fff;border-color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;background:transparent;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
button.chip:hover{background:var(--card-2);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.chip.cl{border:0;background:color-mix(in oklab,var(--c) 14%,var(--card));color:color-mix(in oklab,var(--c) 70%,var(--fg))}
.pill-ok{border:0;background:color-mix(in oklab,var(--leaf) 16%,var(--card));color:color-mix(in oklab,var(--leaf) 75%,var(--fg))}
.pill-warn{border:0;background:color-mix(in oklab,var(--coral) 16%,var(--card));color:color-mix(in oklab,var(--coral) 75%,var(--fg))}
.pill-wait{border:0;background:color-mix(in oklab,var(--sun) 18%,var(--card));color:color-mix(in oklab,var(--sun) 55%,var(--fg))}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;background:var(--c);width:44px;height:44px;font-size:.9rem}
.av.xs{width:26px;height:26px;font-size:.6rem}
.av.sm{width:34px;height:34px;font-size:.74rem}
.av.lg{width:72px;height:72px;font-size:1.4rem;border:3px solid var(--card)}
.av.ring{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sun)}
.bar{height:8px;border-radius:999px;background:var(--card-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.bar.sun>i{background:var(--sun)} .bar.leaf>i{background:var(--leaf)}
.cover{height:64px;background:
  radial-gradient(34px 34px at 93% 125%, color-mix(in oklab,var(--cover-c) 95%,#fff) 0 60%, transparent 62%),
  linear-gradient(115deg,var(--cover-a) 0%,var(--cover-b) 55%,var(--cover-c) 120%)}
.empty{padding:24px;text-align:center;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.8rem;color:var(--muted);min-width:0}
.toggle{width:44px;height:26px;border-radius:99px;border:0;background:var(--line-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"]{background:var(--leaf)}
.toggle[aria-pressed="true"]::after{left:21px}
.setting{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:first-child{padding-top:0} .setting:last-child{border-bottom:0;padding-bottom:0}
.setting b{display:block;font-size:.9rem} .setting span{font-size:.8rem;color:var(--muted)}
.setting select{width:auto}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.statgrid div{background:var(--card-2);border-radius:12px;padding:10px 12px}
.statgrid b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.statgrid span{font-size:.74rem;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto;margin:0 -16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.86rem}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--card-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--card-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- left profile card ---------- */
.mini{text-align:center}
.mini .av.lg{margin:-36px auto 0}
.mini .who{padding:8px 16px 14px}
.mini .who b{display:block;font-size:1.05rem}
.mini .who > span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.mini .kv{display:flex;justify-content:space-between;padding:8px 16px;font-size:.8rem;font-weight:600;color:var(--muted);width:100%;border:0;background:transparent}
.mini .kv b{color:var(--primary-text);font-variant-numeric:tabular-nums}
.mini button.kv:hover{background:var(--card-2)}
.mini-goal{padding:10px 16px 14px;text-align:left;border-top:1px solid var(--line)}
.mini-goal .row{justify-content:space-between;font-size:.8rem;font-weight:600;margin-bottom:6px}

/* ---------- practice ---------- */
.qcards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.qcard{display:flex;flex-direction:column;gap:10px}
.op{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;background:color-mix(in oklab,var(--c) 15%,var(--card));color:color-mix(in oklab,var(--c) 80%,var(--fg));flex:none}
.op.sm{width:32px;height:32px;font-size:1rem;border-radius:9px}
.qcard .meta{font-size:.76rem;color:var(--muted)}
.qcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.assign{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.assign:last-child{border-bottom:0;padding-bottom:0}
.assign:first-of-type{padding-top:0}
.assign b{display:block;font-size:.92rem}
.join{display:flex;gap:8px;align-items:center}
.join input{max-width:150px;letter-spacing:.1em;font-weight:700;text-align:center}

/* ---------- quiz runner ---------- */
.run-head{height:auto;padding:14px clamp(16px,4vw,28px) 16px;color:#fff;display:flex;flex-direction:column;gap:10px}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run-pts{font-weight:800;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-size:.86rem}
.run-title b{display:block;font-size:1.15rem;font-weight:800}
.run-title span{font-size:.82rem;opacity:.85}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}
.pips i.cur{background:#fff}
.pips i.first{background:#7ff0b4} .pips i.solved{background:#ffd27a} .pips i.missed{background:#ff9d92}
.run-body{padding:20px clamp(16px,4vw,28px) 24px;display:flex;flex-direction:column;gap:16px}
.ask{color:var(--muted);font-size:1.02rem;max-width:62ch}
.prompt{font-weight:800;font-size:clamp(2rem,6.5vw,3.1rem);line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;flex-wrap:wrap;gap:.2em .35em;min-width:0}
.prompt.long{font-size:clamp(1.35rem,4.4vw,2.05rem)}
body.big .prompt{font-size:clamp(2.4rem,8vw,3.7rem)} body.big .prompt.long{font-size:clamp(1.6rem,5.4vw,2.5rem)}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;line-height:1.05;vertical-align:middle}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .18em}
.blank{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;border:2px dashed var(--line-2);border-radius:12px;color:var(--faint);font-size:.75em}
.viz-wrap{overflow-x:auto}
.viz{display:block;max-width:100%;height:auto}
.cell{fill:var(--card);stroke:var(--fg);stroke-width:1.5}
.dot.d1{fill:var(--primary)} .dot.d2{fill:var(--sun)} .dot.gone{fill:var(--line-2)}
.vx{stroke:var(--coral);stroke-width:2.5;stroke-linecap:round;fill:none}
.rod{fill:var(--primary)} .rodline{stroke:var(--card);stroke-width:1} .unit{fill:var(--sun)}
.seg-r{fill:var(--card);stroke:var(--fg);stroke-width:1.5} .seg-r.fill{fill:var(--primary)}
.lab{fill:var(--fg);font:700 13px var(--font)} .lab.sm{font-size:10px;fill:var(--muted);font-weight:600}
.axis{stroke:var(--fg);stroke-width:1.5} .gridl{stroke:var(--line);stroke-width:1} .tick{stroke:var(--fg);stroke-width:1.2}
.pt{fill:var(--sun);stroke:var(--fg);stroke-width:1.5} .ln{stroke:var(--primary);stroke-width:2;stroke-dasharray:6 5;fill:none}
.beam{stroke:var(--fg);stroke-width:4;stroke-linecap:round} .pan{fill:color-mix(in oklab,var(--sun) 20%,var(--card));stroke:var(--fg);stroke-width:1.5} .fulcrum{fill:var(--fg)}
.hund{fill:var(--card);stroke:var(--line);stroke-width:1} .hund.fill{fill:var(--primary);stroke:var(--card)}
.answer{display:flex;flex-wrap:wrap;gap:10px}
.answer input{flex:1 1 170px;max-width:300px;font-weight:800;font-size:1.7rem;padding:8px 16px;border:2px solid var(--line-2);border-radius:14px;font-variant-numeric:tabular-nums}
.answer input.is-bad{border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:430px}
.keypad button{min-height:46px;font-weight:800;font-size:1.15rem;background:var(--card-2);border:1px solid var(--line);border-radius:12px}
.keypad button:active{background:var(--primary-soft)}
.keypad .wide{font-size:.82rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;max-width:520px}
.choices button{min-height:76px;font-weight:800;font-size:1.9rem;background:var(--card-2);border:2px solid var(--line);border-radius:16px;font-variant-numeric:tabular-nums}
.choices button:hover:not(:disabled){border-color:var(--primary)}
.choices button.is-good{background:color-mix(in oklab,var(--leaf) 18%,var(--card));border-color:var(--leaf);opacity:1}
.choices button.is-bad{background:color-mix(in oklab,var(--coral) 14%,var(--card));border-color:var(--coral)}
.choices button:disabled{cursor:default}
.choices button:disabled:not(.is-good){opacity:.5}
.feedback{font-weight:700;font-size:1rem}
.feedback.good{color:var(--leaf)} .feedback.bad{color:var(--coral)}
.hints{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:1px dashed var(--line-2);padding-top:14px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;max-width:62ch;font-size:1rem}
.steps li::marker{color:var(--primary-text);font-weight:800}
.result-score{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.qlist{display:flex;flex-direction:column}
.qlist div{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.qlist div:last-child{border-bottom:0}
.mk{font-weight:800;text-align:center} .mk.first{color:var(--leaf)} .mk.solved{color:var(--sun)} .mk.missed{color:var(--coral)}

/* ---------- leaderboard ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding:8px 0 4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod b{font-size:.88rem;overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.3rem}
.pod.p1 .blk{height:84px;background:var(--gold)} .pod.p2 .blk{height:62px;background:var(--silver)} .pod.p3 .blk{height:46px;background:var(--bronze)}
.pod .pts{font-size:.78rem;color:var(--muted);font-weight:700}
.lb{display:flex;flex-direction:column}
.lbrow{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px}
.lbrow + .lbrow{margin-top:2px}
.lbrow .rk{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lbrow .nm{font-weight:700;font-size:.92rem;min-width:0}
.lbrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.lbrow .sc{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lbrow .sc small{display:block;font-weight:600;color:var(--muted);font-size:.7rem}
.lbrow.me{background:var(--primary-soft)} .lbrow.me .rk{color:var(--primary-text)}
.awards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.award{display:flex;gap:10px;align-items:center;background:var(--card-2);border-radius:12px;padding:10px 12px}
.award b{display:block;font-size:.86rem} .award span{font-size:.74rem;color:var(--muted)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in oklab,var(--c) 16%,var(--card));color:color-mix(in oklab,var(--c) 80%,var(--fg))}
.ico svg{width:19px;height:19px}

/* ---------- rewards ---------- */
.hero{color:#fff;height:auto;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero span{opacity:.88;font-size:.86rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--line);font-size:.78rem;font-weight:700;padding:12px 8px;line-height:1.25}
.badge small{font-weight:500;color:var(--muted);font-size:.7rem}
.badge.locked{border-style:dashed;border-color:var(--line-2);color:var(--faint)}
.badge.locked .ico{background:var(--card-2);color:var(--faint)}
.styles{display:flex;gap:12px;flex-wrap:wrap}
.style{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;font-size:.74rem;font-weight:700;color:var(--muted);padding:4px}
.style[aria-pressed="true"]{color:var(--fg)}
.style[aria-pressed="true"] .av{outline:3px solid var(--primary);outline-offset:3px}
.style:disabled{cursor:not-allowed}
.style:disabled .av{filter:grayscale(1);opacity:.4}
.certrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.certrow:last-child{border-bottom:0;padding-bottom:0} .certrow:first-child{padding-top:0}
.certrow b{display:block;font-size:.9rem} .certrow span{font-size:.78rem;color:var(--muted)}
.certrow > div:nth-child(2){flex:1;min-width:0}

/* ---------- games ---------- */
.gate{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card-2)}
.gate svg{width:22px;height:22px;flex:none}
.gate.open svg{color:var(--leaf)} .gate.closed svg{color:var(--coral)}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.target .t{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:68px;border-radius:16px;border:2px solid var(--line);background:var(--card-2);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;transition:transform .1s}
.tile:hover{border-color:var(--primary)}
.tile[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);transform:scale(1.04)}
.tile.pop{animation:pop .3s}
.tile.no{animation:shake .3s;border-color:var(--coral)}
@keyframes pop{50%{transform:scale(1.12)}}

/* ---------- teacher ---------- */
.heat{width:46px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;background:color-mix(in oklab,var(--leaf) var(--p),var(--card-2));color:var(--fg)}
.heat.low{background:color-mix(in oklab,var(--coral) 30%,var(--card-2))}
.warnrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.warnrow:last-child{border-bottom:0}
.warnrow b{display:block;font-size:.88rem} .warnrow span{font-size:.76rem;color:var(--muted)}
.warnrow > div{flex:1;min-width:0}
.code{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.lobby{display:flex;flex-wrap:wrap;gap:6px}
.lobby .chip{animation:pop .3s}
.lq{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.lopt{border-radius:14px;padding:12px;color:#fff;font-weight:800;font-size:1.5rem;display:flex;flex-direction:column;gap:8px;background:var(--c);position:relative;min-height:84px}
.lopt .cnt{font-size:.78rem;font-weight:700;opacity:.9}
.lopt.dim{opacity:.35}
.lopt .lbar{height:6px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:auto}
.lopt .lbar i{display:block;height:100%;background:#fff}
.timer{font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* ---------- modal / cert / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,20,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;max-width:600px;width:100%;max-height:min(88vh,860px);overflow:auto;box-shadow:var(--shadow-lg);position:relative}
.modal-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px}
.x{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:#1a1828;z-index:2}
.x svg{width:18px;height:18px}
.cert{padding:14px;background:linear-gradient(115deg,var(--cover-a),var(--cover-b) 60%,var(--cover-c))}
.cert-in{background:var(--card);border-radius:10px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid color-mix(in oklab,var(--sun) 50%,var(--card))}
.cert-in h2{font-size:1.5rem;font-weight:800}
.cert-name{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-text);border-bottom:2px solid var(--line);padding:0 18px 4px}
.cert-foot{display:flex;justify-content:space-between;gap:24px;width:100%;max-width:380px;margin-top:14px;font-size:.86rem}
.cert-foot div{display:flex;flex-direction:column;border-top:1.5px solid var(--fg);padding-top:4px;flex:1}
.cert-foot small{color:var(--muted);font-size:.7rem}
.toast{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.86rem;z-index:80;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
@media (max-width:780px){.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- signed-in chrome ---------- */
.me-wrap{position:relative;display:flex;align-items:center;gap:10px;margin-left:12px}
.me-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;font-size:.72rem;font-weight:600;color:var(--muted);padding:0 4px}
.menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);min-width:240px;padding:8px;display:flex;flex-direction:column;z-index:50}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block} .menu .who span{font-size:.8rem;color:var(--muted)}
.menu a,.menu button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;border:0;background:transparent;text-align:left;font-weight:600;font-size:.88rem;color:var(--fg);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--card-2)}
.menu svg{width:18px;height:18px}
.top-actions{display:flex;gap:8px;margin-left:auto}
.app.solo{grid-template-columns:minmax(0,1fr);max-width:980px}
.app.solo .left,.app.solo .rail{display:none}
@media (max-width:780px){ .me-wrap{margin-left:auto} }

/* ---------- landing + messages ---------- */
.land-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;padding:24px}
@media (max-width:780px){.land-hero{grid-template-columns:minmax(0,1fr)}}
.land-hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-top:8px}
.land-hero h1 em{font-style:normal;color:var(--primary-text)}
.lead{color:var(--muted);font-size:1.02rem;margin-top:10px;max-width:56ch}
.land-art{border-radius:16px;overflow:hidden;background:var(--card-2)}
.land-art .inner{padding:16px}
.join-col{display:flex;flex-direction:column;gap:8px;margin-top:20px;max-width:420px}
.points4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.points4 b{display:flex;gap:8px;align-items:center;font-size:.92rem;margin-bottom:4px}
.points4 b svg{width:18px;height:18px;color:var(--leaf)}
.center{max-width:520px;margin:48px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.center .ico{width:56px;height:56px}
.center .ico svg{width:26px;height:26px}
.loading{padding:28px;text-align:center;color:var(--muted)}
.bandpick{display:flex;gap:4px;flex-wrap:wrap}
.bandpick button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;color:var(--muted)}
.bandpick button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.live-play .prompt{font-size:clamp(1.6rem,6vw,2.6rem)}
.lq button.lopt{border:0;text-align:left;cursor:pointer}
.lq button.lopt:disabled{cursor:default}
.lopt.mine{outline:3px solid var(--fg);outline-offset:2px}

.link{background:none;border:0;color:var(--primary-text);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:inherit}

/* ---------- Arise History additions: anything you read or cite sits on a parchment "document" in Alegreya ---------- */
:root{ --paper:#fbf6ea; --paper-line:#e8dcc0; --ink:#3a2f1e; --ink-soft:#7a6a4f; --doc:"Alegreya", Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#221d16; --paper-line:#3d3426; --ink:#efe4cc; --ink-soft:#b7a684; } }
:root[data-theme="dark"]{ --paper:#221d16; --paper-line:#3d3426; --ink:#efe4cc; --ink-soft:#b7a684; }
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.read{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;text-align:left;border:0;padding:0;min-width:0}
.read:hover{box-shadow:0 0 0 2px var(--primary)}
.read .spine{height:84px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in oklab,var(--c) 55%,#0b0a16))}
.read .spine .eyebrow{color:rgba(255,255,255,.85)}
.read .spine .yr{font-family:var(--doc);font-weight:700;font-size:1.5rem;line-height:1}
.read .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.read .body b{font-size:.98rem;line-height:1.25}
.read .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.passage{font-family:var(--doc);font-size:1.16rem;line-height:1.65;max-width:62ch;display:flex;flex-direction:column;gap:.7em}
body.big .passage{font-size:1.32rem}
.doc{background:var(--paper);color:var(--ink);border:1px solid var(--paper-line);border-radius:6px;padding:16px 20px 12px;font-family:var(--doc);font-size:1.1rem;line-height:1.55;max-width:62ch}
.doc .lab{font-family:var(--font);font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.doc .cite{margin-top:10px;padding-top:8px;border-top:1px dashed var(--paper-line);font-family:var(--font);font-size:.74rem;color:var(--ink-soft)}
.qtext{font-size:clamp(1.15rem,3vw,1.35rem);font-weight:700;line-height:1.35;max-width:46ch}
body.big .qtext{font-size:clamp(1.35rem,3.6vw,1.6rem)}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600;display:flex;align-items:center;gap:12px;font-size:.98rem;min-width:0}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt .k{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--card-2);font-size:.78rem;font-weight:800;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt[aria-pressed="true"] .k{background:var(--primary);color:var(--primary-ink)}
.opt.right{border-color:var(--leaf);background:color-mix(in oklab,var(--leaf) 12%,var(--card))}
.opt.wrong{border-color:var(--coral)}
.opt:disabled{cursor:default}
body.big .opts{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
body.big .opt{min-height:104px;flex-direction:column;justify-content:center;text-align:center;font-size:1.15rem;border-width:3px}
body.big .opt .k{width:38px;height:38px;font-size:1rem}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ans{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ans:last-child{border-bottom:0}
.ans .m{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.ans .m.y{background:var(--leaf)} .ans .m.n{background:var(--coral)}
.goalrow{display:flex;gap:6px}
.goalrow i{flex:1;height:10px;border-radius:99px;background:var(--card-2)}
.goalrow i.on{background:var(--leaf)}
.ordergame{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.oc{border:1.5px solid var(--line-2);background:var(--card);border-radius:12px;padding:12px;text-align:left;display:flex;gap:10px;align-items:flex-start;min-height:70px}
.oc:hover:not(:disabled){border-color:var(--primary)}
.oc .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--card-2);color:var(--faint);border:1.5px dashed var(--line-2)}
.oc.set .n{background:var(--primary);color:var(--primary-ink);border:0}
.oc.right{border-color:var(--leaf)} .oc.right .n{background:var(--leaf);color:#fff;border:0}
.oc.wrong{border-color:var(--coral)} .oc.wrong .n{background:var(--coral);color:#fff;border:0}
.oc b{display:block;font-size:.86rem;line-height:1.3}
.oc span{font-size:.74rem;color:var(--muted)}
.clue{font-family:var(--doc);font-size:1.12rem;padding:10px 14px;border-radius:10px;background:var(--paper);color:var(--ink);border:1px solid var(--paper-line)}
.clue.hid{background:var(--card-2);color:var(--faint);border-style:dashed;border-color:var(--line-2);font-family:var(--font);font-size:.86rem;font-weight:700}
.qb{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.optin{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.optin input[type=radio]{accent-color:var(--leaf);width:18px;height:18px;margin:0}
.lopt.txt{font-size:1.02rem;line-height:1.3}
.otd .yr{font-family:var(--doc);font-weight:700;font-size:2rem;line-height:1;color:var(--coral)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a href="/history/" aria-label="Arise History home" style="display:flex"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2a8f"/><stop offset="1" stop-color="#6d4fd8"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef5a45"/><stop offset="1" stop-color="#ffb23f"/></linearGradient></defs>
    <rect width="40" height="40" rx="9" fill="url(#lg)"/><path d="M9 28a11 11 0 0 1 22 0z" fill="url(#sg)"/><path d="M7 31h26" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M14 10h12M15 10v7M25 10v7M20 10v7M13 17h14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  </svg></a>
  <span class="wordmark">Arise <b>History</b></span>
  <nav class="topnav" id="nav" aria-label="Sections"></nav>
  <div id="me" class="me-wrap"></div>
</div></header>

<div class="app" id="app">
  <aside class="left" id="left"></aside>
  <main id="main"><div class="loading">Loading Arise History…</div></main>
  <aside class="rail" id="rail"></aside>
</div>
<nav class="bottom" id="bottom" aria-label="Sections"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<canvas id="confetti"></canvas>

<script>
/* ================= ICONS ================= */
const I = {

  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 1.5 2 2 2 0-2 0-4 1-6z"/>',

function sessionToken(){
  try {
    const raw = document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('arise_session='));
    if (!raw) return null;
    const bin = atob(raw.slice('arise_session='.length));
    let data; try { data = JSON.parse(decodeURIComponent(escape(bin))); } catch { data = JSON.parse(bin); }
    return data && data.token ? String(data.token) : null;
  } catch { return null; }
}
class ApiError extends Error { constructor(msg, code, body){ super(msg); this.code = code; this.body = body; } }
async function apiAt(fullPath, opts = {}){
  const headers = { 'Content-Type':'application/json' };
  const t = sessionToken(); if (t) headers.Authorization = `Bearer ${t}`;
  let res;
  try { res = await fetch(fullPath, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store', keepalive: !!opts.keepalive }); }
  catch { throw new ApiError('Can’t reach Arise History. Check your connection and try again.', 0); }
  let body = null; try { body = await res.json(); } catch {}
  if (!res.ok) throw new ApiError(body?.message || 'Something went wrong. Please try again.', res.status, body);
  return body;
}
const api = (path, opts) => apiAt('/api/history' + path, opts);

const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
async function heartbeat(){
  try { const a = await apiAt('/api/club-play/heartbeat', { method:'POST', body:{ sessionId } }); playAccess = a; playErr = null; liveOffset = a.serverNow - Date.now(); return a; }
  catch(e){ playErr = e.message; return null; }
}
function leavePlay(){ clearInterval(beatTimer); beatTimer=null; apiAt('/api/club-play/leave', { method:'POST', body:{ sessionId }, keepalive:true }).catch(()=>{}); }
const playLeft = a => a ? Math.max(0, Math.ceil((a.expiresAt - (Date.now()+liveOffset))/1000)) : 0;
const canPlay = a => !!a && a.allowed && (a.unlimitedThisWeek || (playLeft(a) > 0 && a.leaseUntil > Date.now()+liveOffset));
function closedWhy(a){
  if (!a) return playErr || 'Checking your play time…';
  if (a.closedByAdmin) return 'Games are closed right now. Come back when the game room reopens.';
  if (a.closedByTeacher) return 'Your teacher has closed games for the class right now.';
  if (a.locked) return 'Your teacher has paused games.';
  return a.weeklyUnlimitedOnPass ? 'Today’s play time is used up. Pass a book quiz on A.R.I.S.E. Reader to unlock unlimited play for the rest of this week.' : 'Today’s play time is used up.';
}
async function startGame(kind){
  const a = await heartbeat();
  if (!canPlay(a)) { render(); return; }
  const b = myBand();
  if (kind==='dash') GAME = { kind, items: shuffle(TL[b]).slice(0,4), seq:[], checked:false, over:false, streak: GAME?.kind==='dash' ? GAME.streak : 0 };
  else { const fig = WHO[b][Math.floor(Math.random()*WHO[b].length)]; GAME = { kind, fig, opts: shuffle([fig.a, ...DECOYS[b].filter(d=>d!==fig.a)].slice(0,4)), clues:1, picked:null, over:false }; }
  clearInterval(beatTimer); beatTimer = setInterval(async ()=>{ const x = await heartbeat(); if (GAME && !GAME.over && x && !canPlay(x)) endGame('Play time is up for now.'); }, 8000);
  render();
}
function endGame(msg){
  if (!GAME || GAME.over) return;
  GAME.over = true; leavePlay();
  if (msg) toast(msg);
  if (S.tab==='games') render();
}
function gameBody(){
  const b = myBand();
  if (GAME.kind==='dash'){
    const sorted = [...GAME.items].sort((x,y)=>x[0]-y[0]), all = GAME.checked && GAME.items.every((e,i)=>sorted.indexOf(e)===GAME.seq.indexOf(i));
    return `<div class="card stack"><div class="row between"><div><span class="eyebrow">Timeline Dash</span><h2>Tap from oldest to newest</h2></div><span class="small muted tnum">Streak: ${GAME.streak}</span></div>
      <div class="ordergame">${GAME.items.map((e,i)=>{ const p=GAME.seq.indexOf(i); let cls=p>=0?'set':''; if(GAME.checked) cls = sorted.indexOf(e)===p?'right':'wrong';
        return `<button class="oc ${cls}" data-act="dash" data-v="${i}" ${GAME.checked?'disabled':''}><span class="n">${p>=0?p+1:''}</span><div><b>${esc(e[1])}</b>${GAME.checked?`<span class="tnum">${yfmt(b,e[0])}</span>`:''}</div></button>`; }).join('')}</div>
      <div class="row between"><span class="small" style="font-weight:700">${GAME.checked?(all?'All four in order!':'Not quite. Check the years.'):`${GAME.seq.length} of 4 placed`}</span>
        ${GAME.checked?`<button class="btn primary" data-act="game" data-v="dash">${svg('shuffle')}Next round</button>`:`<button class="btn primary" data-act="dashcheck" ${GAME.seq.length<4?'disabled':''}>Check order</button>`}</div></div>`;
  }
  const f = GAME.fig, stars = GAME.picked===f.a ? 4-GAME.clues : 0;
  return `<div class="card stack"><div><span class="eyebrow">Who Am I?</span><h2>Guess the historical figure</h2></div>
    ${f.c.map((c,i)=>i<GAME.clues||GAME.picked?`<div class="clue">${i+1}. ${esc(c)}</div>`:`<div class="clue hid">Clue ${i+1} hidden</div>`).join('')}

function gamesHTML(){

function liveHTML(){
  const g = S.live;
  if (S.err.live) return errCard(S.err.live, 'retry-live');
  if (g===undefined) return loadingCard('live review');
  if (!g || g.phase==='ended') return `<div class="card stack"><h1>Live review</h1><p class="muted">Put a question on the board and your whole class answers at once from their own devices. Five questions from your class’s History Reads (grades ${bandLabel(S.cls?.settings.band||'g35')}), ${CAT.live.seconds} seconds each.</p>
    <div><button class="btn primary lg" data-act="livestart">${svg('live')}Start a live game</button></div></div>`;
  if (g.phase==='lobby') return `<div class="card stack" style="text-align:center;align-items:center"><span class="eyebrow">Students: open Arise History, then enter this code</span><div class="code">${g.code.slice(0,3)} ${g.code.slice(3)}</div>
    <p class="muted tnum">${g.players.length} joined</p><div class="lobby" style="justify-content:center">${g.players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn primary lg" data-act="livenext" ${g.players.length?'':'disabled'}>Start question 1</button><button class="btn" data-act="liveend">End game</button></div></div>`;
  if (g.phase==='done'){ const top=g.players.slice(0,3);
    return `<div class="card stack"><h1>Game over</h1><div class="podium">${[top[1],top[0],top[2]].map((t,i)=>t?`<div class="pod p${[2,1,3][i]}">${av(t.name)}<b>${esc(t.name)}</b><span class="pts">${t.score} correct</span><div class="blk">${[2,1,3][i]}</div></div>`:'<div></div>').join('')}</div>
      <div class="row"><button class="btn primary" data-act="livestart">Play again</button><button class="btn" data-act="liveend">Close</button></div></div>`; }
  const q = g.question, rev = g.phase==='reveal', total = g.answered;
  return `<div class="card stack"><div class="row between"><span class="eyebrow">Question ${g.qi} of ${g.total} · ${esc(q.t)} · code ${g.code}</span><span class="timer" id="ltimer">${rev?'Time':liveLeft(g)+'s'}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="lq">${q.o.map((o,i)=>`<div class="lopt txt ${rev&&i!==q.a?'dim':''}" style="--c:${cc(LIVE_COLORS[i%4])}"><span>${LETTERS[i]}. ${esc(o)}</span><span class="cnt tnum">${rev?`${g.counts[i]} answered${i===q.a?' · correct':''}`:''}</span><div class="lbar"><i style="width:${rev&&total?g.counts[i]/total*100:0}%"></i></div></div>`).join('')}</div>
    ${rev&&q.why?`<p class="muted">${esc(q.why)}</p>`:''}
    <div class="row between"><span class="small muted tnum">${total} of ${g.players.length} answered</span><div class="row"><button class="btn" data-act="liveend">End game</button><button class="btn primary" data-act="livenext">${rev?(g.qi>=g.total?'Show winners':'Next question'):'Reveal answer'}</button></div></div></div>`;
}

/* ================= CONFETTI ================= */
function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#3f3bd6','#f29a14','#ef5a45','#12a594','#8b5cf6','#ffb23f'];
  const ps=range(1,140).map(()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0; (function loop(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); }); if(++f<120) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

/* ================= DATA ================= */
async function refreshMe(){ try { ME = await api('/me'); render(); } catch {} }
async function loadFor(tab){
  const r = role();
  try {
    if (r==='student'){
      if (tab==='reads' && ME.user.hasClass && S.assign==null){ S.assign = (await api('/assignments')).assignments; }
      if ((tab==='board' || tab==='reads') && S.board==null){ S.board = await api('/board?period='+S.period); }
    } else if (isStaff()){
      if (S.cls==null){ S.cls = await api('/class'); }
      if (tab==='assign' || tab==='class'){ if (S.assign==null) S.assign = (await api('/assignments')).assignments; }
      if (tab==='board'){ S.board = await api('/board?period='+S.period); }
      if (tab==='live' && S.live===undefined){ S.live = (await api('/live/current')).game; }
    } else if (r==='parent'){
      if (S.children==null) S.children = (await api('/children')).children;
    }
    S.err = {};
  } catch(e){
    if (e.body?.setup) return centerMessage('Almost ready', 'Arise History is still being set up. Please check back soon.');
    if (tab==='reads'){ if (S.assign==null) S.assign = []; toast(e.message); }
    else S.err[{board:'board', class:'cls', assign:'cls', live:'live', family:'children', play:'cls'}[tab] || 'board'] = e.message;
  }
  if (ME) render();
}
let polling = false;
setInterval(async ()=>{
  if (polling || !ME) return;
  polling = true;
  try {
    if (role()==='student' && S.lplay && S.tab==='reads'){ const g=(await api(`/live/${S.lplay.id}/play`)).game; liveOffset = g.serverNow - Date.now(); S.lplay.game = g; render(); }
    else if (isStaff() && S.tab==='live' && S.live && ['lobby','q','reveal'].includes(S.live.phase)){ const g=(await api(`/live/${S.live.id}`)).game; liveOffset = g.serverNow - Date.now(); S.live = g; render(); }
  } catch(e){ if (e.code===404 && S.lplay){ S.lplay=null; render(); } }
  finally { polling = false; }
}, 1500);
setInterval(()=>{ const el=document.getElementById('ltimer'); const g = S.lplay?.game || S.live; if (el && g && g.phase==='q') el.textContent = liveLeft(g)+'s'; }, 500);

/* ================= RENDER ================= */
function mainHTML(){
  if (!ME) return landingHTML();
  const r = role();
  if (r==='student'){
    if (S.tab==='reads') return readsHTML();
    if (S.tab==='board') return boardHTML();
    if (S.tab==='rewards') return rewardsHTML();
    if (S.tab==='games') return gamesHTML();
    return meHTML();
  }
  if (isStaff()){
    if (S.tab==='class') return classHTML();
    if (S.tab==='assign') return assignHTML();
    if (S.tab==='live') return liveHTML();
    if (S.tab==='board') return boardHTML();
    return playHTML();
  }
  if (S.tab==='family') return familyHTML();
  return playHTML();
}
function render(){
  document.getElementById('app').className = ME ? 'app' : 'app solo';
  renderChrome();
  document.getElementById('left').innerHTML = ME ? leftHTML() : '';
  document.getElementById('main').innerHTML = mainHTML();
  document.getElementById('rail').innerHTML = ME ? railHTML() : '';
}

/* ================= EVENTS ================= */
async function saveMe(body){
  try { const r = await api('/me', { method:'PUT', body }); ME.profile = r.profile; ME.band = r.band; render(); }
  catch(e){ toast(e.message); }
}
function saveRun(){ if (S.run) store.set('arise_history_run', { id:S.run.session.id, answers:S.run.answers }); }
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.act==='menu')) { S.menu=false; renderChrome(); }
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act==='close'){ if (e.target===el || el.classList.contains('x')) closeModal(); return; }
  if (el.tagName==='A' && act) e.preventDefault();
  switch(act){
    case 'signin': return goSignIn('/');
    case 'join': return goSignIn('/register');
    case 'go': return goSignIn(v);
    case 'menu': S.menu=!S.menu; return renderChrome();
    case 'tab':
      if (S.tab==='games' && v!=='games' && GAME && !GAME.over) endGame();
      S.tab=v; S.menu=false; if (v==='reads'){ S.result=null; S.reading=null; }
      render(); window.scrollTo({top:0}); return loadFor(v);
    case 'home': S.result=null; S.reading=null; render(); return window.scrollTo({top:0});
    case 'band': { if (S.run) return; return saveMe({ band: v || null }).then(()=>{ S.board=null; }); }
    case 'open': S.reading = { readId:v, assignmentId:null }; render(); return window.scrollTo({top:0});
    case 'assignopen': { const a = (S.assign||[]).find(x=>x.id===v); if (!a) return;
      if (a.kind==='read'){ S.reading = { readId:a.readId, assignmentId:a.id }; render(); return window.scrollTo({top:0}); }
      return startQuiz({ type:'assign', assignmentId:a.id }); }
    case 'closeread': S.reading=null; return render();
    case 'speakread': { const r=READ(S.reading?.readId); if (r) speakText(r.title+'. '+r.p.join(' ')+(r.src?' '+r.src.lab+'. '+r.src.text:'')); return; }
    case 'start': { const R = S.reading; return startQuiz(R.assignmentId ? { type:'assign', assignmentId:R.assignmentId } : { type:'read', readId:R.readId }); }
    case 'retake': { const body = S.result?.retake; if (!body) return; S.result=null; S.reading={ readId:body.readId, assignmentId:null }; render(); return window.scrollTo({top:0}); }
    case 'quit': S.run=null; store.set('arise_history_run', null); toast('Quiz left. Nothing was turned in.'); return render();
    case 'pick': S.run.answers[S.run.i] = +v; saveRun(); return render();
    case 'qnext': if (S.run.answers[S.run.i]==null) return; S.run.i++; S.run.peek=false; render(); return speakAuto();
    case 'qprev': S.run.i=Math.max(0,S.run.i-1); S.run.peek=false; return render();
    case 'peek': S.run.peek=!S.run.peek; return render();
    case 'submit': return submitQuiz();
    case 'speak': return speakQuestion();
    case 'a11y': return saveMe({ a11y:{ ...P().a11y, [v]: !P().a11y[v] } });
    case 'style': return saveMe({ avatar:v });
    case 'cert': return certModal(+v);
    case 'period': S.period=v; S.board=null; render(); return loadFor('board');
    case 'retry-board': S.err={}; S.board=null; render(); return loadFor('board');
    case 'retry-class': S.err={}; S.cls=null; render(); return loadFor('class');
    case 'retry-live': S.err={}; S.live=undefined; render(); return loadFor('live');
    case 'retry-children': S.err={}; S.children=null; render(); return loadFor('family');
    case 'game': return startGame(v);
    case 'gameexit': endGame(); return render();
    case 'dash': { if (!GAME||GAME.checked) return; const i=+v, p=GAME.seq.indexOf(i); if (p>=0) GAME.seq.splice(p,1); else if (GAME.seq.length<4) GAME.seq.push(i); return render(); }
    case 'dashcheck': { const sorted=[...GAME.items].sort((x,y)=>x[0]-y[0]); GAME.checked=true; GAME.streak = GAME.items.every((ev,i)=>sorted.indexOf(ev)===GAME.seq.indexOf(i)) ? GAME.streak+1 : 0; return render(); }
    case 'whoclue': GAME.clues=Math.min(3,GAME.clues+1); return render();
    case 'whopick': GAME.picked=v; return render();
    case 'moretime': try { const r = await apiAt('/api/club-play/request-more-time', { method:'POST', body:{ minutes:10 } }); toast(r.message || 'Request sent.'); if (playAccess) playAccess.timeRequestStatus='pending'; render(); } catch(err){ toast(err.message); } return;
    case 'joinlive': {
      const code=(document.getElementById('joinCode').value||'').replace(/\D/g,'');
      if (code.length!==6) return toast('The code has 6 numbers. Check the board.');
      try { const r = await api('/live/join', { method:'POST', body:{ code } }); S.lplay={ id:r.gameId, game:null }; render(); const g=(await api(`/live/${r.gameId}/play`)).game; liveOffset=g.serverNow-Date.now(); S.lplay.game=g; render(); refreshMe(); }
      catch(err){ toast(err.message); }
      return; }
    case 'liveanswer': try { await api(`/live/${S.lplay.id}/answer`, { method:'POST', body:{ value:+v } }); S.lplay.game = { ...S.lplay.game, myAnswer:+v }; render(); } catch(err){ toast(err.message); } return;
    case 'leavelive': S.lplay=null; return render();
    case 'student': return studentModal(v);
    case 'award': try { await api(`/students/${el.dataset.id}/certificate`, { method:'POST', body:{ title:v } }); closeModal(); toast(`${v} certificate sent.`); } catch(err){ toast(err.message); } return;
    case 'classband': try { await api('/class/settings', { method:'PUT', body:{ band:v } }); S.cls=null; render(); return loadFor('class'); } catch(err){ return toast(err.message); }
    case 'bshow': try { await api('/class/settings', { method:'PUT', body:{ boardShow: !S.cls.settings.boardShow } }); S.cls.settings.boardShow=!S.cls.settings.boardShow; S.board=null; render(); return loadFor('board'); } catch(err){ return toast(err.message); }
    case 'assignread': {
      const readId=document.getElementById('aRead').value, due=document.getElementById('aDue').value;
      try { await api('/assignments', { method:'POST', body:{ kind:'read', readId, due } }); toast('Assigned. Your students will see it on their History Reads page.'); S.assign=null; render(); return loadFor('assign'); }
      catch(err){ return toast(err.message); } }
    case 'copt': readBuilder(); S.builder.a=+v; return;
    case 'addchoice': readBuilder(); if (S.builder.o.length<4) S.builder.o.push(''); return render();
    case 'addq': {
      readBuilder(); const b=S.builder, o=b.o.map(x=>x.trim());
      if (!b.q.trim()) return toast('Write the question first.');
      if (o.filter(Boolean).length<2) return toast('Add at least two choices.');
      if (o.some(x=>!x)) return toast('Fill in every choice, or remove the empty one.');
      if (new Set(o.map(x=>x.toLowerCase())).size!==o.length) return toast('Each choice needs to be different.');
      if (S.drafts.length>=CAT.limits.customPerAssignment) return toast(`That’s the most questions for one assignment (${CAT.limits.customPerAssignment}).`);
      S.drafts.push({ q:b.q.trim(), o, a:b.a, why:(b.why||'').trim() }); keep.set('arise_history_drafts', S.drafts);
      S.builder={ q:'', o:['','',''], a:0, why:'' }; return render(); }
    case 'delq': S.drafts.splice(+v,1); keep.set('arise_history_drafts', S.drafts); return render();
    case 'assigncustom': {
      readBuilder(); const due=document.getElementById('cDue').value;
      try {
        await api('/assignments', { method:'POST', body:{ kind:'custom', title:S.draftMeta.title, note:S.draftMeta.note, due, questions:S.drafts } });
        S.drafts=[]; keep.set('arise_history_drafts', []); S.draftMeta={title:'',note:''}; keep.set('arise_history_draft_meta', S.draftMeta);
        toast('Assigned. Your students will see it on their History Reads page.'); S.assign=null; render(); return loadFor('assign');
      } catch(err){ return toast(err.message); } }
    case 'unassign': try { await api(`/assignments/${v}`, { method:'DELETE' }); S.assign=S.assign.filter(a=>a.id!==v); render(); } catch(err){ toast(err.message); } return;
    case 'livestart': try { S.live = (await api('/live', { method:'POST' })).game; render(); } catch(err){ toast(err.message); } return;
    case 'livenext': try { S.live = (await api(`/live/${S.live.id}/next`, { method:'POST' })).game; liveOffset = S.live.serverNow - Date.now(); render(); } catch(err){ toast(err.message); } return;
    case 'liveend': try { if (S.live) await api(`/live/${S.live.id}`, { method:'DELETE' }); } catch {} S.live=null; return render();
    case 'child': S.childId=+v; return render();
  }
});
document.addEventListener('change', async e=>{
  if (e.target.id==='bsetBy'){ try { await api('/class/settings', { method:'PUT', body:{ boardBy:e.target.value } }); S.cls.settings.boardBy=e.target.value; S.board=null; render(); loadFor('board'); } catch(err){ toast(err.message); } }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Escape'){ if (document.getElementById('modalRoot').innerHTML) closeModal(); if (S.menu){ S.menu=false; renderChrome(); } return; }
  if (e.key==='Enter' && e.target.id==='joinCode'){ e.preventDefault(); document.querySelector('[data-act="joinlive"]')?.click(); return; }
  if (!S.run || S.tab!=='reads' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = 'abcd'.indexOf(e.key.toLowerCase());
  if (k>=0 && k<S.run.session.items[S.run.i].o.length){ S.run.answers[S.run.i]=k; saveRun(); render(); }
});
window.addEventListener('pagehide', ()=>{ if (GAME && !GAME.over) leavePlay(); });

/* ================= START ================= */
(async function start(){
  try { CAT = await api('/catalog'); }
  catch(e){ return centerMessage('Arise History can’t load right now', esc(e.message || 'Please try again in a minute.'), '<button class="btn primary" style="margin-top:16px" onclick="location.reload()">Try again</button>'); }
  if (!sessionToken()) return render();
  try { ME = await api('/me'); }
  catch(e){
    if (e.code===401){ ME=null; return render(); }
    if (e.body?.setup) return centerMessage('Almost ready', 'Arise History is still being set up. Please check back soon.');
    if (e.code===402) return centerMessage('Arise History is part of Teacher Premium', esc(e.message), '<a class="btn primary" style="margin-top:16px" href="/pricing">See plans</a>');
    return centerMessage('Arise History can’t load right now', esc(e.message), '<button class="btn primary" style="margin-top:16px" onclick="location.reload()">Try again</button>');
  }
  S.tab = tabs()[0]?.[0];
  const open = store.get('arise_history_run');
  if (open && role()==='student'){
    try { const r = await api(`/quizzes/${open.id}`); if (r.session.status==='open') S.run = { session:r.session, i:Math.min((open.answers||[]).filter(x=>x!=null).length, r.session.n-1), answers:open.answers||[], peek:false }; else store.set('arise_history_run', null); }
    catch { store.set('arise_history_run', null); }
  }
  render();
  loadFor(S.tab);
})();
</script>
