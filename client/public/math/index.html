/* ---------------- answers ---------------- */
const numOf = s => parseNum(String(s ?? '').replace(/,(?=\d{3}\b)/g, ''));
/** Same rules as shared/ariseMathPhoto.ts: "x = 3/4", "0.75", "1 1/2", "24 sq ft". */
function normAns(raw){
  let s = String(raw ?? '').toLowerCase().replace(/[−–—]/g,'-').replace(/\$/g,'').replace(/,(?=\d{3}\b)/g,'');
  return s.replace(/\s+/g,'').replace(/^[a-z]=/,'').replace(/\.$/,'').replace(/\*\*/g,'^').slice(0,80);
}
function ansNum(raw){
  const s = normAns(raw);
  let m = s.match(/^(-?\d+)(\d+)\/(\d+)$/);
  if (m && /\d\s+\d+\/\d/.test(String(raw))) { const w=+m[1], f=+m[2]/+m[3]; return w<0 ? w-f : w+f; }
  const t = s.replace(/%$/,'').replace(/(cm|mm|m|km|in|ft|yd|mi|g|kg|lb|oz|l|ml|units?|sq\.?units?|degrees?|°|cents?|¢)\^?\d?$/,'');
  m = t.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m) return +m[2] ? +m[1] / +m[2] : NaN;
  return /^-?(\d+\.?\d*|\.\d+)$/.test(t) ? Number(t) : NaN;
}
function ansMatch(given, want){
  const g = normAns(given); if (!g) return false;
  const w = normAns(want); if (w && w===g) return true;
  const a = ansNum(given), b = ansNum(want);
  if (!Number.isNaN(a) && !Number.isNaN(b) && Math.abs(a-b) <= 1e-6*Math.max(1,Math.abs(b))) return true;
  const parts = x => String(x).split(/,|;|\bor\b|\band\b/i).map(normAns).filter(Boolean).sort();
  const wp = parts(want), gp = parts(given);
  return wp.length>1 && wp.length===gp.length && wp.every((p,i)=>p===gp[i] || (!Number.isNaN(ansNum(p)) && ansNum(p)===ansNum(gp[i])));
}

/* ---------------- Solve it with me ---------------- */
/** Finds the number a student can fill in for a step ("8 + 2 = [10]."), or null for a read-only step. */
function blankOf(html){
  if (/^\s*Check\b/i.test(String(html).replace(/<[^>]+>/g,''))) return null;   // a check repeats the given numbers
  const parts = String(html).split(/(<[^>]+>)/);
  let depth = 0;
  const inSpan = parts.map(p => { if (p.startsWith('<')) { if (/^<span\b/i.test(p)) depth++; else if (/^<\/span/i.test(p)) depth = Math.max(0, depth-1); return true; } return depth>0; });
  const NUM = '([−-]?\\d+(?:,\\d{3})*(?:\\.\\d+)?)';
  const cut = (i, pos, num) => ({
    before: parts.slice(0,i).join('') + parts[i].slice(0,pos),
    after: parts[i].slice(pos + num.length) + parts.slice(i+1).join(''),
    value: Number(num.replace(/,/g,'').replace('−','-')), raw: num,
  });
  for (let i=parts.length-1; i>=0; i--){
    if (inSpan[i]) continue;
    const t = parts[i], re = new RegExp('=\\s*'+NUM, 'g'); let m, last=null;
    while ((m = re.exec(t))){
      const rest = t.slice(m.index + m[0].length), left = t.slice(0, m.index).split(/[.:;]\s/).pop();
      if (/^\s*(?:[×÷+\-−·*/^]\s*[\d(]|\d|\.\d)/.test(rest)) continue;   // the sum keeps going
      if (/\?/.test(left)) continue;                                        // "5 × ? = 15": 15 is given
      if (/^\s*0\b/.test(m[1]) && /\)/.test(left)) continue;              // "(x + 3)(x − 2) = 0"
      last = m; }
    if (last) return cut(i, last.index + last[0].length - last[1].length, last[1]);
  }
  for (let i=parts.length-1; i>=0; i--){
    if (parts[i].startsWith('<') || !parts[i].trim()) continue;
    if (inSpan[i]) break;
    const m = parts[i].match(new RegExp('\\b(?:is|are|on|makes|gives|get|equals|be|rounds to)\\s+'+NUM+'(?=(?:\\s+[A-Za-z¢%°]+){0,2}\\s*[.!]?\\s*$)'));
    if (m) return cut(i, m.index + m[0].length - m[1].length, m[1]);
    break;
  }
  return null;
}
const plainHTML = h => { const d=document.createElement('div'); d.innerHTML=String(h); d.querySelectorAll('.fr').forEach(f=>{ const [a,b]=f.children; if (a&&b) f.textContent=` ${a.textContent} over ${b.textContent} `; }); return d.textContent.replace(/\s+/g,' ').trim(); };

function wkState(){ const L=S.lesson; if (!L.wk || L.wk.ex!==L.ex) L.wk = { ex:L.ex, i:0, st:[], tries:0, fb:null }; return L.wk; }
function walkthroughHTML(){
  const L = S.lesson;
  if (L.err) return `<p class="small muted">${esc(L.err)}</p>`;
  if (!L.ex) return '<p class="small muted">Loading…</p>';
  const p = L.ex, W = wkState(), n = p.steps.length, done = W.i >= n;
  const dots = `<div class="wk-dots" aria-label="Step ${Math.min(W.i+1,n)} of ${n}">${p.steps.map((_,j)=>`<i class="${W.st[j]==='shown'?'shown':W.st[j]?'ok':j===W.i?'on':''}"></i>`).join('')}<span class="small muted" style="margin-left:6px">${done?'All steps done':`Step ${W.i+1} of ${n}`}</span></div>`;
  const items = p.steps.slice(0, Math.min(W.i+1, n)).map((st, j) => {
    const b = blankOf(st), cur = j===W.i && !done;
    let txt;
    if (b && cur) txt = `${b.before}<input class="wk-in ${W.bad?'is-bad':''}" id="wkIn" form="wkForm" autocomplete="off" spellcheck="false" inputmode="${b.value<0?'text':'decimal'}" aria-label="Fill in the missing number" placeholder="?">${b.after}`;
    else if (b) txt = `${b.before}<span class="fill">${esc(b.raw)}</span>${b.after}`;
    else txt = st;
    const act = !cur ? '' : b
      ? `<form id="wkForm" class="wk-act" autocomplete="off"><button class="btn primary" type="submit">${svg('check')}Check</button>${W.tries?`<button class="btn" type="button" data-act="wkshow">${svg('eye')}Show me</button>`:''}${canSpeak?`<button class="btn sm" type="button" data-act="wkread" data-v="${j}" aria-label="Read this step out loud">${svg('speaker')}</button>`:''}</form>`
      : `<div class="wk-act"><button class="btn primary" data-act="wkgot">${j===n-1?'Finish':'Got it, next step'} →</button>${canSpeak?`<button class="btn sm" data-act="wkread" data-v="${j}" aria-label="Read this step out loud">${svg('speaker')}</button>`:''}</div>`;
    const fb = cur && W.fb ? `<p class="wk-fb ${W.fb.c}" role="status">${esc(W.fb.t)}</p>` : '';
    const tip = cur && b && !W.tries ? `<p class="wk-fb tip">Work out the missing number, then press Check.</p>` : '';
    return `<li class="wk-step ${cur?'cur':W.st[j]==='shown'?'shown':'ok'}"><div><div class="txt">${txt}</div>${tip}${fb}${act}</div></li>`;
  }).join('');
  const lastB = blankOf(p.steps[n-1]), needFinal = p.kind==='choice' || !(lastB && Math.abs(lastB.value - Number(p.answer)) < 1e-9);
  if (done && needFinal && !W.fin) {
    const ask = p.kind==='choice'
      ? `<div class="choices" style="margin-top:10px">${p.choices.map(c=>`<button type="button" data-act="wkpick" data-v="${esc(c.v)}" class="${W.fwrong?.includes(String(c.v))?'is-bad':''}" ${W.fwrong?.includes(String(c.v))?'disabled':''}>${esc(c.label)}</button>`).join('')}</div>`
      : `<form id="wkFinForm" class="wk-act" autocomplete="off"><label for="wkFin" class="sr">The answer</label><input class="wk-in ${W.bad?'is-bad':''}" id="wkFin" spellcheck="false" placeholder="?" inputmode="${Number(p.answer)<0?'text':'decimal'}" style="width:7em"><button class="btn primary" type="submit">${svg('check')}Check</button>${W.ftries?`<button class="btn" type="button" data-act="wkfinshow">${svg('eye')}Show me</button>`:''}</form>`;
    return `<div class="wk">
      <div class="wk-prob"><p class="ask" style="margin:0">${esc(p.ask)}</p><div class="prompt ${p.long?'long':''}">${p.prompt}</div>${p.viz?`<div class="viz-wrap">${p.viz}</div>`:''}</div>
      ${dots}<ol class="wk-list">${items}</ol>
      <div class="wk-step cur" style="grid-template-columns:minmax(0,1fr)"><div><b>Last step: you answer it</b><p class="txt" style="margin-top:4px">Use the steps above to answer the question.</p>${ask}${W.fb?`<p class="wk-fb ${W.fb.c}" role="status">${esc(W.fb.t)}</p>`:''}</div></div></div>`;
  }
  const win = done ? `<div class="wk-win" role="status"><h3>${W.st.every(x=>x!=='shown') && W.fin!=='shown'?'You did every step yourself!':'You worked it out!'}</h3>
      <div class="row" style="gap:10px"><span class="muted">Answer</span><span class="big">${esc(p.answerLabel)}</span></div>
      <p class="small muted">Now try one on your own. The steps are there if you need them.</p>
      <div class="row" style="gap:8px"><button class="btn primary" data-act="lmode" data-v="guided">${svg('hand')}Your turn</button><button class="btn outline" data-act="exnew">${svg('plus')}Do another with me</button></div></div>` : '';
  return `<div class="wk">
    <div class="wk-prob"><p class="ask" style="margin:0">${esc(p.ask)}</p><div class="prompt ${p.long?'long':''}">${p.prompt}</div>${p.viz?`<div class="viz-wrap">${p.viz}</div>`:''}</div>
    ${dots}<ol class="wk-list">${items}</ol>${win}
    ${done?'':`<div class="row" style="gap:8px"><button class="btn sm" data-act="exnew">${svg('plus')}Different numbers</button><button class="btn sm" data-act="wkall">Show every step</button></div>`}</div>`;
}
function paintWk(focus=true){
  const box = document.getElementById('wkBox');

  if (focus) setTimeout(()=>{ const i=document.getElementById('wkIn') || document.getElementById('wkFin'); if (i) i.focus({preventScroll:true}); else document.querySelector('[data-act="wkgot"]')?.focus({preventScroll:true}); }, 0);
}
function wkAdvance(mark){
  const W = wkState(), p = S.lesson.ex; W.st[W.i] = mark; W.i++; W.tries=0; W.fb=null; W.bad=false;
  if (W.i >= p.steps.length && p.kind!=='choice' && W.st.every(x=>x!=='shown')) { const b = blankOf(p.steps[p.steps.length-1]); if (b && Math.abs(b.value - Number(p.answer)) < 1e-9) confetti(); }
  paintWk();
  setTimeout(()=>document.querySelector('.wk-step.cur, .wk-win')?.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}), 30);
}
function wkCheck(){
  const W = wkState(), b = blankOf(S.lesson.ex.steps[W.i]); if (!b) return wkAdvance('ok');
  const raw = document.getElementById('wkIn')?.value || '';
  if (!raw.trim()) { W.fb={c:'tip', t:'Type a number in the box first.'}; return paintWk(); }
  const v = numOf(raw);
  if (Number.isNaN(v)) { W.fb={c:'bad', t:'Type a number, like 12, −3, 3/4 or 2.5.'}; W.bad=true; return paintWk(); }
  if (Math.abs(v - b.value) < 1e-9) { return wkAdvance('ok'); }
  W.tries++; W.bad=true;
  W.fb = { c:'bad', t: W.tries>=2 ? 'Not quite. Tap “Show me” to see it, then keep going.' : 'Not quite. Look at the picture and the step again, then try once more.' };
  paintWk();
}

function wkFinal(v, shown){
  const W = wkState(), p = S.lesson.ex;
  if (shown) { W.fin = 'shown'; W.fb = null; return paintWk(); }
  const ok = p.kind==='choice' ? String(v)===String(p.answer) : Math.abs(numOf(v) - Number(p.answer)) < 1e-9;
  if (p.kind!=='choice' && Number.isNaN(numOf(v))) { W.fb = { c:'bad', t:'Type a number, like 12, −3, 3/4 or 2.5.' }; W.bad = true; return paintWk(); }
  if (ok) { W.fin = 'ok'; W.fb = null; W.bad = false; if (W.st.every(x=>x!=='shown')) confetti(); return paintWk(); }
  W.ftries = (W.ftries||0) + 1; W.bad = true;

}

    <div class="card"><div class="card-h"><h2>Practice your way</h2><span class="small muted">${student?'Quizzes earn points. The rest are practice.':'Practice is for learning, so no points.'}</span></div>
      <div class="modes">${student?`<button class="mode" data-act="start" data-type="skill" data-v="${L.skill}">${ico('award','primary')}<b>Quiz for points</b><span>Five questions that count on the leaderboard.</span></button>`:''}
        ${Object.entries(MODES).map(([id,m])=>`<button class="mode" data-act="lmode" data-v="${id}">${ico(m.icon,m.c)}<b>${m.name}</b><span>${m.note}</span>${id==='speed'&&bestSpeed(L.skill)?`<em>Your best: ${bestSpeed(L.skill)}</em>`:''}</button>`).join('')}</div></div>
    <div class="card"><div class="card-h"><h2>Print a worksheet</h2><span class="small muted">12 new problems with an answer key</span></div>
      <div class="levels">${['scaffold','standard','challenge'].map(id=>`<div class="level"><div><b>${esc(lv[id]?.name||id)}</b><span class="small muted">${esc(lv[id]?.note||'')}</span></div><button class="btn ${id==='standard'?'primary':'outline'} sm" data-act="lprint" data-v="${id}">${svg('print')}Print</button></div>`).join('')}</div></div>`;
}

/* ---------------- Snap a problem ---------------- */
function snapPromoHTML(lead){
  return `<div class="card snap-promo"><div class="cam">${svg('camera')}</div><div><h2>${esc(lead || 'Stuck on a problem?')}</h2><p class="small muted">Snap a photo or a screenshot. We’ll walk through it one step at a time, you find the answer, then practice a few like it.</p></div><button class="btn primary" data-act="snap">${svg('camera')}Snap a problem</button></div>`;
}
const newSnap = () => ({ stage:'pick', img:null, text:'', err:null, reply:null, si:0, sst:[], stries:0, sfb:null, fin:{ fb:null, right:false, busy:false, tries:0 }, ex:[] });
function snapHTML(){
  const N = S.snap, head = `<div class="card"><div class="row" style="gap:10px;flex-wrap:nowrap;align-items:center"><button class="btn sm" data-act="snapclose">${svg('back')}Back</button><span class="small muted">Snap a problem</span></div>`;
  if (N.stage==='loading') return `${head}<div class="snap-wait" role="status"><div class="spin" aria-hidden="true"></div><h2>Reading your problem…</h2><p class="muted small">Working out the steps. This takes a few seconds.</p></div></div>`;
  if (N.stage==='pick') return `${head}<h1 style="margin-top:12px">Snap a problem</h1><p class="muted" style="margin-top:4px">Take a photo of one problem, upload a screenshot, or type it. You’ll get the steps, not the answer.</p></div>
    <div class="card stack">
      ${N.err?`<p class="feedback bad" role="alert">${esc(N.err)}</p>`:''}
      <div class="drop" id="snapDrop">
        ${N.img?`<img class="snap-img" src="${N.img}" alt="Your problem"><button class="btn sm" data-act="snapclear">${svg('x')}Use a different picture</button>`
          :`<div class="cam" style="width:56px;height:56px;border-radius:16px;background:var(--primary-soft);color:var(--primary-text);display:grid;place-items:center">${svg('camera','style="width:30px;height:30px"')}</div>
          <div class="btns"><label class="btn primary">${svg('camera')}Take a photo<input type="file" id="snapCam" accept="image/*" capture="environment"></label>
            <label class="btn outline">${svg('image')}Upload a screenshot<input type="file" id="snapFile" accept="image/*"></label></div>
          <p class="small muted">On a computer you can also paste a screenshot here (Ctrl+V or ⌘V), or drag a picture in.</p>`}
      </div>
      <label class="f"><span class="small muted">${N.img?'Anything to add? (optional, like “just number 4”)':'Or type the problem'}</span><textarea class="snap-text" id="snapText" maxlength="600" placeholder="${N.img?'Number 4 please':'Example: 3x + 5 = 20'}">${esc(N.text)}</textarea></label>
      <div class="row" style="gap:8px"><button class="btn primary" data-act="snapgo">${svg('hand')}Help me solve it</button></div>
      <p class="small muted">Tips: one problem at a time, good light, and hold the camera straight over the page.</p>
    </div>`;
  const R = N.reply;
  return `${head}<div style="margin-top:12px" class="stack"><span class="eyebrow">${esc(R.topic)}</span>
      ${N.img?`<img class="snap-img" src="${N.img}" alt="Your problem" style="max-height:200px;margin:0">`:''}
      <div class="snap-prob">${esc(R.problem)}</div>
      <div class="row" style="gap:8px"><button class="btn sm" data-act="snapfix">Not the right problem? Fix it</button><button class="btn sm" data-act="snapnew">${svg('camera')}Snap another</button></div></div></div>
    ${R.bigIdea?`<div class="card idea"><span class="eyebrow">Big idea</span><p>${esc(R.bigIdea)}</p></div>`:''}
    <div class="card stack"><div class="card-h" style="margin-bottom:0"><div><h2>Let’s solve it step by step</h2><span class="small muted">You do the math in each step. The answer is yours to find.</span></div></div><div id="snapSteps">${snapStepsHTML()}</div></div>
    <div id="snapFinish">${snapFinishHTML()}</div>
    ${videoCardHTML('snap', R.skill, R.videoSearch)}
    ${R.examples.length?`<div class="card stack"><div class="card-h" style="margin-bottom:0"><div><h2>Practice problems like it</h2><span class="small muted">Try each one. If you get stuck, open the steps one at a time.</span></div></div><div id="snapEx" class="stack">${snapExamplesHTML()}</div></div>`:''}
    ${R.skill?`<div class="card snap-promo"><div class="cam">${op(R.skill)}</div><div><h2>${esc(SK(R.skill).name)}</h2><p class="small muted">Open the lesson for more worked examples and practice with points.</p></div><button class="btn outline" data-act="snaplearn" data-v="${esc(R.skill)}">Open the lesson</button></div>`:''}`;
}
function snapStepsHTML(){
  const N = S.snap, R = N.reply, n = R.steps.length, done = N.si >= n;
  const items = R.steps.slice(0, Math.min(N.si+1, n)).map((st, j) => {
    const cur = j===N.si && !done;
    const ask = st.ask && st.check ? (cur
      ? `<form id="snapStepForm" class="wk-act" autocomplete="off" style="align-items:center"><label for="snapStepIn" class="txt" style="font-weight:700">${esc(st.ask)}</label><input class="wk-in ${N.sbad?'is-bad':''}" id="snapStepIn" spellcheck="false" placeholder="?" style="width:7em"><button class="btn primary" type="submit">${svg('check')}Check</button>${N.stries?`<button class="btn" type="button" data-act="snapshow">${svg('eye')}Show me</button>`:''}</form>`
      : `<p class="txt" style="margin-top:6px">${esc(st.ask)} <span class="fill">${esc(st.check)}</span></p>`) : '';
    const fb = cur && N.sfb ? `<p class="wk-fb ${N.sfb.c}" role="status">${esc(N.sfb.t)}</p>` : '';
    const got = cur && !(st.ask && st.check) ? `<div class="wk-act"><button class="btn primary" data-act="snapgot">Got it, next step →</button>${canSpeak?`<button class="btn sm" data-act="snapread" data-v="${j}" aria-label="Read this step out loud">${svg('speaker')}</button>`:''}</div>` : '';
    return `<li class="wk-step ${cur?'cur':N.sst[j]==='shown'?'shown':'ok'}"><div><b>${esc(st.title)}</b><p class="txt" style="margin-top:4px">${esc(st.explain)}</p>${ask}${fb}${got}</div></li>`;
  }).join('');
  const dots = `<div class="wk-dots">${R.steps.map((_,j)=>`<i class="${N.sst[j]==='shown'?'shown':N.sst[j]?'ok':j===N.si?'on':''}"></i>`).join('')}<span class="small muted" style="margin-left:6px">${done?'Steps done. Now finish it below.':`Step ${N.si+1} of ${n}`}</span></div>`;
  return `${dots}<ol class="wk-list" style="margin-top:12px">${items}</ol>`;
}
function snapFinishHTML(){
  const N = S.snap, R = N.reply, F = N.fin;
  if (N.si < R.steps.length) return '';
  if (F.right) return `<div class="card wk-win" role="status"><h3>Yes! You solved it.</h3><p>You found the answer yourself. Try the practice problems below to lock it in.</p></div>`;
  return `<div class="card snap-finish"><span class="eyebrow">Your turn to finish</span><p class="txt" style="font-size:1.08rem;margin-top:6px">${esc(R.finish)}</p>
    <form id="snapFinForm" autocomplete="off"><label for="snapFinIn" class="sr">Your answer</label><input type="text" id="snapFinIn" placeholder="Your answer (${esc(R.answerForm)})" spellcheck="false"><button class="btn primary" type="submit" ${F.busy?'disabled':''}>${svg('check')}Check my answer</button></form>
    ${F.fb?`<p class="wk-fb ${F.fb.c}" role="status">${esc(F.fb.t)}</p>`:''}</div>`;
}
function snapExamplesHTML(){
  const N = S.snap;
  return N.reply.examples.map((e, k) => {
    const X = N.ex[k] || (N.ex[k] = { shown:0, fb:null, done:false, ans:false });
    const steps = X.shown ? `<ol>${e.steps.slice(0, X.shown).map(s=>`<li><b>${esc(s.title)}</b>${esc(s.work)}</li>`).join('')}</ol>` : '';
    const more = X.shown < e.steps.length ? `<button class="btn sm" data-act="exsstep" data-v="${k}">${X.shown?`Next step (${X.shown+1} of ${e.steps.length})`:'Show the first step'}</button>` : '';
    return `<div class="exq"><span class="eyebrow">Practice ${k+1}</span><div class="q">${esc(e.problem)}</div>
      ${X.done?`<p class="ans">${svg('check','style="width:18px;height:18px;vertical-align:-3px"')} ${esc(e.answer)}${X.ans?'':' · You got it!'}</p>`
        :`<form class="exform" data-k="${k}" autocomplete="off"><label class="sr" for="exIn${k}">Your answer</label><input type="text" id="exIn${k}" placeholder="Your answer" spellcheck="false"><button class="btn primary sm" type="submit">Check</button></form>`}
      ${X.fb && !X.done?`<p class="wk-fb ${X.fb.c}" role="status">${esc(X.fb.t)}</p>`:''}
      ${steps}<div class="row" style="gap:8px">${more}${X.done?'':`<button class="btn sm" data-act="exsans" data-v="${k}">Show the answer</button>`}</div></div>`;
  }).join('');
}
function paintSnap(part){
  const ids = { steps:['snapSteps', snapStepsHTML], fin:['snapFinish', snapFinishHTML], ex:['snapEx', snapExamplesHTML] };
  const [id, fn] = ids[part] || []; const el = id && document.getElementById(id);
  if (!el) return render();
  el.innerHTML = fn();
}
async function shrinkImage(file){
  if (!file) throw new Error('No picture was picked.');
  if (file.type && !/^image\//.test(file.type)) throw new Error('Pick a photo or a screenshot (JPG or PNG).');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('That picture couldn’t be opened. Try a JPG or PNG, or a screenshot.')); i.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}
async function takeImage(file){
  if (!S.snap) return;
  try { S.snap.img = await shrinkImage(file); S.snap.err = null; }
  catch (e) { S.snap.err = e.message; }
  render();
}
async function snapGo(){
  const N = S.snap; N.text = (document.getElementById('snapText')?.value || '').trim();
  if (!N.img && !N.text) { N.err = 'Add a photo or screenshot of the problem, or type it in.'; return render(); }
  N.stage = 'loading'; N.err = null; render(); window.scrollTo({top:0});
  try {
    const r = await api('/photo-help', { method:'POST', body:{ image:N.img, text:N.text } });
    if (S.snap !== N) return;
    if (r.notMath) { N.stage='pick'; N.err=r.notMath; return render(); }
    Object.assign(N, { stage:'help', reply:r, si:0, sst:[], stries:0, sfb:null, sbad:false, fin:{ fb:null, right:false, busy:false, tries:0 }, ex:[] });
    if (S.vids) delete S.vids.snap;
  } catch (e) { if (S.snap !== N) return; N.stage='pick'; N.err = e.message; }
  render(); window.scrollTo({top:0});
}
function snapAdvance(mark){
  const N = S.snap; N.sst[N.si] = mark; N.si++; N.stries=0; N.sfb=null; N.sbad=false;
  paintSnap('steps'); paintSnap('fin');
  setTimeout(()=>{ const t = document.getElementById('snapStepIn') || document.getElementById('snapFinIn'); t?.focus({preventScroll:true}); (document.querySelector('#snapSteps .wk-step.cur') || document.getElementById('snapFinish'))?.scrollIntoView({block:'nearest', behavior:'smooth'}); }, 30);
}
function snapStepCheck(){
  const N = S.snap, st = N.reply.steps[N.si], v = document.getElementById('snapStepIn')?.value || '';
  if (!v.trim()) { N.sfb = { c:'tip', t:'Type your answer in the box first.' }; return paintSnap('steps'); }
  if (ansMatch(v, st.check)) return snapAdvance('ok');
  N.stries++; N.sbad = true;
  N.sfb = { c:'bad', t: (st.hint && N.stries===1 ? 'Not quite. Hint: ' + st.hint : N.stries>=2 ? 'Not quite. Tap “Show me” to see this step, then keep going.' : 'Not quite. Read the step again and try once more.') };
  paintSnap('steps');
  setTimeout(()=>document.getElementById('snapStepIn')?.focus({preventScroll:true}), 0);
}
async function snapFinish(){
  const N = S.snap, F = N.fin, v = (document.getElementById('snapFinIn')?.value || '').trim();
  if (!v) { F.fb = { c:'tip', t:'Type your answer first.' }; return paintSnap('fin'); }
  F.busy = true; paintSnap('fin');
  try {
    const r = await api(`/photo-help/${encodeURIComponent(N.reply.id)}/check`, { method:'POST', body:{ answer:v } });
    F.busy = false;
    if (r.right) { F.right = true; confetti(); }
    else { F.tries++; F.fb = { c:'bad', t: F.tries>=3 ? 'Not yet. Try the practice problems below. They show every step, then come back to this one.' : 'Not yet. Go back over each step, check your math, and try again.' }; }
  } catch (e) { F.busy = false; F.fb = { c:'bad', t:e.message }; }
  paintSnap('fin');
  if (!F.right) setTimeout(()=>{ const i=document.getElementById('snapFinIn'); if (i){ i.value=v; i.focus({preventScroll:true}); } }, 0);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  switch (act) {
    case 'tab': S.snap = null; return;
    case 'wkgot': return wkAdvance('ok');
    case 'wkpick': return wkFinal(v);
    case 'wkfinshow': return wkFinal(null, true);
    case 'wkshow': return wkAdvance('shown');
    case 'wkall': { const W = wkState(); for (let j=W.i; j<S.lesson.ex.steps.length; j++) W.st[j]='shown'; W.i = S.lesson.ex.steps.length; W.fin = 'shown'; W.fb = null; return paintWk(false); }
    case 'wkread': { const st = S.lesson?.ex?.steps[+v]; if (!st) return; const b = blankOf(st); return speakText(plainHTML(b && +v===wkState().i ? b.before + ' what number? ' + b.after : st)); }
    case 'vidplay': { S.vids[v].playing = true; return paintVideo(v); }
    case 'vidpick': { S.vids[v].i = +el.dataset.i; S.vids[v].playing = true; return paintVideo(v); }
    case 'snap': S.snap = newSnap(); render(); window.scrollTo({top:0}); return;
    case 'snapclose': S.snap = null; render(); window.scrollTo({top:0}); return;
    case 'snapnew': S.snap = newSnap(); render(); window.scrollTo({top:0}); return;
    case 'snapclear': S.snap.img = null; return render();
    case 'snapgo': return snapGo();
    case 'snapfix': { const p = S.snap.reply?.problem || ''; S.snap = Object.assign(newSnap(), { text:p }); render(); setTimeout(()=>document.getElementById('snapText')?.focus(), 0); return; }
    case 'snapgot': return snapAdvance('ok');
    case 'snapshow': return snapAdvance('shown');
    case 'snapread': { const st = S.snap?.reply?.steps[+v]; if (st) speakText(st.title + '. ' + st.explain + (st.ask ? ' ' + st.ask : '')); return; }
    case 'snaplearn': S.snap = null; return openLesson(v);
    case 'exsstep': { const X = S.snap.ex[+v]; X.shown++; return paintSnap('ex'); }
    case 'exsans': { const X = S.snap.ex[+v]; X.shown = S.snap.reply.examples[+v].steps.length; X.done = true; X.ans = true; return paintSnap('ex'); }
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id==='wkForm') { e.preventDefault(); return wkCheck(); }
  if (f.id==='wkFinForm') { e.preventDefault(); const v = document.getElementById('wkFin')?.value || ''; if (!v.trim()) { wkState().fb = { c:'tip', t:'Type your answer first.' }; return paintWk(); } return wkFinal(v); }
  if (f.id==='snapStepForm') { e.preventDefault(); return snapStepCheck(); }
  if (f.id==='snapFinForm') { e.preventDefault(); return snapFinish(); }
  if (f.classList?.contains('exform')) {
    e.preventDefault();
    const k = +f.dataset.k, X = S.snap.ex[k], ex = S.snap.reply.examples[k], v = document.getElementById('exIn'+k)?.value || '';
    if (!v.trim()) { X.fb = { c:'tip', t:'Type your answer first.' }; return paintSnap('ex'); }
    if (ansMatch(v, ex.answer)) { X.done = true; X.shown = ex.steps.length; X.fb = null; }
    else X.fb = { c:'bad', t: X.shown < ex.steps.length ? 'Not quite. Open the next step for help.' : 'Not quite. Look over the steps and try again.' };
    paintSnap('ex');
  }
});
document.addEventListener('input', e => { if (e.target.id==='snapText' && S.snap) S.snap.text = e.target.value; if (e.target.classList?.contains('wk-in')) e.target.classList.remove('is-bad'); });
document.addEventListener('change', e => { if ((e.target.id==='snapCam' || e.target.id==='snapFile') && e.target.files?.[0]) takeImage(e.target.files[0]); });
document.addEventListener('paste', e => {
  if (!S.snap || S.snap.stage!=='pick') return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); takeImage(item.getAsFile()); }
});
document.addEventListener('dragover', e => { const d = e.target.closest?.('#snapDrop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#snapDrop')?.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest?.('#snapDrop'); if (!d) return; e.preventDefault(); d.classList.remove('over'); const f = [...(e.dataTransfer?.files || [])].find(x => x.type.startsWith('image/')); if (f) takeImage(f); });
</script>
<script src="/addons/addon-bar.js" defer></script>
