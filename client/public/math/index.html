<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arise Math: K–12 math quizzes with picture models, step-by-step hints, points, a class leaderboard and certificates. Teachers assign practice and run live review games; parents follow along. Part of A.R.I.S.E. Reader.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://www.arisereader.com/math/">
<link rel="icon" href="/favicon.ico">
<title>Arise Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: Arise family shell (matches Arise Social) — profile card left · work center · class rail right; icon nav on top, tab bar on phones.
   Indigo for actions, sunrise gradient on covers and the quiz header, sun gold for points. */
:root{
  --bg:#f2f1f6; --card:#ffffff; --card-2:#f6f5fa; --line:#e4e2ec; --line-2:#cfccdc;
  --fg:#1a1828; --muted:#64617a; --faint:#8d8aa3;
  --primary:#3f3bd6; --primary-ink:#ffffff; --primary-soft:#ebeaff; --primary-text:#3431c4;
  --sun:#f29a14; --coral:#ef5a45; --leaf:#1e9e62; --sky:#1f8fd6;
  --build:#f29a14; --serve:#5867f0; --teach:#8b5cf6; --heal:#ef5a45; --help:#e0559d;
  --create:#12a594; --tech:#1f8fd6; --nature:#2f9e57; --fly:#c9a20c;
  --cover-a:#2b2a8f; --cover-b:#6d4fd8; --cover-c:#f29a14;
  --gold:#d9a41c; --silver:#9ea3b5; --bronze:#c27a45;
  --shadow:0 0 0 1px rgba(26,24,40,.06), 0 2px 4px rgba(26,24,40,.05);
  --shadow-lg:0 24px 60px rgba(26,24,40,.22);
  --font:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0a16; --card:#15142a; --card-2:#1c1b35; --line:#2a2846; --line-2:#3a3760;
  --fg:#eeedf7; --muted:#a19eba; --faint:#7b789a;
  --primary:#8e8bff; --primary-ink:#0b0a16; --primary-soft:#24224b; --primary-text:#aeacff;
  --sun:#ffb23f; --coral:#ff7466; --leaf:#45c985; --sky:#5cc0f5;
  --build:#ffb23f; --serve:#8b97ff; --teach:#b39bff; --heal:#ff7a6e; --help:#f58ac0;
  --create:#3fcdbf; --tech:#5cc0f5; --nature:#56d48d; --fly:#ecd257;
  --gold:#f0c24a; --silver:#b9bdcc; --bronze:#e0956a;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0a16; --card:#15142a; --card-2:#1c1b35; --line:#2a2846; --line-2:#3a3760;
  --fg:#eeedf7; --muted:#a19eba; --faint:#7b789a;
  --primary:#8e8bff; --primary-ink:#0b0a16; --primary-soft:#24224b; --primary-text:#aeacff;
  --sun:#ffb23f; --coral:#ff7466; --leaf:#45c985; --sky:#5cc0f5;
  --build:#ffb23f; --serve:#8b97ff; --teach:#b39bff; --heal:#ff7a6e; --help:#f58ac0;
  --create:#3fcdbf; --tech:#5cc0f5; --nature:#56d48d; --fly:#ecd257;
  --gold:#f0c24a; --silver:#b9bdcc; --bronze:#e0956a;
  --shadow:0 0 0 1px rgba(255,255,255,.05); --shadow-lg:0 24px 60px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.big{font-size:16.5px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.4rem,3vw,1.7rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.muted{color:var(--muted)} .small{font-size:.82rem}
.eyebrow{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;height:56px}
.logo{width:36px;height:36px;flex:none;border-radius:9px;display:block}
.wordmark{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;white-space:nowrap}
.wordmark b{color:var(--primary-text);font-weight:800}
.ptsbadge{display:flex;align-items:center;gap:6px;background:color-mix(in oklab,var(--sun) 16%,var(--card));color:color-mix(in oklab,var(--sun) 55%,var(--fg));border-radius:999px;padding:4px 12px;font-weight:800;font-size:.82rem;white-space:nowrap}
.ptsbadge svg{width:15px;height:15px}
.topnav{display:flex;margin-left:auto;height:100%}
.topnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:78px;padding:0 6px;color:var(--muted);font-size:.72rem;font-weight:600;position:relative;height:100%}
.topnav button svg{width:22px;height:22px}
.topnav button:hover,.topnav button[aria-current="page"]{color:var(--fg)}
.topnav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px;background:var(--fg)}
.topnav .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:999px;background:var(--coral);color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px;font-weight:800}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:22px;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 48px}
.left,.rail{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
main{min-width:0;display:flex;flex-direction:column;gap:12px}
.bottom{display:none}
@media (max-width:1100px){ .app{grid-template-columns:220px minmax(0,1fr)} .rail{display:none} .topnav button{min-width:64px} }
@media (max-width:780px){
  .app{grid-template-columns:minmax(0,1fr);padding-block:12px 100px}
  .left,.topnav{display:none}
  .ptsbadge{margin-left:auto}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.64rem;font-weight:600;color:var(--muted);padding:4px 2px;min-width:0;flex:1;position:relative}
  .bottom button svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--fg)}
  .bottom .dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--coral)}
}

/* ---------- primitives ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.divider{height:1px;background:var(--line);margin:0 -16px}
.btn{border-radius:999px;padding:6px 16px;font-weight:700;font-size:.86rem;background:transparent;color:var(--muted);border:1px solid var(--line-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:34px}
.btn:hover{background:var(--card-2);color:var(--fg);border-color:var(--fg)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.outline{color:var(--primary-text);border-color:var(--primary)}
.btn.outline:hover{background:var(--primary-soft)}
.btn.lg{min-height:48px;padding:10px 24px;font-size:1rem}
.btn.sm{padding:4px 12px;min-height:30px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
.btn.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.26);color:#fff;border-color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;background:transparent;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
button.chip:hover{background:var(--card-2);color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.chip.cl{border:0;background:color-mix(in oklab,var(--c) 14%,var(--card));color:color-mix(in oklab,var(--c) 70%,var(--fg))}
.pill-ok{border:0;background:color-mix(in oklab,var(--leaf) 16%,var(--card));color:color-mix(in oklab,var(--leaf) 75%,var(--fg))}
.pill-warn{border:0;background:color-mix(in oklab,var(--coral) 16%,var(--card));color:color-mix(in oklab,var(--coral) 75%,var(--fg))}
.pill-wait{border:0;background:color-mix(in oklab,var(--sun) 18%,var(--card));color:color-mix(in oklab,var(--sun) 55%,var(--fg))}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;background:var(--c);width:44px;height:44px;font-size:.9rem}
.av.xs{width:26px;height:26px;font-size:.6rem}
.av.sm{width:34px;height:34px;font-size:.74rem}
.av.lg{width:72px;height:72px;font-size:1.4rem;border:3px solid var(--card)}
.av.ring{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--sun)}
.bar{height:8px;border-radius:999px;background:var(--card-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--primary)}
.bar.sun>i{background:var(--sun)} .bar.leaf>i{background:var(--leaf)}
.cover{height:64px;background:
  radial-gradient(34px 34px at 93% 125%, color-mix(in oklab,var(--cover-c) 95%,#fff) 0 60%, transparent 62%),
  linear-gradient(115deg,var(--cover-a) 0%,var(--cover-b) 55%,var(--cover-c) 120%)}
.empty{padding:24px;text-align:center;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.8rem;color:var(--muted);min-width:0}
.toggle{width:44px;height:26px;border-radius:99px;border:0;background:var(--line-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"]{background:var(--leaf)}
.toggle[aria-pressed="true"]::after{left:21px}
.setting{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.setting:first-child{padding-top:0} .setting:last-child{border-bottom:0;padding-bottom:0}
.setting b{display:block;font-size:.9rem} .setting span{font-size:.8rem;color:var(--muted)}
.setting select{width:auto}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.statgrid div{background:var(--card-2);border-radius:12px;padding:10px 12px}
.statgrid b{display:block;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.statgrid span{font-size:.74rem;color:var(--muted);font-weight:600}
.table-wrap{overflow-x:auto;margin:0 -16px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.86rem}
th,td{text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;font-weight:700;color:var(--muted);background:var(--card-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--card-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- left profile card ---------- */
.mini{text-align:center}
.mini .av.lg{margin:-36px auto 0}
.mini .who{padding:8px 16px 14px}
.mini .who b{display:block;font-size:1.05rem}
.mini .who > span{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.mini .kv{display:flex;justify-content:space-between;padding:8px 16px;font-size:.8rem;font-weight:600;color:var(--muted);width:100%;border:0;background:transparent}
.mini .kv b{color:var(--primary-text);font-variant-numeric:tabular-nums}
.mini button.kv:hover{background:var(--card-2)}
.mini-goal{padding:10px 16px 14px;text-align:left;border-top:1px solid var(--line)}
.mini-goal .row{justify-content:space-between;font-size:.8rem;font-weight:600;margin-bottom:6px}

/* ---------- practice ---------- */
.qcards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.qcard{display:flex;flex-direction:column;gap:10px}
.op{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;background:color-mix(in oklab,var(--c) 15%,var(--card));color:color-mix(in oklab,var(--c) 80%,var(--fg));flex:none}
.op.sm{width:32px;height:32px;font-size:1rem;border-radius:9px}
.qcard .meta{font-size:.76rem;color:var(--muted)}
.qcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.assign{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.assign:last-child{border-bottom:0;padding-bottom:0}
.assign:first-of-type{padding-top:0}
.assign b{display:block;font-size:.92rem}
.join{display:flex;gap:8px;align-items:center}
.join input{max-width:150px;letter-spacing:.1em;font-weight:700;text-align:center}

/* ---------- quiz runner ---------- */
.run-head{height:auto;padding:14px clamp(16px,4vw,28px) 16px;color:#fff;display:flex;flex-direction:column;gap:10px}
.run-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.run-pts{font-weight:800;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;font-size:.86rem}
.run-title b{display:block;font-size:1.15rem;font-weight:800}
.run-title span{font-size:.82rem;opacity:.85}
.pips{display:flex;gap:6px}
.pips i{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}
.pips i.cur{background:#fff}
.pips i.first{background:#7ff0b4} .pips i.solved{background:#ffd27a} .pips i.missed{background:#ff9d92}
.run-body{padding:20px clamp(16px,4vw,28px) 24px;display:flex;flex-direction:column;gap:16px}
.ask{color:var(--muted);font-size:1.02rem;max-width:62ch}
.prompt{font-weight:800;font-size:clamp(2rem,6.5vw,3.1rem);line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:flex;align-items:center;flex-wrap:wrap;gap:.2em .35em;min-width:0}
.prompt.long{font-size:clamp(1.35rem,4.4vw,2.05rem)}
body.big .prompt{font-size:clamp(2.4rem,8vw,3.7rem)} body.big .prompt.long{font-size:clamp(1.6rem,5.4vw,2.5rem)}
.fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.78em;line-height:1.05;vertical-align:middle}
.fr span:first-child{border-bottom:.08em solid currentColor;padding:0 .18em}
.blank{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;border:2px dashed var(--line-2);border-radius:12px;color:var(--faint);font-size:.75em}
.viz-wrap{overflow-x:auto}
.viz{display:block;max-width:100%;height:auto}
.cell{fill:var(--card);stroke:var(--fg);stroke-width:1.5}
.dot.d1{fill:var(--primary)} .dot.d2{fill:var(--sun)} .dot.gone{fill:var(--line-2)}
.vx{stroke:var(--coral);stroke-width:2.5;stroke-linecap:round;fill:none}
.rod{fill:var(--primary)} .rodline{stroke:var(--card);stroke-width:1} .unit{fill:var(--sun)}
.seg-r{fill:var(--card);stroke:var(--fg);stroke-width:1.5} .seg-r.fill{fill:var(--primary)}
.lab{fill:var(--fg);font:700 13px var(--font)} .lab.sm{font-size:10px;fill:var(--muted);font-weight:600}
.axis{stroke:var(--fg);stroke-width:1.5} .gridl{stroke:var(--line);stroke-width:1} .tick{stroke:var(--fg);stroke-width:1.2}
.pt{fill:var(--sun);stroke:var(--fg);stroke-width:1.5} .ln{stroke:var(--primary);stroke-width:2;stroke-dasharray:6 5;fill:none}
.beam{stroke:var(--fg);stroke-width:4;stroke-linecap:round} .pan{fill:color-mix(in oklab,var(--sun) 20%,var(--card));stroke:var(--fg);stroke-width:1.5} .fulcrum{fill:var(--fg)}
.hund{fill:var(--card);stroke:var(--line);stroke-width:1} .hund.fill{fill:var(--primary);stroke:var(--card)}
.answer{display:flex;flex-wrap:wrap;gap:10px}
.answer input{flex:1 1 170px;max-width:300px;font-weight:800;font-size:1.7rem;padding:8px 16px;border:2px solid var(--line-2);border-radius:14px;font-variant-numeric:tabular-nums}
.answer input.is-bad{border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:430px}
.keypad button{min-height:46px;font-weight:800;font-size:1.15rem;background:var(--card-2);border:1px solid var(--line);border-radius:12px}
.keypad button:active{background:var(--primary-soft)}
.keypad .wide{font-size:.82rem}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;max-width:520px}
.choices button{min-height:76px;font-weight:800;font-size:1.9rem;background:var(--card-2);border:2px solid var(--line);border-radius:16px;font-variant-numeric:tabular-nums}
.choices button:hover:not(:disabled){border-color:var(--primary)}
.choices button.is-good{background:color-mix(in oklab,var(--leaf) 18%,var(--card));border-color:var(--leaf);opacity:1}
.choices button.is-bad{background:color-mix(in oklab,var(--coral) 14%,var(--card));border-color:var(--coral)}
.choices button:disabled{cursor:default}
.choices button:disabled:not(.is-good){opacity:.5}
.feedback{font-weight:700;font-size:1rem}
.feedback.good{color:var(--leaf)} .feedback.bad{color:var(--coral)}
.hints{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border-top:1px dashed var(--line-2);padding-top:14px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;max-width:62ch;font-size:1rem}
.steps li::marker{color:var(--primary-text);font-weight:800}
.result-score{font-size:clamp(2.6rem,9vw,4rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.qlist{display:flex;flex-direction:column}
.qlist div{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;align-items:baseline}
.qlist div:last-child{border-bottom:0}
.mk{font-weight:800;text-align:center} .mk.first{color:var(--leaf)} .mk.solved{color:var(--sun)} .mk.missed{color:var(--coral)}

/* ---------- leaderboard ---------- */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding:8px 0 4px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.pod b{font-size:.88rem;overflow-wrap:anywhere}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:1.3rem}
.pod.p1 .blk{height:84px;background:var(--gold)} .pod.p2 .blk{height:62px;background:var(--silver)} .pod.p3 .blk{height:46px;background:var(--bronze)}
.pod .pts{font-size:.78rem;color:var(--muted);font-weight:700}
.lb{display:flex;flex-direction:column}
.lbrow{display:grid;grid-template-columns:30px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:12px}
.lbrow + .lbrow{margin-top:2px}
.lbrow .rk{font-weight:800;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lbrow .nm{font-weight:700;font-size:.92rem;min-width:0}
.lbrow .nm small{display:block;font-weight:500;color:var(--muted);font-size:.74rem}
.lbrow .sc{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lbrow .sc small{display:block;font-weight:600;color:var(--muted);font-size:.7rem}
.lbrow.me{background:var(--primary-soft)} .lbrow.me .rk{color:var(--primary-text)}
.awards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.award{display:flex;gap:10px;align-items:center;background:var(--card-2);border-radius:12px;padding:10px 12px}
.award b{display:block;font-size:.86rem} .award span{font-size:.74rem;color:var(--muted)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in oklab,var(--c) 16%,var(--card));color:color-mix(in oklab,var(--c) 80%,var(--fg))}
.ico svg{width:19px;height:19px}

/* ---------- rewards ---------- */
.hero{color:#fff;height:auto;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero .big{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero span{opacity:.88;font-size:.86rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--line);font-size:.78rem;font-weight:700;padding:12px 8px;line-height:1.25}
.badge small{font-weight:500;color:var(--muted);font-size:.7rem}
.badge.locked{border-style:dashed;border-color:var(--line-2);color:var(--faint)}
.badge.locked .ico{background:var(--card-2);color:var(--faint)}
.styles{display:flex;gap:12px;flex-wrap:wrap}
.style{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;font-size:.74rem;font-weight:700;color:var(--muted);padding:4px}
.style[aria-pressed="true"]{color:var(--fg)}
.style[aria-pressed="true"] .av{outline:3px solid var(--primary);outline-offset:3px}
.style:disabled{cursor:not-allowed}
.style:disabled .av{filter:grayscale(1);opacity:.4}
.certrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.certrow:last-child{border-bottom:0;padding-bottom:0} .certrow:first-child{padding-top:0}
.certrow b{display:block;font-size:.9rem} .certrow span{font-size:.78rem;color:var(--muted)}
.certrow > div:nth-child(2){flex:1;min-width:0}

/* ---------- games ---------- */
.gate{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card-2)}
.gate svg{width:22px;height:22px;flex:none}
.gate.open svg{color:var(--leaf)} .gate.closed svg{color:var(--coral)}
.target{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.target .t{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:68px;border-radius:16px;border:2px solid var(--line);background:var(--card-2);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;transition:transform .1s}
.tile:hover{border-color:var(--primary)}
.tile[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);transform:scale(1.04)}
.tile.pop{animation:pop .3s}
.tile.no{animation:shake .3s;border-color:var(--coral)}
@keyframes pop{50%{transform:scale(1.12)}}

/* ---------- teacher ---------- */
.heat{width:46px;height:26px;border-radius:7px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;background:color-mix(in oklab,var(--leaf) var(--p),var(--card-2));color:var(--fg)}
.heat.low{background:color-mix(in oklab,var(--coral) 30%,var(--card-2))}
.warnrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:transparent;text-align:left}
.warnrow:last-child{border-bottom:0}
.warnrow b{display:block;font-size:.88rem} .warnrow span{font-size:.76rem;color:var(--muted)}
.warnrow > div{flex:1;min-width:0}
.code{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.lobby{display:flex;flex-wrap:wrap;gap:6px}
.lobby .chip{animation:pop .3s}
.lq{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.lopt{border-radius:14px;padding:12px;color:#fff;font-weight:800;font-size:1.5rem;display:flex;flex-direction:column;gap:8px;background:var(--c);position:relative;min-height:84px}
.lopt .cnt{font-size:.78rem;font-weight:700;opacity:.9}
.lopt.dim{opacity:.35}
.lopt .lbar{height:6px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:auto}
.lopt .lbar i{display:block;height:100%;background:#fff}
.timer{font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* ---------- modal / cert / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,9,20,.6);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;max-width:600px;width:100%;max-height:min(88vh,860px);overflow:auto;box-shadow:var(--shadow-lg);position:relative}
.modal-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:16px}
.x{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.9);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:#1a1828;z-index:2}
.x svg{width:18px;height:18px}
.cert{padding:14px;background:linear-gradient(115deg,var(--cover-a),var(--cover-b) 60%,var(--cover-c))}
.cert-in{background:var(--card);border-radius:10px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid color-mix(in oklab,var(--sun) 50%,var(--card))}
.cert-in h2{font-size:1.5rem;font-weight:800}
.cert-name{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-text);border-bottom:2px solid var(--line);padding:0 18px 4px}
.cert-foot{display:flex;justify-content:space-between;gap:24px;width:100%;max-width:380px;margin-top:14px;font-size:.86rem}
.cert-foot div{display:flex;flex-direction:column;border-top:1.5px solid var(--fg);padding-top:4px;flex:1}
.cert-foot small{color:var(--muted);font-size:.7rem}
.toast{position:fixed;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.86rem;z-index:80;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px)}
@media (max-width:780px){.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;width:100%;height:100%}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- signed-in chrome ---------- */
.me-wrap{position:relative;display:flex;align-items:center;gap:10px;margin-left:12px}
.me-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;font-size:.72rem;font-weight:600;color:var(--muted);padding:0 4px}
.menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);min-width:240px;padding:8px;display:flex;flex-direction:column;z-index:50}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block} .menu .who span{font-size:.8rem;color:var(--muted)}
.menu a,.menu button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;border:0;background:transparent;text-align:left;font-weight:600;font-size:.88rem;color:var(--fg);text-decoration:none}
.menu a:hover,.menu button:hover{background:var(--card-2)}
.menu svg{width:18px;height:18px}
.top-actions{display:flex;gap:8px;margin-left:auto}
.app.solo{grid-template-columns:minmax(0,1fr);max-width:980px}
.app.solo .left,.app.solo .rail{display:none}
@media (max-width:780px){ .me-wrap{margin-left:auto} }

/* ---------- landing + messages ---------- */
.land-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;padding:24px}
@media (max-width:780px){.land-hero{grid-template-columns:minmax(0,1fr)}}
.land-hero h1{font-size:clamp(1.8rem,5vw,2.6rem);margin-top:8px}
.land-hero h1 em{font-style:normal;color:var(--primary-text)}
.lead{color:var(--muted);font-size:1.02rem;margin-top:10px;max-width:56ch}
.land-art{border-radius:16px;overflow:hidden;background:var(--card-2)}
.land-art .inner{padding:16px}
.join-col{display:flex;flex-direction:column;gap:8px;margin-top:20px;max-width:420px}
.points4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.points4 b{display:flex;gap:8px;align-items:center;font-size:.92rem;margin-bottom:4px}
.points4 b svg{width:18px;height:18px;color:var(--leaf)}
.center{max-width:520px;margin:48px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.center .ico{width:56px;height:56px}
.center .ico svg{width:26px;height:26px}
.loading{padding:28px;text-align:center;color:var(--muted)}
.bandpick{display:flex;gap:4px;flex-wrap:wrap}
.bandpick button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8rem;color:var(--muted)}
.bandpick button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--card)}
.live-play .prompt{font-size:clamp(1.6rem,6vw,2.6rem)}
.lq button.lopt{border:0;text-align:left;cursor:pointer}
.lq button.lopt:disabled{cursor:default}
.lopt.mine{outline:3px solid var(--fg);outline-offset:2px}

.link{background:none;border:0;color:var(--primary-text);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:inherit}

/* ---------- lessons, practice modes, new games ---------- */
.idea p{font-size:1.06rem;line-height:1.55;margin-top:6px}
.remember{background:var(--primary-soft)}
.remember .rem{font-size:1.2rem;font-weight:800;margin-top:6px;color:var(--primary-text);line-height:1.35}
.ex-card{display:flex;flex-direction:column;gap:12px}
.steps li.ans-step{list-style:none;margin-left:-1.4em;color:var(--leaf);font-weight:800}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);color:var(--fg);min-height:118px;font:inherit}
button.mode{cursor:pointer} button.mode:hover{border-color:var(--primary)}
.mode b{font-size:.98rem} .mode span{font-size:.8rem;color:var(--muted);line-height:1.35} .mode em{font-style:normal;font-size:.76rem;font-weight:800;color:var(--primary-text)}
.game-card .btn{margin-top:auto}
.levels{display:flex;flex-direction:column}
.level{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.level:last-child{border-bottom:0;padding-bottom:0} .level b{display:block;font-size:.92rem} .level .btn{flex:none}
.hintbox{border-left:4px solid var(--sun);background:color-mix(in oklab,var(--sun) 10%,var(--card));padding:10px 14px;border-radius:0 12px 12px 0;display:flex;flex-direction:column;gap:6px}
.flipcard{border:2px dashed var(--line-2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.flipcard.back{border-style:solid;border-color:var(--primary);animation:pop .25s}
.flipcard .big-ans{font-size:clamp(2.4rem,8vw,3.4rem);font-weight:800;color:var(--primary-text);line-height:1}
.streak{display:flex;gap:8px} .streak i{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.28)} .streak i.on{background:#ffd27a;animation:pop .3s}
.streak-card{gap:6px;flex-wrap:wrap} .streak-card i{width:16px;height:16px;background:color-mix(in oklab,var(--fg) 12%,transparent)} .streak-card i.on{background:#ffd27a}
details.bigidea{width:100%;max-width:62ch;background:var(--primary-soft);border-radius:12px;padding:8px 12px}
details.bigidea summary{cursor:pointer;font-weight:700;color:var(--primary-text);display:flex;gap:6px;align-items:center;min-height:32px}
details.bigidea summary svg{width:18px;height:18px} details.bigidea p{margin:6px 0 2px;line-height:1.5}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{min-height:76px;border-radius:14px;border:2px solid transparent;background:linear-gradient(135deg,var(--cover-a),var(--cover-b));color:#fff;font-weight:800;font-size:1.5rem;padding:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mcard.up{background:var(--card-2);color:var(--fg);border-color:var(--primary);font-size:1.05rem}
.mcard.up.a{font-size:1.4rem}
.mcard.done{background:color-mix(in oklab,var(--leaf) 18%,var(--card));border-color:var(--leaf)}
.mcard.pop{animation:pop .3s}
.bq .prompt{font-size:clamp(1.5rem,5vw,2.2rem)}
.skybox{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(color-mix(in oklab,var(--sky) 24%,var(--card)),var(--card-2))}
.bwrap{position:absolute;bottom:-40px;width:16%;min-width:70px;display:flex;justify-content:center;animation:rise 7.5s linear forwards}
.balloon{position:relative;width:78px;height:94px;border:0;border-radius:50% 50% 46% 46%;background:var(--c);color:#fff;font-weight:800;font-size:1.15rem;box-shadow:inset -8px -10px 0 rgba(0,0,0,.1);font-variant-numeric:tabular-nums;padding:0 4px;overflow-wrap:anywhere;line-height:1.1}
.balloon::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:36px;background:rgba(0,0,0,.28)}
.balloon.popped{animation:burst .3s forwards} .balloon.no{opacity:.3;animation:shake .3s}
@keyframes rise{to{transform:translateY(-440px)}}
@keyframes burst{to{transform:scale(1.7);opacity:0}}
.tf-stmt{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:800;text-align:center;padding:28px 16px;border-radius:16px;background:var(--card-2);font-variant-numeric:tabular-nums;border:3px solid transparent}
.tf-stmt.good{border-color:var(--leaf)} .tf-stmt.bad{border-color:var(--coral);animation:shake .3s}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-btns button{min-height:76px;font-size:1.4rem;font-weight:800;border-radius:16px;border:0;color:#fff;display:flex;gap:8px;align-items:center;justify-content:center}
.tf-btns svg{width:24px;height:24px} .tf-t{background:var(--leaf)} .tf-f{background:var(--coral)}
@media (prefers-reduced-motion: reduce){ .bwrap{bottom:60px} }

/* ---------- Solve it with me (interactive worked example) ---------- */
.wk{display:flex;flex-direction:column;gap:14px}
.wk-prob{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--card-2)}
.wk-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wk-dots i{width:28px;height:8px;border-radius:999px;background:var(--line)}
.wk-dots i.on{background:var(--primary)} .wk-dots i.ok{background:var(--leaf)} .wk-dots i.shown{background:var(--sun)}
.wk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:wk}
.wk-step{counter-increment:wk;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.wk-step::before{content:counter(wk);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--card-2);color:var(--muted)}
.wk-step.cur{border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in oklab,var(--primary) 14%,transparent);animation:wkin .25s ease-out}
.wk-step.cur::before{background:var(--primary);color:var(--primary-ink)}
.wk-step.ok::before{content:"✓";background:var(--leaf);color:#fff}
.wk-step.shown::before{content:"✓";background:var(--sun);color:#fff}
.wk-step .txt{font-size:1.08rem;line-height:1.6;font-variant-numeric:tabular-nums}
.wk-step .txt .fill{display:inline-block;padding:0 .35em;border-radius:8px;font-weight:800;background:color-mix(in oklab,var(--leaf) 18%,var(--card));color:color-mix(in oklab,var(--leaf) 70%,var(--fg))}
.wk-step.shown .txt .fill{background:color-mix(in oklab,var(--sun) 22%,var(--card));color:color-mix(in oklab,var(--sun) 60%,var(--fg))}
.wk-in{display:inline-block;width:5.2em;min-width:0;padding:4px 8px;border-radius:10px;border:2px solid var(--primary);background:var(--card);font-weight:800;font-size:1.05rem;text-align:center;vertical-align:baseline}
.wk-in.is-bad{border-color:var(--coral);animation:shake .35s}
.wk-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.wk-fb{font-weight:700;font-size:.92rem;margin-top:8px} .wk-fb.good{color:var(--leaf)} .wk-fb.bad{color:var(--coral)} .wk-fb.tip{color:var(--muted)}
.wk-win{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:color-mix(in oklab,var(--leaf) 12%,var(--card));border:1.5px solid color-mix(in oklab,var(--leaf) 45%,transparent);animation:wkin .3s ease-out}
.wk-win h3{font-size:1.2rem;color:color-mix(in oklab,var(--leaf) 75%,var(--fg))}
.wk-win .big{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes wkin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- videos ---------- */
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;border:0;padding:0;display:block;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;display:block;opacity:.88}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play span{width:68px;height:48px;border-radius:14px;background:#e62117;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.vid .play span::after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:4px}
.vid:hover .play span{filter:brightness(1.1)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid-meta{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.vid-meta b{font-size:.95rem} .vid-meta span{font-size:.8rem;color:var(--muted)}
.vid-more{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vid-more button{display:flex;gap:10px;align-items:center;text-align:left;padding:6px 10px 6px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);max-width:100%}
.vid-more button[aria-pressed="true"]{border-color:var(--primary)}
.vid-more img{width:64px;height:36px;object-fit:cover;border-radius:8px;flex:none}
.vid-more b{font-size:.8rem;line-height:1.25;display:block} .vid-more span{font-size:.72rem;color:var(--muted)}

/* ---------- Snap a problem ---------- */
.snap-promo{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in oklab,var(--primary) 14%,var(--card)),color-mix(in oklab,var(--sun) 14%,var(--card)))}
.snap-promo .cam{width:52px;height:52px;border-radius:16px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;flex:none}
.snap-promo .cam svg{width:28px;height:28px}
.snap-promo > div{min-width:0;flex:1}
.drop{border:2.5px dashed var(--line-2);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--card-2)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.drop label.btn{cursor:pointer}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.snap-img{max-height:320px;width:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto;background:#fff}
.snap-text{width:100%;min-height:76px;resize:vertical;border-radius:12px;border:1px solid var(--line-2);padding:10px 12px;background:var(--card);font:inherit;font-size:1rem}
.snap-prob{font-size:1.25rem;font-weight:800;line-height:1.45;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.snap-wait{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px;text-align:center}
.snap-wait .spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snap-finish{border:2px solid var(--primary);background:var(--primary-soft)}
.snap-finish form{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.snap-finish input{flex:1;min-width:140px;font-size:1.1rem;font-weight:700}
.exq{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2)}
.exq .q{font-size:1.1rem;font-weight:800;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.exq ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.exq ol li b{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.exq form{display:flex;gap:8px;flex-wrap:wrap} .exq form input{flex:1;min-width:120px}
.exq .ans{font-weight:800;color:var(--leaf);font-size:1.05rem}
@media (prefers-reduced-motion: reduce){ .wk-step.cur,.wk-win{animation:none} .snap-wait .spin{animation-duration:3s} }
</style>

<body>
<header class="top"><div class="top-in">
  <a href="/math/" aria-label="Arise Math home" style="display:flex"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2a8f"/><stop offset="1" stop-color="#6d4fd8"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ef5a45"/><stop offset="1" stop-color="#ffb23f"/></linearGradient></defs>
    <rect width="40" height="40" rx="9" fill="url(#lg)"/><path d="M9 28a11 11 0 0 1 22 0z" fill="url(#sg)"/><path d="M7 31h26" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M20 9v6M17 12h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  </svg></a>
  <span class="wordmark">Arise <b>Math</b></span>
  <nav class="topnav" id="nav" aria-label="Sections"></nav>
  <div id="me" class="me-wrap"></div>
</div></header>

<div class="app" id="app">
  <aside class="left" id="left"></aside>
  <main id="main"><div class="loading">Loading Arise Math…</div></main>
  <aside class="rail" id="rail"></aside>
</div>
<nav class="bottom" id="bottom" aria-label="Sections"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<canvas id="confetti"></canvas>

<script>
/* ================= ICONS ================= */
const I = {
  practice:'<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>',
  trophy:'<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4"/><path d="M17 6h3a3 3 0 0 1-3 4"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v9h14v-9"/><path d="M12 8v13"/><path d="M12 8c-1.5-3.5-6-4-6-1.2C6 9 12 8 12 8s6 1 6-1.2C18 4 13.5 4.5 12 8z"/>',
  game:'<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3"/><path d="M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/>',
  me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  class:'<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3 2.7-5 6-5s6 2 6 5"/><path d="M14 15.3c.6-.2 1.3-.3 2-.3 3.3 0 6 2 6 5"/>',
  assign:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 11h6"/><path d="M9 15h4"/>',
  live:'<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  x:'<path d="M6 6l12 12"/><path d="M18 6L6 18"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 1.5 2 2 2 0-2 0-4 1-6z"/>',
  speaker:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
  eye:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 21l5-3 5 3-1.5-7"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/>',
  up:'<path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>',
  plus:'<path d="M12 5v14"/><path d="M5 12h14"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  school:'<path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11v5c0 1.5 2.5 3 5 3s5-1.5 5-3v-5"/>',
  book:'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
  heart:'<path d="M20.8 8.6a5 5 0 0 0-8.8-3.2A5 5 0 0 0 3.2 8.6c0 5.4 8.8 11.4 8.8 11.4s8.8-6 8.8-11.4z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'
};
const svg = (k, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${I[k]||''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cc = k => `var(--${k})`;
const range = (a,b) => { const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; };
const N = n => n<0 ? '−'+Math.abs(n) : String(n);
const fmtV = v => { v=Number(v); return Number.isInteger(v) ? N(v) : Number.isInteger(v*2) ? (v<0?'−':'')+Math.abs(v*2)+'/2' : N(v); };

/* ================= SIGN-IN + API ================= */
function sessionToken(){
  try {
    const raw = document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('arise_session='));
    if (!raw) return null;
    const bin = atob(raw.slice('arise_session='.length));
    let data; try { data = JSON.parse(decodeURIComponent(escape(bin))); } catch { data = JSON.parse(bin); }
    return data && data.token ? String(data.token) : null;
  } catch { return null; }
}
class ApiError extends Error { constructor(msg, code, body){ super(msg); this.code = code; this.body = body; } }
async function apiAt(fullPath, opts = {}){
  const headers = { 'Content-Type':'application/json' };
  const t = sessionToken(); if (t) headers.Authorization = `Bearer ${t}`;
  let res;
  try { res = await fetch(fullPath, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store', keepalive: !!opts.keepalive }); }
  catch { throw new ApiError('Can’t reach Arise Math. Check your connection and try again.', 0); }
  let body = null; try { body = await res.json(); } catch {}
  if (!res.ok) throw new ApiError(body?.message || 'Something went wrong. Please try again.', res.status, body);
  return body;
}
const api = (path, opts) => apiAt('/api/math' + path, opts);
/** Sends people to the main site to sign up or sign in, and back here afterwards. */
function goSignIn(path){ try { sessionStorage.setItem('arise_return_to', '/math/'); } catch {} location.href = path; }
const store = { get(k){ try { return JSON.parse(sessionStorage.getItem(k)||'null'); } catch { return null; } }, set(k,v){ try { v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const keep = { get(k, d){ try { return JSON.parse(localStorage.getItem(k)||'null') ?? d; } catch { return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ================= STATE ================= */
let CAT = null, ME = null;
const S = { tab:null, menu:false, board:null, period:'week', assign:null, cls:null, children:null, childId:null, live:undefined, run:null, result:null, lplay:null, err:{}, drafts:keep.get('arise_math_drafts', []) };
let GAME = null, gameTimer = null, beatTimer = null, playAccess = null, playErr = null;
const canSpeak = 'speechSynthesis' in window;
const role = () => ME?.user.role || 'guest';
const isStaff = () => role()==='teacher' || role()==='admin';
const P = () => ME?.profile;
const SK = id => (CAT && CAT.skills[id]) || { name:'Teacher question', std:'', glyph:'?', c:'help' };
const bandLabel = b => CAT?.bands[b]?.label || '';
const myBand = () => ME?.band || 'g35';

/* ================= SHARED UI ================= */
const avColor = name => { const cs=['primary','coral','teach','tech','nature','help','create','serve']; let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))%997; return cs[h%cs.length]; };
const initials = n => String(n).split(/\s+/).filter(Boolean).map(w=>w[0]).join('').replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase() || '?';
const STYLE_BG = { primary:'var(--primary)', coral:'var(--coral)', create:'var(--create)', sunrise:'linear-gradient(135deg,var(--coral),var(--sun))', galaxy:'linear-gradient(135deg,var(--cover-a),var(--cover-b))', gold:'linear-gradient(135deg,#b8860b,#f2d36b)' };
function av(name, size, style){
  const bg = style ? STYLE_BG[style] || STYLE_BG.primary : cc(avColor(name));
  return `<div class="av ${size||''} ${style==='galaxy'||style==='gold'?'ring':''}" style="--c:${cc(avColor(name))};background:${bg}">${esc(initials(name))}</div>`;
}
const ico = (k,c) => `<div class="ico" style="--c:${cc(c)}">${svg(k)}</div>`;
const op = (id, size) => { const s=SK(id); return `<div class="op ${size||''}" style="--c:${cc(id==='mixed'?'primary':s.c)}">${id==='mixed'?svg('bolt','style="width:20px;height:20px"'):s.glyph}</div>`; };
const fmtDue = iso => new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
const plus = days => { const d=new Date(Date.now()+days*864e5); return d.toLocaleDateString('en-CA'); };
const levelName = pts => CAT.levels[Math.min(Math.floor(pts/CAT.levelPoints), CAT.levels.length-1)];
const lastTxt = d => d==null ? 'Not yet' : d===0 ? 'Today' : d===1 ? 'Yesterday' : `${d} days ago`;
function toast(msg){ const r=document.getElementById('toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>{ r.innerHTML=''; },2800); }
function toastQueue(list){ list.forEach((m,i)=>setTimeout(()=>toast(m), i*2200)); }
const loadingCard = what => `<div class="card loading">Loading ${esc(what)}…</div>`;
const errCard = (msg, act) => `<div class="card stack" style="gap:10px"><p>${esc(msg)}</p><div><button class="btn" data-act="${act}">Try again</button></div></div>`;
function centerMessage(title, body, extra=''){
  document.getElementById('app').className='app solo';
  document.getElementById('nav').innerHTML=''; document.getElementById('bottom').innerHTML='';
  document.getElementById('main').innerHTML=`<div class="center">${ico('info','primary')}<h1>${esc(title)}</h1><p class="muted">${body}</p>${extra}</div>`;
}

/* ================= NAV ================= */
const TABS = {
  student: [['practice','Practice','practice'],['board','Leaderboard','trophy'],['rewards','Rewards','gift'],['games','Games','game'],['me','Me','me']],
  teacher: [['class','My Class','class'],['assign','Assign','assign'],['live','Live Review','live'],['board','Leaderboard','trophy'],['play','Play Time','clock']],
  parent: [['family','Home','home'],['play','Play Time','clock']],
};
const tabs = () => ME ? TABS[isStaff() ? 'teacher' : role()] || [] : [];
function badgeFor(id){
  if (id==='practice' && S.assign) return S.assign.filter(a=>a.myScore==null).length;
  if (id==='class' && S.cls) return S.cls.totals.check;
  return 0;
}
function roleLine(){
  const u = ME.user;
  if (u.role==='student') return `${u.grade?`Grade ${u.grade}`:'Student'}${u.teacherName?` · ${u.teacherName}’s class`:''}`;
  return u.role==='teacher' ? 'Teacher' : u.role==='parent' ? 'Parent' : 'Admin';
}
function renderChrome(){
  const t = tabs();
  if (t.length && !t.find(x=>x[0]===S.tab)) S.tab = t[0][0];
  document.getElementById('nav').innerHTML = t.map(([id,l,ic])=>{const n=badgeFor(id);return `<button data-act="tab" data-v="${id}" ${S.tab===id?'aria-current="page"':''}>${svg(ic)}<span>${l}</span>${n?`<span class="dot">${n}</span>`:''}</button>`}).join('');
  document.getElementById('bottom').innerHTML = t.map(([id,l,ic])=>`<button data-act="tab" data-v="${id}" ${S.tab===id?'aria-current="page"':''}>${svg(ic)}<span>${l}</span>${badgeFor(id)?'<i class="dot"></i>':''}</button>`).join('');
  const me = document.getElementById('me');
  if (!ME) { me.innerHTML = `<div class="top-actions"><button class="btn" data-act="signin">Log in</button><button class="btn primary" data-act="join">Join now</button></div>`; return; }
  const pts = role()==='student' ? `<span class="ptsbadge" title="Math points">${svg('star')}<span class="tnum">${P().points}</span></span>` : '';
  me.innerHTML = `${pts}<button class="me-btn" data-act="menu" aria-expanded="${S.menu}">${av(ME.user.name,'xs',role()==='student'?P().avatar:null)}<span>Me</span></button>${S.menu?`<div class="menu" role="menu"><div class="who"><b>${esc(ME.user.name)}</b><span>${esc(roleLine())}</span></div>${role()==='student'?`<button data-act="tab" data-v="me">${svg('me')}My skills and settings</button>`:''}<a href="/">${svg('book')}Open A.R.I.S.E. Reader</a><a href="/history/">${svg('book')}Open Arise History</a></div>`:''}`;
  document.body.classList.toggle('big', role()==='student' && !!P().a11y.big);
}

/* ================= LEFT + RAIL ================= */
function kidCard(name, sub, p, rank, style){
  const into = p.points % CAT.levelPoints;
  return `<div class="card flush mini"><div class="cover"></div>${av(name,'lg',style)}
    <div class="who"><b>${esc(name)}</b><span>${esc(sub)}</span></div>
    <div class="divider" style="margin:0"></div>
    <div class="kv" style="padding-top:12px"><span>Math points</span><b>${p.points}</b></div>
    <div class="kv"><span>Class rank this week</span><b>${rank?'#'+rank:'–'}</b></div>
    <div class="kv"><span>Day streak</span><b>${p.streak}</b></div>
    <div class="kv" style="padding-bottom:12px"><span>Level ${p.level+1} · ${esc(levelName(p.points))}</span><b>${into}/${CAT.levelPoints}</b></div>
    <div class="mini-goal"><div class="row"><span>Today’s goal</span><span class="tnum muted">${p.day_solved}/${CAT.dailyGoal} problems</span></div><div class="bar sun"><i style="width:${Math.min(100,p.day_solved/CAT.dailyGoal*100)}%"></i></div></div></div>`;
}
function leftHTML(){
  if (role()==='student') return kidCard(ME.user.name, roleLine(), P(), ME.rank, P().avatar);
  if (isStaff()){
    const t = S.cls?.totals;
    return `<div class="card flush mini"><div class="cover"></div>${av(ME.user.name,'lg')}
      <div class="who"><b>${esc(ME.user.name)}</b><span>${role()==='admin'?'Admin':'Teacher'}${S.cls?` · Grades ${bandLabel(S.cls.settings.band)}`:''}</span></div>
      <div class="divider" style="margin:0"></div>
      <div class="kv" style="padding-top:12px"><span>Students</span><b>${t?t.students:'–'}</b></div>
      <div class="kv"><span>Quizzes this week</span><b>${t?t.weekQuizzes:'–'}</b></div>
      <button class="kv" data-act="tab" data-v="class" style="padding-bottom:14px"><span>Need a check-in</span><b>${t?t.check:'–'}</b></button></div>`;
  }
  const k = currentChild();
  if (!k) return `<div class="eyebrow" style="padding:0 4px">${esc(ME.user.name)}’s family</div>`;
  return `<div class="eyebrow" style="padding:0 4px">${esc(ME.user.name)}’s family</div>${kidCard(k.name, `${k.grade?`Grade ${k.grade}`:'Student'}${k.teacherName?` · ${k.teacherName}’s class`:''}`, k.profile, k.rank, k.profile.avatar)}`;
}
function railHTML(){
  if (role()==='student'){
    const rows = S.board?.board;
    const lb = rows ? (()=>{ const me=rows.find(r=>r.me), show=rows.slice(0,3).concat(me&&me.rank>3?[me]:[]);
      return `<div class="card"><div class="card-h"><h3>This week</h3><button class="btn sm" data-act="tab" data-v="board">See all</button></div><div class="lb">${show.map(r=>`<div class="lbrow ${r.me?'me':''}"><span class="rk">${r.rank}</span>${av(r.name,'xs',r.avatar)}<span class="nm">${esc(r.me?'You':r.name)}</span><span class="sc">${r.points}</span></div>`).join('')}</div></div>`; })() : '';
    return lb + `<div class="card stack" style="gap:8px"><h3>Next certificate</h3><p class="small muted">Get every answer right on any quiz to earn a Perfect Score certificate and ${CAT.points.perfectBonus} bonus points.</p></div>`;
  }
  if (isStaff()){
    const warn = (S.cls?.students||[]).filter(s=>s.status==='check');
    return `<div class="card"><div class="card-h"><h3>Needs a check-in</h3><span class="chip pill-warn">${warn.length}</span></div>
      ${warn.map(s=>`<button class="warnrow" data-act="student" data-v="${s.id}">${av(s.name,'sm')}<div><b>${esc(s.name)}</b><span>${esc(s.reason)}</span></div></button>`).join('') || '<p class="small muted">Nobody needs a check-in right now.</p>'}</div>
      <div class="card stack" style="gap:10px"><h3>Live review</h3><p class="small muted">Put five questions on the board. Your class answers from their own devices.</p><button class="btn primary" data-act="tab" data-v="live">${svg('live')}${S.live?'Back to the game':'Start a game'}</button></div>`;
  }
  return `<div class="card stack" style="gap:10px"><h3>Play time</h3><p class="small muted">The Arise Math game room uses the same A.R.I.S.E. play timer and limits you already set.</p><a class="btn" href="/parent-dashboard">${svg('clock')}Open play time settings</a></div>`;
}

/* ================= SIGNED-OUT LANDING ================= */
function landingHTML(){
  const band = 'g35';
  return `<section class="card land-hero"><div>
      <span class="eyebrow">From A.R.I.S.E. Reader · Grades K–12</span>
      <h1>Math that feels like <em>leveling up.</em></h1>
      <p class="lead">Arise Math gives every student quizzes matched to their grade, with pictures that show the idea and hints that walk through each step. Points count on a class leaderboard, perfect scores earn certificates, and practice unlocks the game room. Teachers assign practice and run live review games. Parents follow along.</p>
      <div class="join-col">
        <button class="btn primary lg" data-act="join">${svg('plus')}Sign up as a student</button>
        <button class="btn outline" data-act="go" data-v="/parent-signup">${svg('heart')}I’m a parent or guardian</button>
        <button class="btn outline" data-act="go" data-v="/teacher-signup">${svg('school')}I’m a teacher</button>
        <p class="muted small">Arise Math uses your A.R.I.S.E. Reader account. Already have one? <a href="/" data-act="signin">Log in</a>.</p>
        <p class="muted small">Teachers: 30 days free, then $12 a month for your class.</p>
      </div></div>
    <div class="land-art"><div class="cover"></div><div class="inner"><h3>Skills for every grade</h3><div class="stack" style="gap:10px;margin-top:12px">
      ${['k2','g35','g68','g912'].map(b=>`<div><span class="eyebrow">Grades ${bandLabel(b)}</span><div class="row" style="gap:6px;margin-top:4px">${CAT.bands[b].skills.map(id=>`<span class="chip cl" style="--c:${cc(SK(id).c)}">${esc(SK(id).name)}</span>`).join('')}</div></div>`).join('')}
    </div></div></div></section>

const STATE_KEY = 'arise_math_state';
const myState = () => { const saved = (()=>{ try { return localStorage.getItem(STATE_KEY); } catch { return null; } })(); return (CAT.states||[]).find(s=>s.id===saved) || (CAT.states||[]).find(s=>s.id==='CO') || (CAT.states||[])[0]; };
const BAND_GRADE = { k2:'1', g35:'4', g68:'7', g912:'HS' };

const gradeShort = g => g==='K' ? 'K' : g==='HS' ? 'HS' : g;
/** A lesson's code in the chosen state: the state's own code where it uses the Common Core codes, or the Common Core match. */
const codeLabel = (st, code) => st?.ccss ? `${st.id} ${code}` : `Common Core ${code}`;
const domainOf = code => code.startsWith('HS') ? code.slice(0,3) : (code.split('.')[1] || '');
/** A grade's lessons grouped by domain (Operations, Fractions, Geometry…), in teaching order. */
function byDomain(list){
  const out = [];
  for (const l of list){ const id = domainOf(l.code), name = (CAT.domains||[]).find(d=>d.id===id)?.name || id; let g = out.find(x=>x.id===id); if (!g) out.push(g = { id, name, items: [] }); g.items.push(l); }
  return out;
}
const domainHead = name => `<p class="eyebrow" style="margin:14px 0 4px">${esc(name)}</p>`;
function gradePick(){

function speakText(t){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g,' ').replace(/−/g,' minus ').replace(/×/g,' times ').replace(/÷/g,' divided by ').replace(/\?/g,' what ').replace(/x²/g,'x squared ').replace(/=/g,' equals ').replace(/</g,' is less than ').replace(/>/g,' is greater than ')); u.rate=.92; speechSynthesis.speak(u); }catch(e){} }
const plainOf = it => { const d=document.createElement('div'); d.innerHTML=it.prompt; d.querySelectorAll('.fr').forEach(f=>{ const [a,b]=f.children; f.textContent=` ${a.textContent} over ${b.textContent} `; }); return d.textContent; };
function speakAuto(){ if (P()?.a11y.read && S.run) speakText(S.run.session.item.ask+'. '+plainOf(S.run.session.item)); }

async function startQuiz(type, v){
  try {
    const r = await api('/quizzes', { method:'POST', body:{ type, skill: type==='skill'?v:undefined, assignmentId: type==='assign'?v:undefined, band: myBand() } });
    S.run = { session:r.session, fb:null, bad:false }; S.result=null; S.tab='practice'; store.set('arise_math_run', r.session.id);
    render(); window.scrollTo({top:0}); speakAuto();
  } catch(e){ toast(e.message); }
}
async function quizCall(path, body){
  if (!S.run || S.run.busy) return null;
  S.run.busy = true;
  try { return await api(`/quizzes/${S.run.session.id}${path}`, { method:'POST', body }); }
  catch(e){ S.run.fb = { t:e.message, c:'bad' }; if (e.code===404){ S.run=null; store.set('arise_math_run', null); toast('That quiz has ended.'); } return null; }
  finally { if (S.run) S.run.busy = false; render(); }
}
async function submitAnswer(value){
  if (!S.run || S.run.session.item.done) return;
  const r = await quizCall('/answer', { value });
  if (!r) return;
  const it = r.session.item;
  S.run.session = r.session; S.run.bad = !r.correct && !it.done;
  if (r.correct) { S.run.fb = { t: it.result==='first' ? `Correct on the first try. +${r.gained} points` : `Correct. +${r.gained} points`, c:'good' }; ME.profile.points += r.gained; }
  else if (!it.done) S.run.fb = { t:'Not quite. Try once more, or open a hint.', c:'bad' };
  else S.run.fb = { t:`The answer is ${it.answerLabel||(it.kind==='choice'?it.answer:fmtV(it.answer))}. Read the steps, then keep going.`, c:'bad' };
  render();
  if (it.done) setTimeout(()=>{ const b=document.getElementById('nextBtn'); if(b) b.focus({preventScroll:true}); },30);
}
async function nextQuestion(){
  const r = await quizCall('/next');
  if (!r) return;
  if (!r.result){ S.run = { session:r.session, fb:null, bad:false }; render(); speakAuto(); return; }
  store.set('arise_math_run', null);
  S.run = null; S.result = { result:r.result, session:r.session }; ME.profile = r.profile; ME.rank = r.result.rank;
  render(); window.scrollTo({top:0});
  const msgs = [];
  if (r.result.rank && (!r.result.rankBefore || r.result.rank < r.result.rankBefore)) msgs.push(`You’re #${r.result.rank} in ${ME.user.teacherName}’s class this week.`);
  r.result.newAchievements.forEach(a=>msgs.push(`Achievement unlocked: ${CAT.achievements.find(x=>x.id===a)?.name||a}`));
  if (msgs.length) toastQueue(msgs);
  if (r.result.perfect) confetti();
  refreshMe(); S.board=null; S.assign=null; loadFor('practice');
}

const shuf = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

const isRightLocal = (p, v) => p.kind==='choice' ? String(v)===String(p.answer) : Math.abs(parseNum(v)-Number(p.answer))<1e-9;

async function startMode(mode){
  const L = S.lesson; if (!L) return; stopSpeed();
  let set; try { set = await practiceSet([L.skill], MODES[mode].n); } catch(e){ return toast(e.message); }
  if (S.lesson!==L) return;
  Object.assign(L, { mode, set, i:0, first:0, known:0, again:0, streak:0, right:0, miss:0, wrong:[], done:false, over:false, flip:false, fb:null, last:null, hint: mode==='guided' && set[0].steps.length>1 ? 1 : 0 });
  if (mode==='speed'){
    L.end = Date.now()+60000;
    speedTimer = setInterval(()=>{ const left=Math.max(0,Math.ceil((L.end-Date.now())/1000)); const el=document.getElementById('spTime'); if(el) el.textContent=left+'s'; if(left<=0) finishSpeed(); }, 250);
  }
  render(); window.scrollTo({top:0}); focusMode();
}
const curP = () => S.lesson.set[S.lesson.i];
function focusMode(){ setTimeout(()=>{ const i=document.getElementById('mAns'); if (i && window.matchMedia('(pointer:fine)').matches) i.focus({preventScroll:true}); }, 0); }
async function moreProblems(){ const L=S.lesson; if (!L || L.set.length-L.i>=6 || L.loading) return; L.loading=true; try { const more=await practiceSet([L.skill], 20); if (S.lesson===L) L.set.push(...more); } catch {} L.loading=false; }
function finishSpeed(){
  const L=S.lesson; stopSpeed(); if (!L || L.mode!=='speed' || L.over) return;
  L.over=true; L.prev=bestSpeed(L.skill); L.newBest=L.right>L.prev; if (L.newBest){ keep.set('arise_math_speed_'+L.skill, L.right); if (L.right>=5) confetti(); }
  render();
}
function modeAnswer(v){
  const L=S.lesson, p=curP(); if (!p || L.done || L.over) return;
  const ok = isRightLocal(p, v);
  if (L.mode==='speed'){ if (ok) L.right++; else L.miss++; L.last = ok ? { c:'good', t:'Right!' } : { c:'bad', t:`${p.plain}: the answer was ${p.answerLabel}` }; L.i++; moreProblems(); return render(); }
  if (L.mode==='guided'){
    if (ok){ L.done=true; if (!L.wrong.length) L.first++; L.hint=p.steps.length; L.fb={ c:'good', t: L.wrong.length ? 'You got it. Read the steps to see why it works.' : 'Right on the first try!' }; }
    else { L.wrong.push(String(v)); L.hint=Math.min(p.steps.length, L.hint+1); L.fb={ c:'bad', t:'Not quite. Read the next step, then try again.' }; }
    return render();
  }
  if (L.mode==='mastery'){
    if (String(v).trim()==='') return;
    if (p.kind==='num' && Number.isNaN(parseNum(v))) { L.fb={ c:'bad', t:'Type a number, like 12, −3, 3/4 or 2.5.' }; return render(); }
    L.done=true;
    if (ok){ L.streak++; L.fb={ c:'good', t: L.streak>=5 ? 'Five in a row. Mastered!' : `Right! ${5-L.streak} more in a row.` }; if (L.streak>=5){ L.over=true; confetti(); } }
    else { L.streak=0; L.missed=true; L.typed=String(v); L.wrong.push(String(v)); L.fb={ c:'bad', t:`The answer is ${p.answerLabel}. Read the steps, then start a new streak.` }; }
    moreProblems(); render(); setTimeout(()=>document.getElementById('mNext')?.focus({preventScroll:true}),0); return;
  }
}
function modeNext(){
  const L=S.lesson; L.i++; Object.assign(L, { done:false, wrong:[], fb:null, flip:false, missed:false, typed:'' });
  if ((L.mode==='guided' || L.mode==='flash') && L.i>=L.set.length) L.over=true;
  else L.hint = L.mode==='guided' && curP().steps.length>1 ? 1 : 0;
  render(); window.scrollTo({top:0}); focusMode();
}

function tilesFor(band){
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
  let T, pair;
  if (band==='k2'){ T=10; pair=()=>{ const a=rnd(1,9); return [a,T-a]; }; }
  else if (band==='g35'){ T=pick([20,50,100]); pair=()=>{ const a=T===20?rnd(1,19):5*rnd(1,T/5-1); return [a,T-a]; }; }
  else if (band==='g68'){ T=pick([-6,-3,0,4,7]); pair=()=>{ const a=rnd(-15,15); return [a,T-a]; }; }
  else { T=pick([1,1.5,2]); pair=()=>{ const a=rnd(1,T*4-1)/4; return [a,+(T-a).toFixed(2)]; }; }
  const tiles=[]; for(let i=0;i<6;i++) tiles.push(...pair());
  for(let i=tiles.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [tiles[i],tiles[j]]=[tiles[j],tiles[i]]; }
  return { T, pair, tiles: tiles.map(v=>({ v, id:'t'+Math.random().toString(36).slice(2) })) };
}

/** Lessons whose question is about a picture (count the dots, read the clock), and ones whose short form isn't a true equation. */
const SEE = new Set(['kcount','kmore','kshape','ksides','add20','sub20','pct','g2oddeven','g1time','g2time5','g2bar','g3fracshade','g5coord']);
const NOT_EQ = new Set(['g4addfrac','g4fracmul','g8scimul','tens']);
const FACTS = { k2:['kadd10','kmake10','g2facts','g1three','g1sub10s','kdecompose','g1unknown'], g35:['mult','div','g3mult10','g3add1000','g3twostep','g3eqfrac','g4mixed'], g68:['int','g7muldiv','g6exp','g7rational','g6divfrac','g6decops','g5order'], g912:['hsradical','hsexpgrowth','g7muldiv','int','g7rational','g8exp'] };
const shortMath = p => p.kind==='num' && !SEE.has(p.skill) && !NOT_EQ.has(p.skill) && p.plain.length<=18 && /\d/.test(p.plain) && /^[-\d\s+−×÷().\/=?,:|²^√%]+$/.test(p.plain);
const eqText = (p, label) => p.plain.includes('?') ? p.plain.replace('?', label) : `${p.plain} = ${label}`;
async function gamePool(kind){
  const band = myBand(), grade = coLessons(coGrade()).map(l=>l.skill);
  const want = kind==='balloon' ? (p => !SEE.has(p.skill) && !p.viz && p.choices.length>=2 && (p.kind==='choice' || !NOT_EQ.has(p.skill))) : shortMath;
  let list = (await practiceSet(shuf([...new Set([...grade, ...FACTS[band]])]), 40)).filter(want);
  if (list.length < 12) list = list.concat((await practiceSet(FACTS[band], 30)).filter(want));

function makeStmt(p){ const truth = Math.random()<.5, wrong = p.choices.filter(c=>Number(c.v)!==Number(p.answer)); const label = truth || !wrong.length ? p.answerLabel : wrong[Math.floor(Math.random()*wrong.length)].label; return { text: eqText(p, label), truth: truth || !wrong.length, right: eqText(p, p.answerLabel) }; }

  if (GAME.sel===id){ GAME.sel=null; return render(); }

    if (pool.length < 6) return toast('Not enough questions for this game yet. Try another game.');

/* Memory Match: flip two cards; a problem and its answer stay up. */
function flipCard(id){
  const G = GAME; if (!G || G.over || G.kind!=='memory' || G.lock) return;
  const c = G.cards.find(x=>x.id===id); if (!c || G.up.includes(id) || G.matched.includes(id)) return;
  G.up.push(id); G.flips++;
  if (G.up.length===2){
    const [a,b] = G.up.map(x=>G.cards.find(y=>y.id===x));
    if (a.side!==b.side && a.key===b.key){ G.matched.push(a.id,b.id); G.up=[]; G.score++; G.just=[a.id,b.id];
      if (G.matched.length===G.cards.length){ render(); confetti(); return endGame(`All matched in ${Math.round((Date.now()-G.start)/1000)} seconds and ${G.flips} flips!`); } }
    else { G.lock=true; G.just=null; setTimeout(()=>{ if (GAME!==G) return; G.up=[]; G.lock=false; if (S.tab==='games') render(); }, 900); }
  } else G.just=null;
  render();
}

/* Streak Sprint: type each answer; a right streak raises the multiplier, a miss resets it to 0. */
const streakQ = () => GAME.pool[GAME.qi % GAME.pool.length];
const streakMult = s => s>=10?4:s>=6?3:s>=3?2:1;
function streakAnswer(v){
  const G = GAME; if (!G || G.over || G.kind!=='streak') return;
  if (String(v).trim()==='') return;
  const p = streakQ(), ok = isRightLocal(p, v);
  if (p.kind==='num' && Number.isNaN(parseNum(v))) { G.last={ c:'bad', t:'Type a number, like 12, −3, 3/4 or 2.5.' }; return render(); }
  if (ok){ const mult = streakMult(G.streak); G.streak++; G.score += mult; if (G.streak>G.best) G.best = G.streak; G.last = { c:'good', t: mult>1 ? `Right! ×${mult} streak bonus.` : 'Right!' }; }

  G.qi++; G.stmt = makeStmt(G.pool[G.qi % G.pool.length]); G.flash = ok ? 'good' : 'bad';

    <div class="row between"><span class="small muted tnum">${total} of ${g.players.length} answered</span><div class="row"><button class="btn" data-act="liveend">End game</button><button class="btn primary" data-act="livenext">${rev?(g.qi>=g.total?'Show winners':'Next question'):'Reveal answer'}</button></div></div></div>`;
}

/* ================= CONFETTI ================= */
function confetti(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#3f3bd6','#f29a14','#ef5a45','#12a594','#8b5cf6','#ffb23f'];
  const ps=range(1,140).map(()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,s:4+Math.random()*5,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0; (function loop(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.r+=.1; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); }); if(++f<120) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

/* ================= DATA ================= */
async function refreshMe(){ try { ME = await api('/me'); render(); } catch {} }
async function loadFor(tab){
  const r = role();
  try {
    if (r==='student'){
      if (tab==='practice' && ME.user.hasClass && S.assign==null){ S.assign = (await api('/assignments')).assignments; }
      if ((tab==='board' || tab==='practice') && S.board==null){ S.board = await api('/board?period='+S.period); }
    } else if (isStaff()){
      if (S.cls==null){ S.cls = await api('/class'); }
      if (tab==='assign' || tab==='class'){ if (S.assign==null) S.assign = (await api('/assignments')).assignments; }
      if (tab==='board'){ S.board = await api('/board?period='+S.period); }
      if (tab==='live' && S.live===undefined){ S.live = (await api('/live/current')).game; }
    } else if (r==='parent'){
      if (S.children==null) S.children = (await api('/children')).children;
    }
    S.err = {};
  } catch(e){
    if (e.body?.setup) return centerMessage('Almost ready', 'Arise Math is still being set up. Please check back soon.');
    if (tab==='practice'){ if (S.assign==null) S.assign = []; toast(e.message); }
    else S.err[{board:'board', class:'cls', assign:'cls', live:'live', family:'children', play:'cls'}[tab] || 'board'] = e.message;
  }
  if (ME) render();
}
let polling = false;
setInterval(async ()=>{
  if (polling || !ME) return;
  polling = true;
  try {
    if (role()==='student' && S.lplay && S.tab==='practice'){ const g=(await api(`/live/${S.lplay.id}/play`)).game; liveOffset = g.serverNow - Date.now(); S.lplay.game = g; render(); }
    else if (isStaff() && S.tab==='live' && S.live && ['lobby','q','reveal'].includes(S.live.phase)){ const g=(await api(`/live/${S.live.id}`)).game; liveOffset = g.serverNow - Date.now(); S.live = g; render(); }
  } catch(e){ if (e.code===404 && S.lplay){ S.lplay=null; render(); } }
  finally { polling = false; }
}, 1500);
setInterval(()=>{ const el=document.getElementById('ltimer'); const g = S.lplay?.game || S.live; if (el && g && g.phase==='q') el.textContent = liveLeft(g)+'s'; }, 500);

async function saveMe(body){

document.addEventListener('change', e=>{
  if (e.target && e.target.id==='statePick'){ try { localStorage.setItem(STATE_KEY, e.target.value); } catch {} render(); }
});
document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.act==='menu')) { S.menu=false; renderChrome(); }
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act==='close'){ if (e.target===el || el.classList.contains('x')) closeModal(); return; }
  if (el.tagName==='A' && act) e.preventDefault();
  switch(act){
    case 'signin': return goSignIn('/');
    case 'join': return goSignIn('/register');
    case 'go': return goSignIn(v);
    case 'menu': S.menu=!S.menu; return renderChrome();
    case 'tab':
      if (S.tab==='games' && v!=='games' && GAME && !GAME.over) endGame('Round ended.');
      S.tab=v; S.menu=false; S.lesson=null; S.snap=null; stopSpeed(); if (v==='practice' && S.result) S.result=null;
      render(); window.scrollTo({top:0}); return loadFor(v);
    case 'home': S.result=null; return render();
    case 'band': { if (S.run) return; return saveMe({ band: v || null }).then(()=>{ S.board=null; }); }
    case 'start': S.lesson=null; stopSpeed(); return startQuiz(el.dataset.type, v);
    case 'learn': return openLesson(v);
    case 'lclose': stopSpeed(); S.lesson=null; render(); window.scrollTo({top:0}); return;

    case 'exall': if (S.lesson?.ex){ S.lesson.shown=S.lesson.ex.steps.length; render(); } return;
    case 'exnew': return newExample();
    case 'lprint': return printLesson(S.lesson.skill, v);
    case 'lmode': return startMode(v);
    case 'lback': stopSpeed(); if (S.lesson){ S.lesson.mode=null; render(); window.scrollTo({top:0}); } return;
    case 'mpick': return modeAnswer(v);

    case 'quit': S.run=null; store.set('arise_math_run', null); return render();

    case 'hint': { const r = await quizCall('/hint'); if (r){ S.run.session=r.session; S.run.bad=false; render(); } return; }

Object.assign(I, {
