<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- YouTube's player needs to know which site it's on. Inside the iPhone apps the page has no web
     address of its own, so Arise Fit plays its how-to videos through this page on arisetodo.com. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Arise Fit video</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #player, iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px;
    font: 600 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #f4f4f7;
    background: radial-gradient(120% 90% at 50% 0%, #2a2a38, #0b0b10); }
  #fallback a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 14px; background: #ff3d3d; color: #fff; text-decoration: none; }
  #fallback p { margin: 0; color: #c9c9d4; }
</style>
</head>
<body>
<div id="player"></div>
<div id="fallback"><div><p>This video can't play inside Arise Fit.</p><a id="watch" href="#" target="_blank" rel="noopener">Watch on YouTube</a></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get("v") || "";
  var fallback = document.getElementById("fallback");
  function showFallback() { fallback.style.display = "grid"; }
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) { showFallback(); return; }
  document.getElementById("watch").href = "https://www.youtube.com/watch?v=" + id;
  var autoplay = q.get("autoplay") === "1";
  var started = false;

  window.onYouTubeIframeAPIReady = function () {
    new YT.Player("player", {
      host: "https://www.youtube-nocookie.com",
      videoId: id,
      playerVars: { autoplay: autoplay ? 1 : 0, playsinline: 1, rel: 0, modestbranding: 1, controls: 1, origin: location.origin },
      events: {
        onReady: function (e) { started = true; fallback.style.display = "none"; if (autoplay) { try { e.target.playVideo(); } catch (_) {} } },
        // 2: bad id; 5: can't play here; 100: removed or private; 101/150/152/153: the owner or YouTube won't allow it here
        onError: function () { showFallback(); }
      }
    });
  };
  var s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.async = true;
  s.onerror = showFallback;
  document.head.appendChild(s);
  // No player at all after 12 seconds (YouTube unreachable): offer the link instead of a black box.
  setTimeout(function () { if (!started) showFallback(); }, 12000);
})();
</script>
</body>
</html>
