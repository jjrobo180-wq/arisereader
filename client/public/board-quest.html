<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>A.R.I.S.E. Board Quest</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(#082f49,#155e75,#166534);color:#fff;min-height:100vh}button{font:inherit;font-weight:800;cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px;background:#020617dd}.back,.action,.choice{border:0;border-radius:14px;padding:12px 16px}.back{background:#1e293b;color:#fff}.score{display:flex;gap:8px}.blue,.gold{padding:9px 12px;border-radius:12px;font-weight:900}.blue{background:#1d4ed8}.gold{background:#facc15;color:#111827}.setup{max-width:760px;margin:8vh auto;text-align:center;padding:20px}.setup h1{font-size:clamp(34px,8vw,64px);margin:8px}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:25px 0}.levels button{padding:22px;border-radius:18px;border:2px solid #ffffff44;background:#ffffff12;color:#fff;font-size:20px}.levels button.on{background:#06b6d4;border-color:#fff}.action{background:#facc15;color:#111827;font-size:20px}.action:disabled{opacity:.4}.game{display:none}.boardwrap{max-width:900px;margin:20px auto 230px;padding:12px;perspective:900px}.board{background:#064e3b;border:10px solid #78350f;border-radius:28px;padding:10px;box-shadow:0 30px 60px #0008;transform:rotateX(7deg)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.tile{aspect-ratio:1;border-radius:12px;border:1px solid #ffffff55;position:relative;padding:5px;font-weight:900;min-height:55px}.points{background:#16a34a}.safe{background:#64748b}.steal{background:#e11d48}.shield{background:#2563eb}.power{background:#9333ea}.rps{background:#ea580c}.bonus{background:#facc15;color:#111827}.pieces{position:absolute;inset:15px 2px 2px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center}.piece{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0f172a;border:3px solid white;font-size:18px}.panel{position:fixed;z-index:8;bottom:10px;left:50%;transform:translateX(-50%);width:min(94vw,680px);background:#020617f2;border:1px solid #ffffff33;border-radius:24px;padding:15px;text-align:center;box-shadow:0 15px 40px #0009}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{background:#ffffff18;color:#fff}.legend{text-align:center;font-size:12px;padding:8px}.turn{font-weight:900;font-size:18px}.msg{margin:8px 0 12px}.die{font-size:42px}.strike{color:#fda4af}@media(max-width:600px){.grid{gap:3px}.board{padding:5px;border-width:6px}.tile{min-height:44px;border-radius:7px;font-size:10px}.piece{width:24px;height:24px;font-size:14px}.top{font-size:12px}.boardwrap{margin-top:8px}.panel{padding:12px}}</style></head><body><div class="top"><button class="back" onclick="location.replace('/#/worlds')">← Worlds</button><div class="score"><span class="blue" id="bs">🔵 0</span><span class="gold" id="gs">🟡 0</span></div></div><section class="setup" id="setup"><div style="font-size:70px">🎲</div><h1>A.R.I.S.E. BOARD QUEST</h1><p>Answer • Roll • Move • Battle • Win together</p><h3>Choose learning level</h3><div class="levels" id="levels"></div><button class="action" id="start" disabled>START TEAM GAME</button><p>Correct answer unlocks the dice. Three strikes and a player is out.</p></section><section class="game" id="game"><div class="boardwrap"><div class="board"><div class="grid" id="grid"></div><div class="legend">🟢 +50 · 🔴 Steal · 🔵 Shield · 🟣 Power · 🟠 RPS · 🟡 +100 · ⬜ Safe</div></div></div><div class="panel"><div class="turn" id="turn"></div><div class="msg" id="msg"></div><div id="controls"></div></div></section><script>
const BANK={"K-2":[["What is 4 + 3?",["6","7","8","9"],1],["Which word rhymes with cat?",["dog","hat","sun","red"],1],["What is 10 - 2?",["6","7","8","9"],2]],"3-5":[["What is 8 × 6?",["42","46","48","54"],2],["Which is a synonym for happy?",["Glad","Angry","Tiny","Slow"],0],["What is 3/4 of 20?",["10","12","15","18"],2]],"6-8":[["Solve: 3x + 5 = 20",["3","5","7","15"],1],["What is 25% of 80?",["10","20","25","40"],1],["Which word is an adjective?",["Run","Quickly","Bright","Under"],2]],"9-12":[["Positive solution of x² - 9 = 0?",["1","3","6","9"],1],["Slope between (0,2) and (4,10)?",["1","2","4","8"],1],["Which is a metaphor?",["Cold as ice","Time is a thief","He ran quickly","The dog barked"],1]]};
const EVENTS=['points','safe','steal','shield','power','rps','bonus'], EM={points:'🟢',safe:'⬜',steal:'🔴',shield:'🔵',power:'🟣',rps:'🟠',bonus:'🟡'};let level=null,turn=0,blue=0,gold=0,busy=false,q=null;let P=[];const fresh=()=>[{name:'You',team:'blue',space:0,strikes:0,shield:0,power:0,out:false,icon:'🧑🏽‍🚀',human:true},{name:'Robin CPU',team:'gold',space:0,strikes:0,shield:0,power:0,out:false,icon:'🏹'},{name:'Alice CPU',team:'blue',space:0,strikes:0,shield:0,power:0,out:false,icon:'👧'},{name:'Arthur CPU',team:'gold',space:0,strikes:0,shield:0,power:0,out:false,icon:'🤴'}];
const $=id=>document.getElementById(id), levels=$('levels');Object.keys(BANK).forEach(l=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{level=l;[...levels.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');$('start').disabled=false};levels.appendChild(b)});$('start').onclick=start;
function start(){P=fresh();turn=blue=gold=0;busy=false;$('setup').style.display='none';$('game').style.display='block';build();update('Your turn — answer correctly to roll!');setTimeout(runTurn,250)}
function build(){let g=$('grid');g.innerHTML='';for(let v=0;v<28;v++){let row=Math.floor(v/7),col=v%7,i=row%2?v-row*7+row*7+(6-col):v; i=row%2?row*7+(6-col):v;let e=EVENTS[i%EVENTS.length],d=document.createElement('div');d.className='tile '+e;d.dataset.i=i;d.innerHTML=`<span>${i+1} ${EM[e]}</span><div class="pieces"></div>`;g.appendChild(d)}render()}
function render(){document.querySelectorAll('.pieces').forEach(x=>x.innerHTML='');P.forEach(p=>{if(p.out)return;let box=document.querySelector(`[data-i="${p.space}"] .pieces`);if(box){let s=document.createElement('span');s.className='piece';s.textContent=p.icon;s.title=p.name;box.appendChild(s)}});$('bs').textContent='🔵 '+blue;$('gs').textContent='🟡 '+gold;let p=P[turn];$('turn').innerHTML=`${p.icon} ${p.name} · ${p.team.toUpperCase()} · <span class="strike">${'❌'.repeat(p.strikes)}</span> 🛡️${p.shield} ⚡${p.power}`}
function update(m){$('msg').textContent=m;render()}
function runTurn(){let p=P[turn];if(p.out){next();return}if(p.human){$('controls').innerHTML='<button class="action" onclick="ask()">GET QUESTION</button>'}else{$('controls').innerHTML='<span>Computer is thinking…</span>';setTimeout(()=>cpu(p),700)}render()}
function ask(){if(busy)return;let b=BANK[level],item=b[Math.floor(Math.random()*b.length)];q=item;$('msg').textContent='Get it right to unlock the dice!';$('controls').innerHTML=`<h3>${item[0]}</h3><div class="answers">${item[1].map((a,i)=>`<button class="choice" onclick="answer(${i})">${a}</button>`).join('')}</div>`}
function answer(i){if(!q||busy)return;if(i!==q[2]){strike(P[turn]);q=null;setTimeout(next,900)}else{q=null;roll(P[turn])}}
function cpu(p){let chance={"K-2":.72,"3-5":.68,"6-8":.64,"9-12":.60}[level];if(Math.random()>chance){strike(p);setTimeout(next,800)}else roll(p)}
function strike(p){if(p.shield){p.shield--;update('🛡️ Shield blocked the strike!')}else{p.strikes++;if(p.strikes>=3){p.out=true;update('❌ '+p.name+' has 3 strikes and is out!')}else update('❌ '+p.name+' gets strike '+p.strikes+' of 3')}}
function roll(p){busy=true;let raw=1+Math.floor(Math.random()*6),n=Math.min(8,raw+(p.power?2:0));p.power=0;$('controls').innerHTML='<div class="die">🎲 '+n+'</div>';update(p.name+' rolled '+n+'!');let steps=0,t=setInterval(()=>{steps++;p.space=Math.min(27,p.space+1);render();if(steps>=n||p.space>=27){clearInterval(t);setTimeout(()=>land(p),300)}},240)}
function land(p){let e=EVENTS[p.space%EVENTS.length];if(e==='points'){p.team==='blue'?blue+=50:gold+=50;update('🎉 +50 team points!')}else if(e==='steal'){if(p.team==='blue'){blue+=30;gold=Math.max(0,gold-30)}else{gold+=30;blue=Math.max(0,blue-30)}update('⚡ Stole 30 points!')}else if(e==='shield'){p.shield++;update('🛡️ Strike shield collected!')}else if(e==='power'){p.power++;update('⚡ Super power: +2 next roll!')}else if(e==='bonus'){p.team==='blue'?blue+=100:gold+=100;update('⭐ Jackpot +100!')}else if(e==='rps'){let rivals=P.filter(x=>x.team!==p.team&&!x.out);let r=rivals[Math.floor(Math.random()*rivals.length)];if(r){if(Math.random()>.5){strike(r);$('msg').textContent='✊ '+p.name+' wins RPS — '+r.name+' gets a strike!'}else{strike(p);$('msg').textContent='✋ '+p.name+' loses RPS — strike!'}}}else update('😌 Safe space — nothing happens.');render();if(p.space>=27){finish();return}setTimeout(next,1000)}
function next(){busy=false;$('controls').innerHTML='';let alive=P.filter(x=>!x.out);if(!alive.some(x=>x.team==='blue')||!alive.some(x=>x.team==='gold')){finish();return}do{turn=(turn+1)%P.length}while(P[turn].out);update(P[turn].name+"'s turn");setTimeout(runTurn,350)}
function finish(){busy=true;let bs=blue+P.filter(x=>x.team==='blue'&&!x.out).length*25-P.filter(x=>x.team==='blue').reduce((s,x)=>s+x.strikes,0)*10,gs=gold+P.filter(x=>x.team==='gold'&&!x.out).length*25-P.filter(x=>x.team==='gold').reduce((s,x)=>s+x.strikes,0)*10;let w=bs===gs?'TIE GAME':bs>gs?'BLUE TEAM WINS!':'GOLD TEAM WINS!';$('msg').textContent='🏆 '+w;$('controls').innerHTML='<button class="action" onclick="start()">PLAY AGAIN</button>'}
</script></body></html>
