<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.R.I.S.E. Connect</title>
<meta name="description" content="A.R.I.S.E. Connect: a safe, LinkedIn-style career network where K–12 students take short career courses, earn certificates and explore trades, the military, teaching, health care, tech and college paths, with their teachers and parents.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

/* Layout: the A.R.I.S.E. family. Light To-Do surfaces (off-white page, white cards, soft blue shadows, teal-blue-purple gradient, Manrope + DM Sans) with A.R.I.S.E. Reader's deep plum for course banners and the certificate moment. Light on purpose, like arisetodo.com. */
:root{
  --bg:#F9FAFC; --surface:#FFFFFF; --surface-2:#F2F5FC; --ink:#1C2238; --ink-2:#4A556F; --ink-3:#69738C; --line:#E9EDF5; --line-2:#DCE4F0;
  --blue:#5169ED; --teal:#11B9AF; --purple:#8B64E9;
  --plum:#0E0D18; --plum-card:#1B1A2C; --plum-line:rgba(255,255,255,.1); --violet:#9B4DEE; --cyan:#06B6D4;
  --primary:#5169ED; --primary-ink:#FFFFFF; --primary-soft:#EEF1FE;
  --gold:#11B9AF; --gold-soft:#E4F8F3; --gold-ink:#0D3D4B; --lav:#8B64E9;
  --good:#12A27A; --good-soft:#E4F8F3; --bad:#E5484D; --bad-soft:#FDECEC;
  --grad:linear-gradient(115deg,#10B9AF 0%,#5279ED 53%,#9363E7 100%);
  --grad-reader:linear-gradient(135deg,#7C3AED 0%,#C026D3 52%,#06B6D4 100%);
  --paper:#FFFFFF; --paper-ink:#1C2238; --paper-line:#D6DDF0; --seal:#5169ED; --seal-dot:#11B9AF;
  --f-trades:#F0703A; --f-eng:#4F72E8; --f-film:#E5484D; --f-music:#D946A8; --f-health:#12A27A; --f-tech:#0EA5C6; --f-biz:#65A30D; --f-food:#D97706; --f-sports:#9333EA; --f-air:#0369A1; --f-games:#7C3AED;
  --font-display:Manrope,"DM Sans",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --shadow:0 24px 65px rgba(33,53,97,.10),0 2px 10px rgba(33,53,97,.035); --shadow-sm:0 4px 14px rgba(35,62,101,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:radial-gradient(520px 380px at 78% 120px,#E7E8FF 0%,transparent 70%),radial-gradient(520px 420px at 15% 420px,#EAFAF8 0%,transparent 70%),var(--bg);background-repeat:no-repeat;background-color:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
::selection{background:#C8F4EF;color:#0D3D4B}
h1,h2,h3{font-family:var(--font-display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:-.03em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #749AF1;outline-offset:3px;border-radius:10px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.02em}
.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#52617C}
.muted{color:var(--ink-3)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* App bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(249,250,252,.83);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(229,234,242,.8)}
.top .wrap{display:flex;align-items:center;gap:10px 26px;flex-wrap:wrap;padding-block:14px}
.brand{display:inline-flex;align-items:center;gap:11px;background:none;border:0;padding:0;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.9px;color:var(--ink);white-space:nowrap}
.brand svg{width:36px;height:36px;flex:none}
.brand .period{color:var(--teal)}
.brand .brand-sub{color:#7C87A0;font-weight:700}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;color:#5B657B}
.tab:hover{color:var(--blue)}
.tab[aria-current="true"]{background:var(--primary-soft);color:var(--blue)}
.stats{margin-left:auto;display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;font-weight:800;font-size:.84rem;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow-sm)}
.pill.gold svg{color:var(--purple)}
.pill.teal{background:var(--gold-soft);border-color:#C8EFE6;color:#0D6E66}
@media (max-width:680px){.stats{margin-left:0;order:3}.tabs{order:4;width:100%}}

main{padding-block:40px 90px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:14px;padding:13px 21px;font-weight:800;font-size:15px;letter-spacing:-.1px;cursor:pointer;color:#fff;background:linear-gradient(110deg,#16B4BB,#5478E9 61%,#8665E8);box-shadow:0 10px 23px rgba(76,106,223,.20);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 28px rgba(76,106,223,.27)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:#fff;color:#35415E;border-color:#E4E9F3;box-shadow:var(--shadow-sm)}
.btn.goldbtn{background:var(--grad-reader);box-shadow:0 12px 26px rgba(124,58,237,.25)}
.btn.small{padding:9px 15px;font-size:.88rem;border-radius:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--blue);font-weight:800;cursor:pointer}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:center;margin-bottom:72px;position:relative}
.hero::after{content:"";position:absolute;right:-120px;top:-40px;width:520px;height:520px;border:1px solid #D0D5F5;border-radius:50%;opacity:.45;pointer-events:none;z-index:-1}
.hero .eyebrow{display:inline-flex;align-items:center;gap:9px}
.hero .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px #D6F5F1}
.hero h1{font-size:clamp(2.6rem,5.3vw,4.4rem);letter-spacing:-.05em;line-height:1.08;margin-top:18px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{margin-top:20px;font-size:1.12rem;color:var(--ink-2);max-width:54ch}
.compass{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.compass p{font-family:var(--font-display);font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #E4E9F3;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.9rem;color:#35415E}
.chip:hover{border-color:#C8D3EC;color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:#C3CCFA;color:var(--blue)}
.hero-cert{max-width:440px;justify-self:center;width:100%;transform:rotate(1deg)}
@media (max-width:880px){.hero{grid-template-columns:1fr}.hero::after{display:none}.hero-cert{transform:none}}

/* Catalog */
.cat-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.cat-head h2{font-size:clamp(1.9rem,3.6vw,2.8rem);letter-spacing:-.045em}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}
.seg{display:flex;flex-wrap:wrap;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.86rem;color:#5B657B}
.seg button:hover{color:var(--blue)}
.seg button[aria-pressed="true"]{background:var(--primary-soft);color:var(--blue)}
.select,.search{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:700;font-size:.88rem;color:var(--ink)}
.search{min-width:0;width:240px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;display:flex;flex-direction:column;cursor:pointer;text-align:left;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;color:var(--ink)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .banner{padding:18px 20px;display:flex;align-items:center;gap:14px;background:color-mix(in srgb,var(--fc) 9%,#fff);border-bottom:1px solid color-mix(in srgb,var(--fc) 16%,#fff)}
.card .body{padding:16px 20px 20px;display:flex;flex-direction:column;gap:11px;flex:1}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:var(--fc);box-shadow:0 8px 18px -8px var(--fc)}
.ico svg{width:24px;height:24px}
.card .banner .eyebrow{color:color-mix(in srgb,var(--fc) 80%,#1C2238)}
.card h3{font-size:1.25rem;letter-spacing:-.03em}
.card .blurb{color:var(--ink-2);font-size:.95rem;flex:1;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
.meta b{color:var(--ink);font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--surface-2);color:#52617C}
.badge-match{position:absolute;top:14px;right:14px;font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:#fff;color:var(--blue);border:1px solid #C3CCFA;z-index:1}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.earned{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.86rem;color:var(--purple);background:#F0EAFF;border-radius:10px;padding:4px 10px;align-self:flex-start}
.empty{padding:30px;border:1px dashed var(--line-2);border-radius:var(--r);text-align:center;color:var(--ink-3);background:#fff}

/* Course page: Reader plum banner */
.back{margin-bottom:22px}
.course-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start;border-radius:28px;padding:clamp(22px,4vw,42px);color:#F8F9FC;
  background:radial-gradient(420px 280px at 0 0,color-mix(in srgb,var(--fc) 34%,transparent),transparent 75%),radial-gradient(380px 300px at 100% 100%,rgba(124,58,237,.32),transparent 75%),var(--plum);box-shadow:0 30px 70px -30px rgba(14,13,24,.55)}
.course-hero .ico{box-shadow:none}
.course-hero .eyebrow{color:#A5F3FC}
.course-hero .mono,.course-hero .muted{color:#AAB3CB}
.course-hero h1{font-size:clamp(2.1rem,4.6vw,3.3rem);margin:14px 0 12px;letter-spacing:-.045em;color:#fff}
.course-hero .lede{color:#CBD5E1;font-size:1.08rem;max-width:60ch}
.course-hero .meta{color:#AAB3CB}
.course-hero .meta b{color:#fff}
.course-hero .btn{background:#fff;color:#020617;box-shadow:0 20px 40px -18px rgba(0,0,0,.8)}
.course-hero .btn.goldbtn{background:var(--grad-reader);color:#fff}
.course-hero .panel{background:var(--plum-card);border-color:var(--plum-line);box-shadow:none;color:#E2E8F0}
.course-hero .checks svg{color:#6EE7B7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm)}
.panel h3{font-size:1.1rem;margin-bottom:14px}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:11px}
.checks li{display:flex;gap:11px;align-items:flex-start}
.checks svg{flex:none;width:18px;height:18px;margin-top:3px;color:var(--good)}
.meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.lessons{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.lesson-row{display:flex;align-items:center;gap:15px;padding:15px 18px;background:#fff;border:1px solid var(--line);border-radius:16px;cursor:pointer;width:100%;text-align:left;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;color:var(--ink)}
.lesson-row:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:var(--surface-2);color:#52617C;flex:none;font-variant-numeric:tabular-nums}
.num.done{background:var(--grad);color:#fff}
.lesson-row .t{flex:1;min-width:0}
.lesson-row .t b{display:block;font-weight:800}
.section{margin-top:48px}
.section > h2{font-size:1.7rem;margin-bottom:18px;letter-spacing:-.04em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.kv{display:grid;gap:12px;color:var(--ink-2)}
.kv div{display:grid;gap:6px}
@media (max-width:880px){.course-hero{grid-template-columns:1fr}}

/* Lesson */
.lesson-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:grid;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm)}
.side button{display:flex;gap:11px;align-items:center;background:none;border:0;padding:8px;border-radius:12px;cursor:pointer;text-align:left;font-weight:700;color:#5B657B;font-size:.94rem}
.side button:hover{color:var(--blue)}
.side button[aria-current="true"]{background:var(--primary-soft);color:var(--blue)}
.side .num{width:28px;height:28px;font-size:.82rem;border-radius:9px}
.article{max-width:740px;display:grid;gap:32px}
.article h1{font-size:clamp(2rem,4.2vw,2.9rem);letter-spacing:-.045em}
.reading{display:grid;gap:15px;font-size:1.08rem;max-width:65ch;color:var(--ink-2);line-height:1.7}
.terms{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.term{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.term b{display:block;font-family:var(--font-display);font-weight:800;letter-spacing:-.02em}
.term span{font-size:.9rem;color:var(--ink-3)}
.block-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.block-title h2{font-size:1.4rem;letter-spacing:-.035em}
.step-label{font-size:11px;font-weight:800;letter-spacing:1.4px;padding:5px 10px;border-radius:8px;background:var(--gold-soft);color:#0D6E66}
.tryit{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm);color:var(--ink-2)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:13px;box-shadow:var(--shadow-sm)}
.q > b{font-family:var(--font-display);font-size:1.06rem;font-weight:800;letter-spacing:-.02em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 14px;border-radius:13px;border:1px solid #E4E9F3;background:var(--bg);cursor:pointer;font-weight:600;color:#35415E}
.opt:hover:not(:disabled){border-color:#C3CCFA;background:#F7F9FF}
.opt:disabled{cursor:default}
.opt.right{border-color:#9BE3CF;background:var(--good-soft);color:#0B5E47}
.opt.wrong{border-color:#F5C2C4;background:var(--bad-soft);text-decoration:line-through;text-decoration-color:var(--bad);color:#8A3A3D}
.opt .k{font-family:var(--font-display);font-size:.8rem;font-weight:800;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);flex:none}
.feedback{font-size:.94rem;padding:11px 14px;border-radius:12px}
.feedback.ok{background:var(--good-soft);color:#0B5E47}
.feedback.no{background:var(--bad-soft);color:#8A3A3D}
.finish{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 22px;border-radius:22px;font-weight:700;
  border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,var(--grad) border-box;box-shadow:var(--shadow)}
@media (max-width:880px){.lesson-layout{grid-template-columns:1fr}.side{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}}

/* Activities */
.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;align-items:center}
.field{display:grid;gap:7px}
.field label{font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--ink)}
.field input[type=range]{width:100%;accent-color:var(--blue)}
.field input[type=number]{border:1px solid var(--line-2);background:var(--bg);border-radius:12px;padding:9px 12px;width:100%;font-weight:700}
.readout{font-family:var(--font-display);font-size:2rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--ink)}
.bulb{display:grid;place-items:center;gap:8px;text-align:center}
.beat{overflow-x:auto}
.beat table{border-collapse:separate;border-spacing:4px;min-width:560px}
.beat th{font-size:.8rem;text-align:left;padding-right:8px;font-weight:800;color:var(--ink-3)}
.beat td button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2);background:#fff;cursor:pointer;display:block}
.beat td.bar1 button{background:var(--surface-2)}
.beat td button[aria-pressed="true"]{background:var(--f-music);border-color:var(--f-music)}
.beat td.now button{outline:2px solid var(--teal);outline-offset:1px}
.beat-ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px}
.profit-out{display:grid;gap:8px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.profit-out div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}

/* Certificate */
.cert{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:12px;border:1px solid var(--line);box-shadow:0 40px 80px rgba(46,60,113,.15),0 3px 10px rgba(40,65,102,.04)}
.cert-inner{border-radius:10px;border:1.5px solid var(--paper-line);padding:clamp(18px,4vw,34px);text-align:center;display:grid;gap:10px;position:relative;
  background:radial-gradient(240px 140px at 100% 0,#F0EAFF,transparent 70%),radial-gradient(240px 140px at 0 100%,#E4F8F3,transparent 70%),#fff}
.cert-inner::before{content:"";position:absolute;inset:0 0 auto;height:5px;border-radius:10px 10px 0 0;background:var(--grad)}
.cert .issuer{font-family:var(--font-display);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--seal)}
.cert .ctype{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-3);font-weight:800}
.cert .who{font-family:var(--font-display);font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:800;letter-spacing:-.04em;border-bottom:1.5px solid var(--paper-line);padding-bottom:6px;margin:4px auto 0;min-width:60%;overflow-wrap:anywhere}
.cert .what{font-size:.98rem;color:var(--ink-2)}
.cert .course{font-family:var(--font-display);font-size:clamp(1.2rem,2.6vw,1.55rem);font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cert .foot{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-top:10px;text-align:left;font-size:.8rem;color:var(--ink-3);flex-wrap:wrap}
.cert .foot b{color:var(--ink)}
.cert .seal{width:74px;height:74px;flex:none}
.cert-small .cert-inner{padding:22px 20px 20px}
.cert-small .seal{width:54px;height:54px}
.cert-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.cert-tile{display:grid;gap:14px}

.post-stats{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--ink-3);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);padding-bottom:8px}

.suggest{display:flex;gap:10px;align-items:flex-start}

.invite-actions{display:flex;gap:8px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.pcard{overflow:hidden;display:grid;justify-items:center;text-align:center;padding-bottom:14px;gap:8px;box-shadow:none}
.pcard-banner{height:56px;width:100%;background:linear-gradient(120deg,color-mix(in srgb,var(--pc) 70%,#fff),color-mix(in srgb,var(--pc) 25%,#fff))}

.paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.p-id .sub{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.p-actions{display:flex;flex-wrap:wrap;gap:10px}
.open-to{margin:0 24px 22px;padding:14px 16px;border-radius:14px;background:var(--gold-soft);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;color:#0D4F4A}

.overlay{position:fixed;inset:0;background:rgba(28,34,56,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-left,0px))}
.modal{border:2px solid transparent;background:radial-gradient(360px 220px at 50% 0,rgba(124,58,237,.35),transparent 70%) padding-box,linear-gradient(var(--plum),var(--plum)) padding-box,var(--grad-reader) border-box;color:#F8F9FC;border-radius:28px;padding:30px;max-width:520px;width:100%;display:grid;gap:18px;text-align:center;max-height:90vh;overflow:auto;box-shadow:0 44px 96px -40px rgba(147,72,239,.75)}

.demo-note{font-size:.88rem;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:36px}

@keyframes rise{from{transform:translateY(12px);opacity:.5}to{transform:none;opacity:1}}
.modal{animation:rise .3s ease}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  --create:#11B9AF; --tech:#0EA5C6; --nature:#2F9E57; --fly:#B98A12; --perform:#C026D3; --sun:#F29A14; --leaf:#12A27A; --coral:#E5484D;
}
a{color:var(--blue)}

function sessionToken(){
  try {
    const raw = document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('arise_session='));
    if (!raw) return null;
    const bin = atob(raw.slice('arise_session='.length));
    let data; try { data = JSON.parse(decodeURIComponent(escape(bin))); } catch { data = JSON.parse(bin); }
    return data && data.token ? String(data.token) : null;
  } catch { return null; }
}
class ApiError extends Error { constructor(msg, code, body){ super(msg); this.code = code; this.body = body; } }
async function api(path, opts = {}){
  const headers = { 'Content-Type':'application/json' };
  const t = sessionToken(); if (t) headers.Authorization = `Bearer ${t}`;
  let res;
  try { res = await fetch('/api/social' + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store' }); }
  catch { throw new ApiError('Can’t reach A.R.I.S.E. Connect. Check your connection and try again.', 0); }
  let body = null; try { body = await res.json(); } catch {}
  if (!res.ok) throw new ApiError(body?.message || 'Something went wrong. Please try again.', res.status, body);
  return body;
}
async function apiAt(fullPath, opts = {}){
  const headers = { 'Content-Type':'application/json' };
  const t = sessionToken(); if (t) headers.Authorization = `Bearer ${t}`;
  let res;
  try { res = await fetch(fullPath, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache:'no-store' }); }
  catch { throw new ApiError('Can’t reach A.R.I.S.E. Connect. Check your connection and try again.', 0); }
  let body = null; try { body = await res.json(); } catch {}
  if (!res.ok) throw new ApiError(body?.message || 'Something went wrong. Please try again.', res.status, body);
  return body;
}

function postHTML(p){
  const staff = p.authorRole==='teacher'||p.authorRole==='admin';
  let attach = '';
  if (p.course) { const c = course(p.course.id); attach = `<div class="attach" style="--fc:${fieldColor(p.course.field)}"><div class="attach-art">${SEAL}<span>${esc(CAT.courseFields[p.course.field]||'')}</span></div><div class="attach-body"><div class="eyebrow">Certificate · A.R.I.S.E. Connect</div><b>${esc(p.course.title)}</b><span class="sub">${esc(p.course.code)}${c?` · ${c.lessons.length} lessons · ${c.minutes} min`:''}</span></div>${c?`<button class="btn ghost small" data-act="course" data-id="${c.id}">View course</button>`:''}</div>`; }
  else if (p.quest) attach = `<div class="attach" style="--fc:${clusterColor(p.quest.c)}"><div class="attach-art">${tile('quest',clusterColor(p.quest.c))}<span>Quest</span></div><div class="attach-body"><div class="eyebrow">Quest cleared</div><b>${esc(p.quest.title)}</b><span class="sub">${esc(CAT.clusters[p.quest.c]?.name||'')}</span></div></div>`;
  else if (p.career) attach = `<div class="attach" style="--fc:${clusterColor(p.career.c)}"><div class="attach-art">${tile(p.career.c,clusterColor(p.career.c))}<span>Career</span></div><div class="attach-body"><div class="eyebrow">Career</div><b>${esc(p.career.name)}</b><span class="sub">${esc(CAT.clusters[p.career.c]?.name||'')}</span></div><button class="btn ghost small" data-act="open" data-id="${p.career.id}">Open</button></div>`;
  const total = RX.reduce((t,[k])=>t+(p.reactions[k]||0),0);
  const del = p.canDelete ? `<button class="icon-btn" data-act="delpost" data-id="${p.id}" aria-label="Delete post" title="Delete post">${S.confirmDelete===p.id?'<span class="small">Tap again</span>':svg('trash')}</button>` : '';
  let foot;
  if (p.status==='pending') foot = `<div class="pendbar">${svg('info')}Only you can see this until your teacher approves it.</div>`;
  else if (p.status==='rejected') foot = `<div class="pendbar back">${svg('info')}Your teacher sent this back. You can delete it and try again.</div>`;
  else foot = `<div class="post-stats"><span>${total?`<span class="cheer-dot">${svg('fist')}</span> ${total}`:'Be the first to react'}</span><span>${p.scope==='school'?'Whole school':'Class'}</span></div>
    ${role()==='parent'?'':`<div class="post-actions">${RX.map(([k,l,i])=>`<button data-act="react" data-id="${p.id}" data-v="${k}" aria-pressed="${p.myReaction===k}">${svg(i)}<span>${l}</span></button>`).join('')}</div>`}`;
  return `<article class="box post ${p.status==='pending'?'pending':''}">
    <header class="post-head">${av(p.author,'m',p.mine)}<div class="who"><b class="name">${esc(p.author)}${staff?'<span class="role">Teacher</span>':''}</b><span class="sub">${staff?'Teacher':'Student'} · ${p.scope==='school'?'Whole school':'Class'}</span><span class="sub">${ago(p.createdAt)} · ${svg('shield')} Class space</span></div>${del}</header>
    ${p.body?`<p class="post-text">${esc(p.body)}</p>`:''}${attach}${foot}</article>`;
}
function composer(){
  const u = ME.user;
  if (!u.canPost) return `<div class="notice">${svg('info')}<div><b>${esc(u.postBlock||'Posting isn’t open yet.')}</b><br><span class="sub">You can still take courses, explore careers and do quests.</span></div></div>`;
  const yb = role()==='student' && young(u.band);
  if (!S.composeOpen) return `<div class="box composer"><div class="composer-row">${av(u.name,'m',true)}<button class="pillinput" data-act="compose">${yb?'Share something with your class':role()==='student'?'Share what you learned, a project, or a certificate…':'Share something with your class'}</button></div>
    ${role()==='student'?`<div class="composer-opts"><button data-act="compose">${svg('quest')}Quest win</button><button data-act="tab" data-v="stars">${svg('learn')}Certificate</button><button data-act="tab" data-v="explore">${svg('explore')}Career</button></div>`:''}</div>`;
  if (yb) return `<div class="box composer"><div class="composer-row">${av(u.name,'m',true)}<b>Share with your class</b></div>
      <div class="two"><label class="field"><span>Pick a sentence</span><select id="cStart" class="select">${CAT.starters.map((s,i)=>`<option value="${i}">${esc(s)}…</option>`).join('')}</select></label>
      <label class="field"><span>Pick a job</span><select id="cCareer" class="select">${CAT.careers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label></div>
      <div class="composer-tools"><span class="sub">${svg('shield')} ${esc(u.teacherName||'Your teacher')} checks posts first</span><button class="btn ghost small" data-act="compose">Cancel</button><button class="btn small" data-act="post">Post</button></div></div>`;
  const done = role()==='student' ? CAT.quests[u.band].filter(q=>P().quests[q.id]==='done') : [];
  const certs = role()==='student' ? (P().certificates||[]) : [];
  return `<div class="box composer"><div class="composer-row">${av(u.name,'m',true)}<textarea id="cText" rows="3" maxlength="${CAT.limits.postLength}" placeholder="${role()==='student'?'What did you try? What surprised you?':'Share news, a career fact, or a shout-out'}"></textarea></div>
    ${role()==='student'?`<div class="two"><label class="field"><span>Attach a certificate</span><select id="cCourse" class="select"><option value="">${certs.length?'None':'Earn a certificate to share it'}</option>${certs.map(x=>`<option value="${x.id}">${esc(course(x.id)?.title||x.id)}</option>`).join('')}</select></label>
      <label class="field"><span>Attach a finished quest</span><select id="cQuest" class="select"><option value="">None</option>${done.map(q=>`<option value="${q.id}">${esc(q.title)}</option>`).join('')}</select></label></div>`:''}
    <div class="composer-tools"><span class="sub">${svg('shield')} ${role()==='student'?'Your teacher approves posts first · first name and last initial only':'Teacher posts go live right away'}</span><button class="btn ghost small" data-act="compose">Cancel</button><button class="btn small" data-act="post">Post</button></div></div>`;
}
function viewFeed(){
  const posts = S.feed;
  const emptyMsg = role()==='student' ? (ME.user.canPost ? 'Nothing here yet. Finish a course or a quest and be the first to share it.' : 'Your class feed shows up here once you’re in a class.') : 'No posts yet. Say hello to your class.';
  return `<div class="layout3"><aside class="rail-l">${leftHTML()}</aside>
    <section class="feed">${composer()}${posts===null?'<div class="skeleton"></div><div class="skeleton"></div>': posts.length? posts.map(postHTML).join('') : `<div class="box empty">${emptyMsg}</div>`}</section>
    <aside class="rail-r">${railHTML()}</aside></div>`;
}

/* ================= EXPLORE ================= */
function careerCard(c){
  const collected = role()==='student' && P() && P().collected.includes(c.id);
  return `<button class="card" data-act="open" data-id="${c.id}" style="--fc:${clusterColor(c.c)}">
    ${collected?`<span class="badge-match">${svg('check')} Collected</span>`:''}
    <div class="banner">${tile(c.c,clusterColor(c.c))}<div><div class="eyebrow">${esc(CAT.clusters[c.c].name)}</div></div></div>
    <div class="body"><h3>${esc(c.name)}</h3><p class="blurb">${esc(young(bandNow())?c.kid:(c.teen.match(/^[^.]*\./)||[c.teen])[0])}</p>
    <div class="tags">${c.paths.slice(0,3).map(p=>`<span class="tag">${esc(p)}</span>`).join('')}</div></div></button>`;
}
function viewExplore(){
  const pathsAll = ['Apprenticeship','Trade school','Military','2-year','4-year','Certificate','On the job'];
  const q = S.q.trim().toLowerCase();
  const list = CAT.careers.filter(c => (S.filterC==='all'||c.c===S.filterC) && (S.filterP==='all'||c.paths.includes(S.filterP)) && (!q || (c.name+' '+CAT.clusters[c.c].name).toLowerCase().includes(q)));
  const p = P(); const spun = role()==='student' && p.spun && p.spun.day===ME.today ? C(p.spun.career) : null;
  const spin = role()==='student' ? `<div class="box pad spin"><div><div class="eyebrow">Career of the day</div><div class="spin-window" id="spinWin">${spun?esc(spun.name):'Spin to find today’s career'}</div>
      <p class="sub">${spun?'Open it, read up, and add it to your collection. New spin tomorrow.':`+${CAT.xp.spin} XP for your first spin each day.`}</p></div>
      <button class="btn" data-act="${spun?'open':'spin'}" ${spun?`data-id="${spun.id}"`:''}>${spun?'Open':'Spin'}</button></div>` : '';
  return `<div class="page">${spin}
    <div class="cat-head"><div><h1 class="page-h">Every path counts</h1><p class="sub">${CAT.careers.length} careers. College is one path; here are the rest too.${q?` Showing results for “${esc(S.q)}”.`:''}</p></div></div>
    <div class="filters"><div class="seg"><button data-act="fc" data-v="all" aria-pressed="${S.filterC==='all'}">All areas</button>${Object.entries(CAT.clusters).map(([k,v])=>`<button data-act="fc" data-v="${k}" aria-pressed="${S.filterC===k}">${esc(v.name)}</button>`).join('')}</div></div>
    ${young(bandNow())?'':`<div class="interest-row"><span class="sub">How you get there:</span><button class="chip" data-act="fp" data-v="all" aria-pressed="${S.filterP==='all'}">Any</button>${pathsAll.map(x=>`<button class="chip" data-act="fp" data-v="${x}" aria-pressed="${S.filterP===x}">${x}</button>`).join('')}</div>`}
    <div class="grid">${list.map(careerCard).join('') || '<div class="empty" style="grid-column:1/-1">No careers match. Try “All areas” or “Any”.</div>'}</div></div>`;
}

    : student ? `${got?`<span class="chip on">${svg('check')}In your collection</span>`:`<button class="btn" data-act="collect" data-id="${id}">${svg('plus')}Add to collection · +${CAT.xp.collect} XP</button>`}
      <button class="btn ghost" data-act="save" data-id="${id}">${svg('heart')}${saved?'Saved':'Save'}</button>` : '';
  return `<div class="overlay" data-act="close"><div class="modal light career" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop style="--fc:${clusterColor(c.c)}">

    <div class="m-top">${tile(c.c,clusterColor(c.c),'lg')}<h2 id="mt">${esc(c.name)}</h2><span class="sub">${esc(cl.name)}${yb||!c.soc?'':` · SOC ${esc(c.soc)}`}</span></div>
    <div class="m-body">
      ${actions?`<div class="modal-actions start">${actions}</div>`:''}
      <p>${esc(yb?c.kid:c.teen)}</p>
      ${starsFor(id).length?`<div class="career-vid"><h3 class="rail-h">Watch the pros</h3><div class="stars-grid one">${starsFor(id).map(v=>starCardHTML(v,'career',{noCareer:true})).join('')}</div></div>`:''}
      <div class="facts"><div class="fact"><span>Training</span><b>${esc(c.train)}</b></div>${yb?'':`<div class="fact"><span>Typical pay</span><b>${c.pay?`About $${c.pay}k a year`:'Varies a lot'}</b></div>`}<div class="fact"><span>Ways in</span><b>${esc(c.paths.join(' · '))}</b></div></div>
      <div><h3 class="rail-h">Tools you’d use</h3><div class="tags" style="margin-top:8px">${c.tools.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div>
      <div><h3 class="rail-h">Start now</h3><div class="startnow">${order.map(([k,l])=>`<div class="${k===band&&ME?'me':''}"><b>${l}</b><span>${esc(cl.start[k])}</span></div>`).join('')}</div></div>
      ${yb?'':`<p class="sub small">Pay is an approximate U.S. median from the Bureau of Labor Statistics (May 2024). It varies by state and experience.</p>`}
    </div></div></div>`;
}

/* ================= QUESTS ================= */
function viewQuests(){
  const qs = CAT.quests[ME.user.band], p = P();
  const doneN = qs.filter(q=>p.quests[q.id]==='done').length;
  return `<div class="page"><div class="cat-head"><div><h1 class="page-h">Your quests</h1><p class="sub">Real things you do off the screen. Check off the steps, then share it with your class.</p></div><span class="tag">${doneN} of ${qs.length} done</span></div>
  <div class="grid wide">${qs.map(q=>{
    const st = p.quests[q.id]; const done = st==='done'; const steps = Array.isArray(st) ? st : q.steps.map(()=>false);
    const all = done || steps.every(Boolean);
    return `<div class="box pad quest" style="--fc:${clusterColor(q.c)}">
      <div class="suggest">${tile(q.c,clusterColor(q.c),'sm')}<div class="who"><b>${esc(q.title)}</b><span class="sub">${esc(CAT.clusters[q.c].name)}</span></div><span class="xp">+${q.xp} XP</span></div>
      <div class="steps">${q.steps.map((s,i)=>{const on=done||!!steps[i]; return `<button class="step" data-act="step" data-id="${q.id}" data-i="${i}" aria-pressed="${on}" ${done?'disabled':''}><span class="box-check">${on?svg('check'):''}</span><span>${esc(s)}</span></button>`}).join('')}</div>
      <div class="row">${done?`<span class="chip on">${svg('check')}Complete</span>${young(ME.user.band)||!ME.user.canPost?'':`<button class="btn ghost small" data-act="sharequest" data-id="${q.id}">Share it</button>`}`
        : `${q.reader?`<a class="btn ghost small" href="/library">${svg('book')}Open Reader</a>`:''}<button class="btn small" data-act="complete" data-id="${q.id}" ${all?'':'disabled'}>Complete quest</button>`}</div>
    </div>`}).join('')}</div></div>`;
}

const FORMATS = ['In class','Live video','Field trip','After school','Families · In person'];
function eventRow(e, action){
  const d = fmtDate(e.date);
  return `<div class="event"><div class="date"><div class="m">${d.m}</div><div class="d">${d.d}</div><div class="w">${d.w}</div></div>
    <div class="who"><b>${esc(e.title)}</b>${e.host?`<span class="sub">${esc(e.host)} · Teacher</span>`:''}
    <div class="tags" style="margin-top:8px">${e.time?`<span class="tag">${esc(e.time)}</span>`:''}${e.format?`<span class="tag">${esc(e.format)}</span>`:''}${CAT.clusters[e.cluster]?`<span class="tag">${esc(CAT.clusters[e.cluster].name)}</span>`:''}<span class="tag">${e.scope==='school'?'Whole school':'Class'}</span></div>
    <div class="row" style="margin-top:10px">${action}<span class="sub">${e.going} of ${e.seats} spots taken</span></div></div></div>`;
}
function viewEvents(){
  const r = role(); const evs = S.events;
  const host = r==='teacher' ? `<div class="box pad stack"><h2 class="sec-h">Host an event</h2>
    <div class="formgrid">
      <label class="field"><span>Title</span><input type="text" id="evT" maxlength="${CAT.limits.eventTitle}" placeholder="Shadow a Welder Day"></label>
      <label class="field"><span>Date</span><input type="date" id="evD" min="${ME.today}" value="${ME.today}"></label>
      <label class="field"><span>Time</span><input type="text" id="evTime" maxlength="20" placeholder="10:00 AM"></label>
      <label class="field"><span>Career area</span><select id="evC">${Object.entries(CAT.clusters).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Format</span><select id="evF">${FORMATS.map(f=>`<option>${f}</option>`).join('')}</select></label>
      <label class="field"><span>Spots</span><input type="text" id="evS" inputmode="numeric" value="30"></label>
      <label class="field"><span>For</span><select id="evScope"><option value="class">My class</option><option value="school">My whole school</option></select></label>
    </div><div class="row end"><button class="btn" data-act="host">${svg('plus')}Publish event</button></div></div>` : '';
  let list;
  if (evs===null) list = '<div class="skeleton"></div>';
  else if (!evs.length) list = `<p class="sub">${r==='teacher'?'No upcoming events yet. Host one above.':'No upcoming events yet. Your teacher will post them here.'}</p>`;
  else list = evs.map(e=>{
    let action = '';
    if (r==='student'){
      const yb = young(ME.user.band), st = e.myStatus, full = e.going>=e.seats && st!=='going';
      if (st==='going') action = `<button class="btn ok small" data-act="rsvp" data-id="${e.id}" data-v="leave">${svg('check')}Going</button>`;
      else if (st==='requested') action = `<span class="chip wait">Waiting for your grown-up</span>`;
      else action = `<button class="btn ghost small" data-act="rsvp" data-id="${e.id}" data-v="join" ${full?'disabled':''}>${full?'Full':yb?'Ask my grown-up':'Attend'}</button>`;
    } else if (e.mine || r==='admin') action = `<button class="btn ghost small" data-act="delevent" data-id="${e.id}">${S.confirmDelete===e.id?'Tap again to cancel event':'Cancel event'}</button>`;
    return eventRow(e, action);
  }).join('');
  return `<div class="layout2 rev"><section class="stack">${host}<div class="box pad"><div class="box-head flat"><div><h2 class="sec-h">Upcoming events</h2><p class="sub">Hosted by verified teachers for their class or school.</p></div></div>${list}</div></section><aside class="rail-r">${railHTML()}</aside></div>`;
}

/* ================= PROFILE ================= */
function viewProfile(){
  const u = ME.user, p = P(), yb = young(u.band);
  const done = CAT.quests[u.band].filter(q=>p.quests[q.id]==='done');
  const tops = topClusters(p,2);
  const certs = p.certificates||[];
  const skills = [...new Set(certs.flatMap(x=>CAT.courseSkills[x.id]||[]))];

  return `<div class="layout2 rev"><section class="stack">
    <div class="box profile-top"><div class="p-banner me"></div><div class="p-main">${av(u.name,'xl',true)}

        <p class="sub">${esc(CAT.bands[u.band].crew)} · Level ${p.level+1} ${esc(p.levelName)} · ${p.xp} XP · ${p.streak}-day streak</p>

      ${yb?'':`<div class="open-to"><b>Open to</b><span>${tops.length?`Job shadows and summer programs in ${esc(tops.join(' and '))}`:'Job shadows, summer programs and club invites'}</span></div>`}</div>
    <div class="box pad"><div class="box-head flat"><h2 class="sec-h">Licenses &amp; certifications</h2><button class="icon-btn" data-act="tab" data-v="stars" aria-label="Earn a certificate">${svg('plus')}</button></div>
      ${certs.length?`<ul class="cert-rows">${certs.map(x=>{const c=course(x.id); if(!c) return ''; return `<li>${tile(c.icon,fieldColor(c.field))}<div><b>${esc(c.title)}</b><span class="sub">A.R.I.S.E. Connect · ${esc(CAT.courseFields[c.field])}</span><span class="sub small">Issued ${esc(longDate(x.date))} · Credential ID <span class="mono">${esc(x.code)}</span></span><button class="btn ghost small" data-act="credential" data-id="${c.id}">Show credential</button></div></li>`}).join('')}</ul>`:'<p class="sub">Finish a course in Learning to earn your first certificate.</p>'}</div>
    ${skills.length?`<div class="box pad"><h2 class="sec-h">Skills</h2><ul class="skills">${skills.map(k=>`<li><div><b>${esc(k)}</b><span class="sub small">From A.R.I.S.E. Connect courses</span></div></li>`).join('')}</ul></div>`:''}
    <div class="box pad"><h2 class="sec-h">Quests completed</h2>${done.length?`<ul class="clubs">${done.map(q=>`<li>${tile(q.c,clusterColor(q.c),'sm')}<div><b>${esc(q.title)}</b><span class="sub">${esc(CAT.clusters[q.c].name)} · +${q.xp} XP</span></div></li>`).join('')}</ul>`:`<p class="sub">No quests finished yet. <a href="#" data-act="tab" data-v="quests">Start one</a>.</p>`}</div>
    <div class="box pad"><div class="box-head flat"><h2 class="sec-h">Careers explored</h2><span class="sub">${p.collected.length} of ${CAT.careers.length}</span></div>
      <div class="stamps">${CAT.careers.map(c=>{const got=p.collected.includes(c.id);return `<button class="stamp ${got?'got':''}" data-act="open" data-id="${c.id}">${tile(got?c.c:'lock',got?clusterColor(c.c):'var(--line-2)','sm')}<span>${esc(c.name)}</span></button>`}).join('')}</div></div>
    <div class="two">
      <div class="box pad"><h2 class="sec-h">Interests</h2><div class="cbars">${byC.slice(0,5).map(x=>`<div class="cbar"><span>${esc(CAT.clusters[x.k].name)}</span><span class="bar"><i style="width:${x.n/max*100}%;background:${clusterColor(x.k)}"></i></span><span class="tnum">${x.n}</span></div>`).join('')}</div></div>
      <div class="box pad"><h2 class="sec-h">Badges</h2><div class="tags">${Object.entries(BADGE_NAMES).map(([id,n])=>{const on=p.badges.includes(id);return `<span class="badge ${on?'':'locked'}">${svg(on?'star':'lock')}${n}</span>`}).join('')}</div></div>
    </div>
    <div class="box pad"><h2 class="sec-h">Education</h2><ul class="clubs"><li><span class="club-ico school">${esc((u.teacherName||'C')[0])}</span><div><b>${u.teacherName?`${esc(u.teacherName)}’s class`:'Your class'}</b><span class="sub">${u.grade?`Grade ${esc(u.grade)}`:'Student'}</span></div></li></ul></div>
  </section><aside class="rail-r">${railHTML()}</aside></div>`;
}

/* ================= PATHS ================= */
function viewPaths(){
  const student = role()==='student';
  const grade = student ? parseInt(String(ME.user.grade||'').replace(/\D/g,''),10) : (currentChild() ? parseInt(String(currentChild().grade||'').replace(/\D/g,''),10) : NaN);
  const rows = [
    ['4-year college','4 years','~$11.6k/yr tuition (public, in-state)','Some, through work-study','Teacher, engineer, nurse (BSN)'],
    ['Community college','2 years','~$4k/yr tuition','Often, part-time','Nurse (ADN), dental hygienist, vet tech'],

function kick(t){ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+.15); g.gain.setValueAtTime(.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.31); }
function noise(t,freq,len,vol){ const s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=NOISE; f.type='highpass'; f.frequency.value=freq; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+len); s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t+len+.01); }
function beatTick(){ stepNow=(stepNow+1)%16; const t=AC.currentTime+.02; if(BEAT.kick[stepNow]) kick(t); if(BEAT.snare[stepNow]) noise(t,1400,.18,.5); if(BEAT.hat[stepNow]) noise(t,7000,.05,.22); document.querySelectorAll('.beat td').forEach(td=>td.classList.toggle('now', +td.dataset.col===stepNow)); }
function startBeat(){ if(!audio()) return; stopBeat(); stepNow=-1; beatTimer=setInterval(beatTick, 60000/BPM/4); const b=document.getElementById('beat-play'); if(b) b.textContent='■ Stop'; }
function stopBeat(){ if(beatTimer){ clearInterval(beatTimer); beatTimer=null; } document.querySelectorAll('.beat td.now').forEach(td=>td.classList.remove('now')); const b=document.getElementById('beat-play'); if(b) b.textContent='▶ Play'; }

/* certificate pop-ups */
let htmlModal = null;
function openHTML(html, cls){ htmlModal = html; modalId = null; document.getElementById('modalRoot').innerHTML = `<div class="overlay" data-act="close"><div class="modal ${cls||''}" role="dialog" aria-modal="true" aria-labelledby="mt" data-stop>${html}</div></div>`; document.querySelector('.modal button')?.focus(); }
function credentialModal(id, fresh){
  const c = course(id), cert = certOf(id);
  const share = ME.user.canPost ? `<button class="btn goldbtn" data-act="sharecert" data-id="${id}">${svg('users')} Share with my class</button>` : '';
  if (fresh) { openHTML(`<div class="eyebrow">Course complete</div><h2 id="mt">You earned a certificate!</h2>${certificateHTML(c, cert, ME.user.name, true)}
      <span class="pill teal">+${CAT.xp.course} XP · added to your profile</span>
      <div class="modal-actions">${share}<button class="btn ghost" data-act="tab" data-v="profile">View my profile</button></div>
      ${ME.user.canPost?`<p class="sub" style="color:#AAB3CB">${esc(ME.user.teacherName||'Your teacher')} checks posts before your class sees them.</p>`:''}`, ''); burst(); return; }
  openHTML(`<div class="eyebrow">Credential</div><h2 id="mt">${esc(c.title)}</h2>${certificateHTML(c, cert, ME.user.name, true)}
    <p class="sub">Credential ID <b class="ink mono">${esc(cert.code)}</b>. Show it to a teacher, counselor or program.</p>
    <div class="modal-actions">${share}<button class="btn ghost" data-act="close">Close</button></div>`, 'light');
}

/* ================= RENDER ================= */
const VIEWS = { stars:viewStars, learn:viewStars, feed:viewFeed, explore:viewExplore, quests:viewQuests, events:viewEvents, profile:viewProfile, paths:viewPaths, family:viewFamily, approvals:viewApprovals, class:viewClass };
function render(){
  renderChrome();
  const root = document.getElementById('root');
  if (!CAT) { root.innerHTML = `<div class="center-page"><div class="skeleton"></div></div>`; return; }
  if (!ME) { root.innerHTML = landingHTML(); return; }
  if (role()==='student' && ME.approvalStatus!=='approved') { root.innerHTML = connectLockHTML(); return; }
  if (!ME.access && role()!=='teacher') { root.innerHTML = joinHTML(); return; }
  if (!ME.access && role()==='teacher') { root.innerHTML = viewApprovals(); return; }
  root.innerHTML = (VIEWS[S.tab]||viewFeed)();
  afterMain();
}
function renderMain(){ if (!ME || !CAT || (role()==='student' && ME.approvalStatus!=='approved') || !ME.access) return render(); document.getElementById('root').innerHTML = (VIEWS[S.tab]||viewFeed)(); afterMain(); }
function afterMain(){ if (!document.querySelector('.beat')) stopBeat(); wireActivity(); }
let modalId = null;
function openModal(id){ modalId=id; htmlModal=null; document.getElementById('modalRoot').innerHTML = careerModal(id); document.querySelector('.modal .x')?.focus(); }
function closeModal(){ modalId=null; htmlModal=null; document.getElementById('modalRoot').innerHTML=''; }
function refreshModal(){ if(modalId) document.getElementById('modalRoot').innerHTML = careerModal(modalId); }
function centerMessage(title, body, action){ renderChrome(); document.getElementById('root').innerHTML = `<div class="center-page"><div class="box pad stack center"><h2>${esc(title)}</h2><p class="sub">${esc(body)}</p>${action||''}</div></div>`; }

/* ================= DATA LOADING ================= */
async function load(what){
  try {
    if (what==='feed') { S.feed = (await api('/feed')).posts; }
    if (what==='approvals') { S.approvals = (await api('/approvals')).posts; }
    if (what==='accessRequests') { S.accessRequests = (await api('/access/requests')).requests; }
    if (what==='events') { S.events = (await api('/events')).events; }
    if (what==='children') { S.children = (await api('/children')).children; if (!S.childId && S.children[0]) S.childId = S.children[0].id; }
    if (what==='class') { S.classInfo = await api('/class'); }
  } catch (e) { if (e.code===401) return signedOut(); if (e.code===402) { ME.access = false; await loadPlan(); return render(); } if (e.body?.code==='connect_teacher_approval_required') { ME.approvalStatus = e.body.approvalStatus; return render(); } fail(e); }
  render();
}
async function loadPlan(){ try { PLAN = await apiAt('/api/addons'); } catch { PLAN = null; } }
function loadForRole(){
  const r = role();
  if (r==='student' && ME.approvalStatus!=='approved') return;
  if (r==='teacher') load('accessRequests');
  if (!ME.access) return;
  if (r==='parent') return load('children');
  load('feed'); load('events');
  if (r==='teacher' || r==='admin') load('approvals');
  if (r==='teacher') load('class');
}
function signedOut(){ ME = null; render(); }
function setProfile(p){ if (ME && p) ME.profile = p; }

/* ================= ACTIONS ================= */
document.getElementById('q').addEventListener('input', e=>{ S.q = e.target.value; if (S.tab==='stars') return renderMain(); if (S.tab!=='explore'){ S.tab='explore'; render(); const q=document.getElementById('q'); q.focus(); } else renderMain(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(modalId||htmlModal) closeModal(); if(S.menu){ S.menu=false; renderChrome(); } } });

document.addEventListener('click', async e=>{
  const el = e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('.menu') && !(el && el.dataset.act==='menu')) { S.menu=false; renderChrome(); }
  if (!el) return;
  if (el.dataset.act==='close' && e.target.closest('[data-stop]') && !e.target.closest('.x')) return;
  if (el.tagName==='A' && el.dataset.act) e.preventDefault();
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  if (a!=='delpost' && a!=='delevent') S.confirmDelete = null;
  try {
    switch(a){
      case 'join': goSignIn('/register'); break;
      case 'signin': goSignIn('/'); break;
      case 'go': goSignIn(v); break;
      case 'menu': S.menu = !S.menu; renderChrome(); break;
      case 'buy': el.disabled = true; await buySocial(id ? Number(id) : null).finally(()=>{ el.disabled = false; }); break;
      case 'manage': await manageSocial(id ? Number(id) : null); break;
      case 'tab': if (v==='stars' && S.tab!=='stars') { S.course=null; S.lesson=null; } S.tab=v; S.menu=false; closeModal(); render(); window.scrollTo(0,0); if (v==='class') load('class'); if (v==='approvals') { if (role()==='teacher') load('accessRequests'); if (ME.access) load('approvals'); } break;
       case 'request-access': { el.disabled = true; const r = await api('/access/request',{method:'POST'}).finally(()=>{el.disabled=false;}); ME.approvalStatus = r.approvalStatus; toast('Request sent to your teacher'); render(); break; }
       case 'review-access': { el.disabled = true; await api(`/access/requests/${encodeURIComponent(id)}/review`,{method:'POST',body:{decision:v}}); S.accessRequests = (S.accessRequests||[]).filter(p=>String(p.id)!==String(id)); toast(v==='approve'?'Student approved for Connect':'Request denied'); render(); break; }
      case 'fc': S.filterC=v; renderMain(); break;
      case 'learnhome': S.course=null; S.lesson=null; renderMain(); window.scrollTo(0,0); break;
      case 'lfield': S.lfield=v; renderMain(); break;
      case 'interest': S.interests.has(v)?S.interests.delete(v):S.interests.add(v); { const y=window.scrollY; renderMain(); window.scrollTo(0,y); } break;
      case 'lpath': S.lpath=v||null; renderMain(); break;
      case 'course': closeModal(); S.tab='stars'; S.course=id; S.lesson=null; render(); window.scrollTo(0,0); break;
      case 'lesson': S.lesson=Number(v); S.answers={}; renderMain(); window.scrollTo(0,0); break;
      case 'answer': { const c=course(S.course), q=c.lessons[S.lesson].quiz[Number(el.dataset.q)], qi=Number(el.dataset.q), oi=Number(el.dataset.o); const a=S.answers[qi]||{tried:[],right:false}; a.tried.push(oi); if(oi===q.a) a.right=true; S.answers[qi]=a; const y=window.scrollY; renderMain(); window.scrollTo(0,y); break; }
      case 'finishlesson': {
        const c=course(S.course), i=S.lesson, quiz=c.lessons[i].quiz;
        el.disabled = true;
        const r = await api(`/courses/${encodeURIComponent(c.id)}/lessons/${i}`,{method:'POST',body:{answers: quiz.map((q,qi)=>S.answers[qi]&&S.answers[qi].right?q.a:-1)}}).finally(()=>{ el.disabled=false; });
        setProfile(r.profile); S.answers={};
        if (r.certificate && r.gained) { S.lesson=null; render(); credentialModal(c.id, true); break; }
        const next = myCourse(c.id).lessons.findIndex(x=>!x);
        toast('Lesson passed');
        S.lesson = next>=0 ? next : null; render(); window.scrollTo(0,0); break;
      }
      case 'credential': credentialModal(id, false); break;
      case 'sharecert': { el.disabled=true; const r = await api('/posts',{method:'POST',body:{courseId:id, text:`I just earned my ${course(id).title} certificate on A.R.I.S.E. Connect!`}}).finally(()=>{ el.disabled=false; }); closeModal(); S.feed=[r.post, ...(S.feed||[])]; S.tab='feed'; toast(r.post.status==='pending'?'Sent to your teacher for a quick check':'Posted'); render(); window.scrollTo(0,0); break; }
      case 'beatcell': { BEAT[v][Number(el.dataset.i)] = !BEAT[v][Number(el.dataset.i)]; el.setAttribute('aria-pressed', BEAT[v][Number(el.dataset.i)]); break; }
      case 'beatplay': beatTimer ? stopBeat() : startBeat(); break;
      case 'beatclear': Object.keys(BEAT).forEach(k=>BEAT[k].fill(false)); document.querySelectorAll('[data-act="beatcell"]').forEach(b=>b.setAttribute('aria-pressed','false')); break;
      case 'fp': S.filterP=v; renderMain(); break;
      case 'open': openModal(id); break;
      case 'playvid': {
        const box = el.closest('.vid'); const v = { id, title: el.getAttribute('aria-label').replace(/^Play video: /,'') }; if (!box || !okVid(v)) break; PLAYING.add(el.dataset.v); box.innerHTML = vidFrame(v);
        // Watching a career star video counts once for XP.
        if (role()==='student' && ME?.access && (STARS||[]).some(x=>x.id===id) && !(P()?.watched||[]).includes(id)) {
          try { const r = await api('/watch',{method:'POST',body:{videoId:id}}); setProfile(r.profile); if (r.gained) toast(`+${r.gained} XP · Learned from ${(STARS.find(x=>x.id===id)||{}).star||'a star'}`); } catch {}
        }
        break;
      }
      case 'sfield': S.sfield=v; renderMain(); break;
      case 'starjump': { S.tab='stars'; S.sfield='all'; render(); document.getElementById('stars-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}); break; }
      case 'close': closeModal(); break;
      case 'child': S.childId = Number(id); render(); break;
      case 'compose': S.composeOpen=!S.composeOpen; renderMain(); if(S.composeOpen) (document.getElementById('cText')||document.getElementById('cStart'))?.focus(); break;
      case 'collect': { el.disabled = true; const r = await api('/collect',{method:'POST',body:{careerId:id}}); setProfile(r.profile); if (r.gained){ toast(`+${r.gained} XP · Added to your collection`); burst(); } refreshModal(); render(); break; }
      case 'save': { const r = await api('/save',{method:'POST',body:{careerId:id}}); setProfile(r.profile); toast(r.profile.saved.includes(id)?'Saved':'Removed from saved'); refreshModal(); render(); break; }
      case 'spin': await spin(); break;
      case 'step': { const r = await api(`/quests/${encodeURIComponent(id)}/step`,{method:'POST',body:{step:Number(el.dataset.i)}}); setProfile(r.profile); renderMain(); break; }
      case 'complete': { el.disabled = true; const r = await api(`/quests/${encodeURIComponent(id)}/complete`,{method:'POST'}); setProfile(r.profile); if (r.gained){ toast(`+${r.gained} XP · Quest complete`); burst(); } render(); break; }
      case 'road': { const r = await api('/roadmap',{method:'POST',body:{key:v}}); setProfile(r.profile); renderMain(); break; }
      case 'post': {
        const body = {};
        if (role()==='student' && young(ME.user.band)) { body.starter = Number(document.getElementById('cStart').value); body.careerId = document.getElementById('cCareer').value; }
        else { body.text = document.getElementById('cText').value; const q = document.getElementById('cQuest'); if (q && q.value) body.questId = q.value; const cs = document.getElementById('cCourse'); if (cs && cs.value) body.courseId = cs.value; const sc = document.getElementById('cScope'); if (sc) body.scope = sc.value; }
        el.disabled = true;
        const r = await api('/posts',{method:'POST',body}).finally(()=>{ el.disabled=false; });
        S.composeOpen = false; S.feed = [r.post, ...(S.feed||[])];
        toast(r.post.status==='pending' ? 'Sent to your teacher for a quick check' : 'Posted');
        renderMain(); break;
      }
      case 'sharequest': { const r = await api('/posts',{method:'POST',body:{questId:id}}); S.feed = [r.post, ...(S.feed||[])]; toast('Sent to your teacher for a quick check'); S.tab='feed'; render(); window.scrollTo(0,0); break; }
      case 'delpost': {
        if (S.confirmDelete!==id){ S.confirmDelete=id; renderMain(); break; }
        await api(`/posts/${id}`,{method:'DELETE'}); S.confirmDelete=null;
        S.feed = (S.feed||[]).filter(p=>p.id!==id); toast('Post deleted'); renderMain(); break;
      }
      case 'react': {
        const p = (S.feed||[]).find(x=>x.id===id); if (!p) break;
        const r = await api(`/posts/${id}/react`,{method:'POST',body:{kind: p.myReaction===v ? null : v}});
        S.feed = S.feed.map(x=>x.id===id ? r.post : x); renderMain(); break;
      }
      case 'review': {
        await api(`/posts/${id}/review`,{method:'POST',body:{decision:v}});
        S.approvals = (S.approvals||[]).filter(p=>p.id!==id);
        toast(v==='approve'?'Approved. It’s live for the class.':'Sent back');
        render(); if (v==='approve') load('feed'); if (S.classInfo) load('class'); break;
      }
      case 'host': {
        const body = { title:document.getElementById('evT').value, date:document.getElementById('evD').value, time:document.getElementById('evTime').value, cluster:document.getElementById('evC').value, format:document.getElementById('evF').value, seats:Number(document.getElementById('evS').value)||30, scope:document.getElementById('evScope').value };
        el.disabled = true;
        const r = await api('/events',{method:'POST',body}).finally(()=>{ el.disabled=false; });
        S.events = [...(S.events||[]), r.event].sort((x,y)=>x.date.localeCompare(y.date));
        toast('Event published'); render(); break;
      }
      case 'delevent': {
        if (S.confirmDelete!==id){ S.confirmDelete=id; renderMain(); break; }
        await api(`/events/${id}`,{method:'DELETE'}); S.confirmDelete=null;
        S.events = (S.events||[]).filter(x=>x.id!==id); toast('Event cancelled'); render(); break;
      }
      case 'rsvp': {
        const r = await api(`/events/${id}/rsvp`,{method:'POST',body:{action:v}});
        S.events = S.events.map(x=>x.id===id ? {...x, ...r.event} : x);
        toast(r.event.myStatus==='requested' ? 'Sent to your grown-up' : r.event.myStatus==='going' ? 'You’re going' : 'Removed');
        render(); break;
      }
      case 'prsvp': {
        const k = currentChild();
        const r = await api(`/events/${id}/rsvp`,{method:'POST',body:{action:v, studentId:k.id}});
        k.events = k.events.map(x=>x.id===id ? {...x, going:r.event.going, status:r.event.myStatus} : x);
        toast(r.event.myStatus==='going' ? `${k.firstName} is going` : 'Updated'); render(); break;
      }
      case 'scope': {
        const k = currentChild();
        await api(`/children/${k.id}/settings`,{method:'PUT',body:{postScope:v}});
        k.profile.postScope = v; toast(v==='school'?'Posts can be seen by the whole school':'Posts stay in the class'); render(); break;
      }
    }
  } catch (err) { if (err.code===401) return signedOut(); fail(err); renderMain(); }
});

async function spin(){
  const win=document.getElementById('spinWin'); const btn=document.querySelector('[data-act="spin"]'); if(!win||!btn) return;
  btn.disabled=true; win.classList.add('rolling');
  const req = api('/spin',{method:'POST'});
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let n=0; const total=reduce?1:16;
  await new Promise(done=>{ const tickF=()=>{ n++; win.textContent = CAT.careers[Math.floor(Math.random()*CAT.careers.length)].name; if(n<total) setTimeout(tickF, 40+n*9); else done(); }; tickF(); });
  const r = await req;
  setProfile(r.profile);
  if (r.gained) toast(`+${r.gained} XP · Daily spin`);
  render(); openModal(r.career);
}
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('confetti'), ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#3f3bd6','#6d4fd8','#ffb23f','#ef5a45','#1e9e62'];
  const ps=Array.from({length:70},()=>({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; (function loop(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s/2,0,Math.PI*2);ctx.fill();}); if(++f<80) requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height); })();
}

/* ================= START ================= */
(async function start(){
  render();
  try { CAT = await api('/catalog'); }
  catch (e) { return centerMessage('A.R.I.S.E. Connect can’t load right now', e.message || 'Please try again in a minute.', '<button class="btn primary" style="margin-top:16px" onclick="location.reload()">Try again</button>'); }
  loadStars();
  if (!sessionToken()) return render();
  try { ME = await api('/me'); }
  catch (e) {
    if (e.code===401) { ME = null; return render(); }
    if (e.body && e.body.setup) return centerMessage('Almost ready', 'A.R.I.S.E. Connect is still being set up. Please check back soon.');
    return centerMessage('A.R.I.S.E. Connect can’t load right now', e.message, '<button class="btn primary" style="margin-top:16px" onclick="location.reload()">Try again</button>');
  }
  await loadPlan();
  S.tab = 'stars';
  render();
  if (ME.access || role()==='teacher') loadForRole();
})();
