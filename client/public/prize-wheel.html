<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Top Reader Prize Wheel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one game-show stage — marquee title, the wheel under a spotlight, one big spin button. Single dark look by choice. */
:root {
  --stage: #0b1033;
  --stage-2: #141b4d;
  --gold: #ffc93c;
  --gold-deep: #e09b00;
  --ink: #0b1033;
  --text: #f4f1ff;
  --muted: #a9b0e0;
  --hot: #ff3d7f;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 38%, #26307a 0%, var(--stage-2) 35%, var(--stage) 75%);
  color: var(--text);
  font-family: var(--body);
  overflow-x: hidden;
}
.stage {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(10px, 2.2vh, 22px);
  padding-block: 18px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
}
.rays {
  position: fixed; inset: -50%; z-index: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.035) 0 8deg, transparent 8deg 16deg);
  animation: turn 60s linear infinite;
}
@keyframes turn { to { transform: rotate(360deg); } }
.stage > * { position: relative; z-index: 1; }

.eyebrow {
  font-family: var(--display); font-size: clamp(12px, 1.6vw, 16px); letter-spacing: .18em;
  color: var(--ink); background: var(--gold); padding: 6px 14px; border-radius: 999px;
}
h1 {
  margin: 0; font-family: var(--display); font-weight: 400; text-align: center; text-wrap: balance;
  font-size: clamp(28px, 6vw, 64px); line-height: 1;
  color: var(--gold);
  text-shadow: 0 3px 0 var(--gold-deep), 0 6px 0 #7a4b00, 0 10px 24px rgba(0,0,0,.5);
}
.rig { display: flex; flex-direction: column; align-items: center; max-width: 100%; }
.wheel-wrap {
  --size: min(86vw, 60vh, 640px);
  width: var(--size); height: var(--size); max-width: 100%; position: relative; z-index: 2;
  filter: drop-shadow(0 24px 30px rgba(0,0,0,.55));
}
.gloss {
  position: absolute; inset: 6%; border-radius: 50%; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 70% 45% at 40% 22%, rgba(255,255,255,.32), rgba(255,255,255,0) 70%),
              radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.28) 100%);
}
.stand { display: flex; flex-direction: column; align-items: center; margin-top: calc(var(--size, 400px) * -0.06); width: 100%; }
.rig .stand { --size: min(86vw, 60vh, 640px); }
.post { width: calc(var(--size) * .1); height: calc(var(--size) * .1); background: linear-gradient(90deg, #7a4b00, var(--gold) 45%, #8a5a00); }
.base {
  width: calc(var(--size) * .52); max-width: 100%; height: calc(var(--size) * .07); border-radius: 50% 50% 14px 14px / 60% 60% 14px 14px;
  background: linear-gradient(#ffe07a, var(--gold) 40%, var(--gold-deep) 75%, #7a4b00);
  box-shadow: 0 14px 30px rgba(0,0,0,.55);
}
.wheel-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#wheel { will-change: transform; }
.hub {
  position: absolute; left: 50%; top: 50%; width: 18%; height: 18%; transform: translate(-50%, -50%);
  border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff6cf, var(--gold) 45%, var(--gold-deep));
  box-shadow: 0 0 0 6px var(--ink), 0 8px 24px rgba(0,0,0,.5);
  font-family: var(--display); color: var(--ink); font-size: calc(var(--size) * .03); text-align: center; line-height: 1.05; z-index: 3;
  align-content: center;
}
.hub span { display: block; font-size: 1.7em; line-height: .9; color: var(--hot); }
.pointer {
  position: absolute; left: 50%; top: -3.5%; width: 11%; transform-origin: 50% 22%;
  transform: translateX(-50%); filter: drop-shadow(0 6px 6px rgba(0,0,0,.55)); z-index: 3;
  transition: transform .09s ease-out;
}
.pointer.flap { transform: translateX(-50%) rotate(-22deg); transition: none; }

.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
#spinBtn {
  font-family: var(--display); font-size: clamp(22px, 3.6vw, 36px); letter-spacing: .04em;
  color: var(--ink); background: linear-gradient(#ffe07a, var(--gold) 55%, var(--gold-deep));
  border: 0; border-radius: 999px; padding: .5em 1.6em; cursor: pointer;
  box-shadow: 0 6px 0 #8a5a00, 0 12px 28px rgba(0,0,0,.45);
  animation: pulse 1.6s ease-in-out infinite;
}
#spinBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a5a00, 0 6px 16px rgba(0,0,0,.45); }
#spinBtn:disabled { animation: none; filter: saturate(.4) brightness(.8); cursor: default; }
#spinBtn:focus-visible, .ghost:focus-visible, .modal button:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
@keyframes pulse { 50% { transform: scale(1.05); } }
.chip {
  font-weight: 900; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); border: 2px solid rgba(255,201,60,.5); border-radius: 999px; padding: 6px 14px;
}
.ghost {
  font-family: var(--body); font-weight: 800; font-size: 14px; color: var(--muted);
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: 999px;
  padding: 8px 14px; cursor: pointer;
}
.ghost:hover { color: var(--text); }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

.modal {
  position: fixed; inset: 0; z-index: 15; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(5, 8, 30, .72); backdrop-filter: blur(4px);
}
.card {
  width: min(560px, 100%); text-align: center; padding: 28px 22px 26px; border-radius: 28px;
  background: linear-gradient(160deg, #1d2670, #0f1546);
  border: 4px solid var(--gold); box-shadow: 0 0 0 8px rgba(255,201,60,.18), 0 30px 80px rgba(0,0,0,.6);
  animation: pop .55s cubic-bezier(.2, 1.6, .4, 1) both;
}
@keyframes pop { from { transform: scale(.3) rotate(-8deg); opacity: 0; } }
.card .tag { font-family: var(--display); color: var(--hot); letter-spacing: .14em; font-size: clamp(14px, 2.4vw, 20px); }
.card .emoji { font-size: clamp(72px, 14vw, 128px); line-height: 1.1; animation: bob 1.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-10px) rotate(4deg); } }
.card .prize {
  font-family: var(--display); color: var(--gold); font-size: clamp(32px, 7vw, 60px); line-height: 1.05; margin: 4px 0 8px;
  text-shadow: 0 3px 0 #7a4b00;
}
.card .who { font-weight: 800; font-size: clamp(16px, 2.4vw, 22px); color: var(--text); margin-bottom: 18px; }
.card button {
  font-family: var(--display); font-size: clamp(16px, 2.6vw, 22px); color: var(--ink); background: var(--gold);
  border: 0; border-radius: 999px; padding: .6em 1.4em; cursor: pointer; box-shadow: 0 5px 0 #8a5a00;
}

@media (prefers-reduced-motion: reduce) {
  .rays, #spinBtn, .card .emoji { animation: none; }
}
</style>
</head>
<body>

<div class="rays" aria-hidden="true"></div>
<main class="stage">
  <div class="eyebrow">2026 Reading Awards</div>
  <h1>Top Reader of the Year</h1>

  <div class="rig">
  <div class="wheel-wrap" id="wheelWrap">
    <canvas id="lights" width="1000" height="1000" aria-hidden="true"></canvas>
    <canvas id="wheel" width="1000" height="1000" role="img" aria-label="Prize wheel"></canvas>
    <svg class="pointer" id="pointer" viewBox="0 0 100 130" aria-hidden="true">
      <path d="M50 128 L12 34 A40 40 0 1 1 88 34 Z" fill="#ff3d7f" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="50" cy="30" r="13" fill="#fff"/>
    </svg>
    <div class="gloss" aria-hidden="true"></div>
    <div class="hub"><span>★</span>TOP<br>READER</div>
  </div>
  <div class="stand" aria-hidden="true"><div class="post"></div><div class="base"></div></div>
  </div>

  <div class="controls">
    <span class="chip" id="spinCount">Spin 1 of 2</span>
    <button id="spinBtn" type="button">SPIN!</button>
  </div>
  <div class="controls">
    <button class="ghost" id="soundBtn" type="button">🔊 Sound on</button>
    <button class="ghost" id="fullBtn" type="button">⛶ Full screen</button>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="prizeName">
    <div class="tag" id="prizeTag">YOU WON</div>
    <div class="emoji" id="prizeEmoji">🎁</div>
    <div class="prize" id="prizeName">Prize</div>
    <div class="who" id="prizeWho"></div>
    <button id="modalBtn" type="button">Keep going</button>
  </div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  const PRIZES = [
    ["AirPods", "🎧"], ["PS4", "🎮"], ["iPhone 18", "📱"], ["Meta Glasses", "🕶️"],
    ["70\" TV", "📺"], ["Apple Watch", "⌚"], ["$250 Cash", "💵"], ["iPhone Fold", "📲"],
    ["Nintendo Switch", "🕹️"], ["$500 Cash", "💰"], ["Xbox", "🎮"], ["Apple TV", "🎬"],
    ["iPad Pro", "🖼️"], ["iPhone 17", "📱"], ["Beats", "🎵"], ["MacBook", "💻"],
    ["$100 Gift Card", "🎁"], ["JBL Speaker", "🔊"], ["Galaxy Phone", "📱"], ["Gaming Headset", "🎙️"],
  ];
  // The planned results, in order: spin 1, then the final spin.
  const PLAN = [0, 8];
  const COLORS = ["#ff4d6d", "#ff9f1c", "#ffd23f", "#2ec4b6", "#3a86ff", "#b15cff"];
  const N = PRIZES.length, SEG = (Math.PI * 2) / N, TAU = Math.PI * 2;

  const $ = (id) => document.getElementById(id);
  const wheel = $("wheel"), lights = $("lights"), pointer = $("pointer");
  const spinBtn = $("spinBtn"), spinCount = $("spinCount"), modal = $("modal");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- draw the wheel once ---------- */
  function drawWheel() {
    const c = wheel.getContext("2d"), R = 440, cx = 500, cy = 500;
    c.clearRect(0, 0, 1000, 1000);
    for (let i = 0; i < N; i++) {
      const a0 = -Math.PI / 2 + i * SEG, a1 = a0 + SEG;
      c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, R, a0, a1); c.closePath();
      c.fillStyle = COLORS[i % COLORS.length]; c.fill();
      // soft inner shading
      const g = c.createRadialGradient(cx, cy, 60, cx, cy, R);
      g.addColorStop(0, "rgba(255,255,255,.25)"); g.addColorStop(.7, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,0,.18)");
      c.fillStyle = g; c.fill();
      c.lineWidth = 5; c.strokeStyle = "#0b1033"; c.stroke();

      c.save();
      c.translate(cx, cy); c.rotate(a0 + SEG / 2);
      c.textAlign = "right"; c.textBaseline = "middle";
      c.font = "40px serif"; c.fillText(PRIZES[i][1], R - 26, 0);
      const label = PRIZES[i][0];
      let size = 30; c.font = `900 ${size}px Nunito, "Trebuchet MS", sans-serif`;
      while (c.measureText(label).width > 250 && size > 18) { size -= 2; c.font = `900 ${size}px Nunito, "Trebuchet MS", sans-serif`; }
      c.lineWidth = 7; c.strokeStyle = "#0b1033"; c.lineJoin = "round";
      c.strokeText(label, R - 80, 0); c.fillStyle = "#fff"; c.fillText(label, R - 80, 0);
      c.restore();
    }
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.lineWidth = 14; c.strokeStyle = "#0b1033"; c.stroke();
    // metal pegs on every slice line; the pointer clicks against these
    for (let i = 0; i < N; i++) {
      const a = -Math.PI / 2 + i * SEG, x = cx + Math.cos(a) * (R - 14), y = cy + Math.sin(a) * (R - 14);
      const g = c.createRadialGradient(x - 4, y - 4, 1, x, y, 13);
      g.addColorStop(0, "#ffffff"); g.addColorStop(.5, "#c9cfe8"); g.addColorStop(1, "#5a6189");
      c.beginPath(); c.arc(x, y, 12, 0, TAU); c.fillStyle = g; c.fill();
      c.lineWidth = 3; c.strokeStyle = "#0b1033"; c.stroke();
    }
  }

  /* ---------- marquee bulbs around the rim ---------- */
  let bulbPhase = 0;
  function drawLights(fast) {
    const c = lights.getContext("2d"), cx = 500, cy = 500, count = 32;
    c.clearRect(0, 0, 1000, 1000);
    c.beginPath(); c.arc(cx, cy, 478, 0, TAU);
    const ring = c.createLinearGradient(0, 0, 1000, 1000);
    ring.addColorStop(0, "#ffe07a"); ring.addColorStop(.5, "#e09b00"); ring.addColorStop(1, "#ffd23f");
    c.lineWidth = 56; c.strokeStyle = ring; c.stroke();
    for (let i = 0; i < count; i++) {
      const a = (i / count) * TAU, x = cx + Math.cos(a) * 478, y = cy + Math.sin(a) * 478;
      const on = fast ? Math.random() > .4 : (i + bulbPhase) % 2 === 0;
      c.beginPath(); c.arc(x, y, 12, 0, TAU);
      c.fillStyle = on ? "#fffbe6" : "#9a6a00"; c.shadowColor = on ? "#fff3b0" : "transparent"; c.shadowBlur = on ? 22 : 0;
      c.fill();
    }
    c.shadowBlur = 0;
  }
  let spinning = false;
  setInterval(() => { bulbPhase++; drawLights(spinning); }, 380);

  /* ---------- sound ---------- */
  let ac = null, soundOn = true;
  const audio = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } } if (ac && ac.state === "suspended") ac.resume(); return ac; };
  function tone(freq, start, dur, type = "triangle", vol = .18) {
    const a = audio(); if (!a || !soundOn) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + start;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(start, dur, vol = .2, freq = 3000) {
    const a = audio(); if (!a || !soundOn) return;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + start;
    s.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = .7; g.gain.value = vol;
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }
  const tick = () => { tone(1500 + Math.random() * 200, 0, .045, "square", .07); noise(0, .03, .12, 4000); };
  function whoosh() { noise(0, .6, .25, 900); tone(220, 0, .5, "sawtooth", .05); }
  function fanfare(grand) {
    const notes = grand ? [523, 659, 784, 1047, 784, 1047, 1319] : [523, 659, 784, 1047];
    notes.forEach((f, i) => { tone(f, i * .13, .35, "triangle", .2); tone(f / 2, i * .13, .35, "sawtooth", .05); });
    const end = notes.length * .13;
    [523, 659, 784, 1047].forEach((f) => tone(f, end, grand ? 1.8 : 1.1, "triangle", .14));
    noise(end, grand ? 2.2 : 1.4, grand ? .35 : .22, 1800); // crowd cheer
    if (grand) noise(end, 1.6, .25, 7000); // cymbal
  }

  /* ---------- confetti ---------- */
  const cf = $("confetti"), cc = cf.getContext("2d"); let parts = [];
  function sizeConfetti() { cf.width = innerWidth * devicePixelRatio; cf.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", sizeConfetti); sizeConfetti();
  function burst(n) {
    if (reduced) n = Math.round(n / 4);
    const W = cf.width, H = cf.height;
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      parts.push({
        x: fromLeft ? 0 : W, y: H * .75, vx: (fromLeft ? 1 : -1) * (6 + Math.random() * 14) * devicePixelRatio,
        vy: -(14 + Math.random() * 18) * devicePixelRatio, r: (5 + Math.random() * 7) * devicePixelRatio,
        c: [...COLORS, "#ffffff", "#ffc93c"][i % 8], a: Math.random() * TAU, va: (Math.random() - .5) * .4, life: 0,
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(stepConfetti); }
  }
  let confettiRunning = false;
  function stepConfetti() {
    cc.clearRect(0, 0, cf.width, cf.height);
    parts = parts.filter((p) => p.y < cf.height + 40 && p.life < 600);
    for (const p of parts) {
      p.life++; p.vy += .35 * devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      cc.save(); cc.translate(p.x, p.y); cc.rotate(p.a); cc.fillStyle = p.c;
      cc.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cc.restore();
    }
    if (parts.length) requestAnimationFrame(stepConfetti); else { confettiRunning = false; cc.clearRect(0, 0, cf.width, cf.height); }
  }

  /* ---------- spinning ---------- */
  let rot = 0, round = 0;
  const indexAt = (r) => Math.floor((((-r) % TAU) + TAU) % TAU / SEG);
  function setRot(r) { wheel.style.transform = `rotate(${r}rad)`; }

  function targetRotation(index, grand) {
    // Land at a random spot inside the slice, never dead centre. The final spin creeps in just past the peg.
    const f = grand ? .84 + Math.random() * .07 : .2 + Math.random() * .6;
    const want = (((-(index + f) * SEG) % TAU) + TAU) % TAU;
    const turns = reduced ? 2 : 8 + Math.floor(Math.random() * 3);
    let end = rot - (((rot % TAU) + TAU) % TAU) + want + turns * TAU;
    if (end < rot + turns * TAU) end += TAU;
    return end;
  }

  function spin() {
    if (spinning || round >= PLAN.length) return;
    audio();
    spinning = true; spinBtn.disabled = true;
    const target = PLAN[round], grand = round === PLAN.length - 1;
    const base = rot, windBack = reduced ? 0 : SEG * .35;
    const end = targetRotation(target, grand) ;
    const dur = reduced ? 2500 : (grand ? 13500 : 11000) + Math.random() * 1500;
    let lastIdx = Math.floor(rot / SEG);
    const ease = (p) => 1 - Math.pow(1 - p, 5);
    const clickPeg = () => {
      const idx = Math.floor(rot / SEG);
      if (idx !== lastIdx) {
        lastIdx = idx; tick();
        pointer.classList.add("flap"); requestAnimationFrame(() => pointer.classList.remove("flap"));
      }
    };
    // 1) wind up: pull the wheel back a little, like a hand grabbing it
    const wStart = performance.now(), wDur = reduced ? 0 : 700;
    function wind(now) {
      const p = wDur ? Math.min(1, (now - wStart) / wDur) : 1;
      rot = base - windBack * Math.sin(p * Math.PI / 2);
      setRot(rot); clickPeg();
      if (p < 1) requestAnimationFrame(wind); else { whoosh(); go(rot); }
    }
    // 2) the spin itself, slowing right down at the end
    function go(start) {
      const t0 = performance.now();
      function frame(now) {
        const p = Math.min(1, (now - t0) / dur);
        rot = start + (end - start) * ease(p);
        setRot(rot); clickPeg();
        if (p < 1) requestAnimationFrame(frame); else settle();
      }
      requestAnimationFrame(frame);
    }
    // 3) a tiny rock back as the pointer rests on the peg
    function settle() {
      const s0 = performance.now(), from = rot, back = reduced ? 0 : SEG * .02;
      function f(now) {
        const p = Math.min(1, (now - s0) / 500);
        rot = from - back * Math.sin(p * Math.PI);
        setRot(rot);
        if (p < 1) requestAnimationFrame(f); else { rot = from; setRot(rot); setTimeout(() => land(target), 900); }
      }
      requestAnimationFrame(f);
    }
    requestAnimationFrame(wind);
  }

  function land(index) {
    spinning = false;
    const grand = round === PLAN.length - 1;
    const [name, emoji] = PRIZES[indexAt(rot)] || PRIZES[index];
    $("prizeTag").textContent = grand ? "★ GRAND PRIZE ★" : "PRIZE #" + (round + 1);
    $("prizeEmoji").textContent = emoji;
    $("prizeName").textContent = name + "!";
    $("prizeWho").textContent = grand ? "The Top Reader of the Year takes it home!" : "One more spin for the grand prize...";
    $("modalBtn").textContent = grand ? "🏆 Celebrate!" : "Spin for the Grand Prize";
    modal.hidden = false; $("modalBtn").focus();
    fanfare(grand); burst(grand ? 420 : 200);
    if (grand) { setTimeout(() => burst(300), 900); setTimeout(() => burst(300), 1800); }
    round++;
    spinCount.textContent = round >= PLAN.length ? "All prizes awarded" : `Spin ${round + 1} of ${PLAN.length}`;
    spinBtn.textContent = round >= PLAN.length ? "🏆 WINNER!" : "FINAL SPIN!";
  }

  $("modalBtn").addEventListener("click", () => {
    modal.hidden = true;
    if (round >= PLAN.length) { burst(300); fanfare(true); spinBtn.disabled = true; }
    else { spinBtn.disabled = false; spinBtn.focus(); }
  });

  function reset() {
    if (spinning) return;
    round = 0; modal.hidden = true; spinBtn.disabled = false; spinBtn.textContent = "SPIN!";
    spinCount.textContent = `Spin 1 of ${PLAN.length}`;
  }

  spinBtn.addEventListener("click", spin);
  $("soundBtn").addEventListener("click", (e) => { soundOn = !soundOn; e.currentTarget.textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off"; audio(); });
  $("fullBtn").addEventListener("click", () => {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen?.().catch(() => {});
    else d.documentElement.requestFullscreen?.().catch(() => {});
  });
  // Presenter clickers send Space / Enter / arrow keys / PageDown. Shift+R resets for rehearsal.
  addEventListener("keydown", (e) => {
    if (e.key === "R" && e.shiftKey) { reset(); return; }
    if ([" ", "Enter", "ArrowRight", "PageDown", "ArrowDown"].includes(e.key)) {
      e.preventDefault();
      if (!modal.hidden) $("modalBtn").click(); else spin();
    }
  });

  // Start on a random-looking angle so the first spin doesn't begin with AirPods under the pointer.
  rot = (3.5 + Math.random()) * SEG * -1 + TAU * 4;
  setRot(rot);
  drawLights(false);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(drawWheel);
  drawWheel();
})();
</script>
</body>
</html>
