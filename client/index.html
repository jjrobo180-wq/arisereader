<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>A.R.I.S.E Reader</title>
    <meta name="description" content="Read a book. Take a quiz. Earn points." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: hsl(0 0% 10%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: "A.R.I.S.E Reader";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: hsl(21 100% 50%);
        font-family: Arial, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
