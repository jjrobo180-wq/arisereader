    <style>
      #root:empty::before {

        inset: 0;

        left: 50%;
        transform: translate(-50%, -50%);
        color: hsl(21 100% 50%);

        font-weight: 700;
        letter-spacing: 0.05em;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {

        50% { opacity: 0.4; }
      }

  <body>
    <script>
      // Fix double-slash URLs (e.g. arisereader.com// → arisereader.com/)
      if (location.pathname.includes('//')) {
        var clean = location.pathname.replace(/\/+/g, '/');
        var newUrl = clean + location.search + location.hash;
        history.replaceState(null, '', newUrl);
      }
    </script>
