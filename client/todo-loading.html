<!-- Arise To Do's loading screen (the iPhone app's build only, added by vite.todo.config.ts).
     The native splash (arisetodo/ios-app/splash-2732.png) is its first frame: navy, with the app icon.
     It plays once, then fades out as soon as the app has drawn its first screen. -->
<style id="todo-boot-style">
#todo-boot{position:fixed;inset:0;z-index:2147483000;overflow:hidden;background:#211c55;color:#fff;font-family:'DM Sans',-apple-system,system-ui,sans-serif;transition:opacity .35s ease}
#todo-boot.out{opacity:0;pointer-events:none}
#todo-boot .tb-half{position:absolute;left:0;right:0;height:50%}
#todo-boot .tb-top{top:0;background:#211c55;animation:tbDown .8s cubic-bezier(.7,0,.2,1) both}
#todo-boot .tb-bot{bottom:0;background:#2a2470;animation:tbUp .8s cubic-bezier(.7,0,.2,1) both}
#todo-boot .tb-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 44px}
#todo-boot .tb-logo{display:flex;flex-direction:column;align-items:center;gap:20px}
#todo-boot .tb-tile{width:104px;height:104px;border-radius:24px;animation:tbGlow 1.8s 1s ease-out infinite}
#todo-boot .tb-tile img{width:104px;height:104px;display:block;border-radius:24px}
#todo-boot .tb-name{font:800 26px/1.2 'Plus Jakarta Sans',-apple-system,system-ui,sans-serif;letter-spacing:-1.2px}
#todo-boot .tb-name span{color:#c1f7d4}
#todo-boot .tb-rows{width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;margin-top:10px}
#todo-boot .tb-row{display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;animation:tbRow .45s ease-out both}
#todo-boot .tb-box{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;display:flex;align-items:center;justify-content:center;animation:tbTick .3s ease-out both}
#todo-boot .tb-box svg{opacity:0;animation:tbMark .25s ease-out both}
#todo-boot .tb-row:nth-child(1){animation-delay:.9s}#todo-boot .tb-row:nth-child(2){animation-delay:1.05s}#todo-boot .tb-row:nth-child(3){animation-delay:1.2s}
#todo-boot .tb-row:nth-child(1) .tb-box,#todo-boot .tb-row:nth-child(1) svg{animation-delay:1.45s}
#todo-boot .tb-row:nth-child(2) .tb-box,#todo-boot .tb-row:nth-child(2) svg{animation-delay:1.75s}
#todo-boot .tb-row:nth-child(3) .tb-box,#todo-boot .tb-row:nth-child(3) svg{animation-delay:2.05s}
@keyframes tbDown{from{transform:translateY(-100%)}to{transform:none}}
@keyframes tbUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes tbGlow{0%{box-shadow:0 0 0 0 rgba(121,102,240,.6)}70%,100%{box-shadow:0 0 0 24px rgba(121,102,240,0)}}
@keyframes tbRow{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tbTick{to{background:#c1f7d4;border-color:#c1f7d4}}
@keyframes tbMark{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#todo-boot *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

<script>
(function () {
  // Stays at least until the last task is ticked (2.4s), then fades once the app has drawn its first
  // screen. Never longer than 12 seconds, so a slow start still shows the app.
  var boot = document.getElementById("todo-boot"), start = Date.now(), done = false;
  function hide() {
    if (done || !boot) return; done = true;
    boot.className = "out";
    setTimeout(function () { boot.remove(); var s = document.getElementById("todo-boot-style"); if (s) s.remove(); }, 400);
  }
  function check() {
    if (done) return;
    var root = document.getElementById("root");
    var ready = root && root.childElementCount > 0;
    if (ready && Date.now() - start >= 2400) hide();
    else if (Date.now() - start > 12000) hide();
    else setTimeout(check, 120);
  }
  check();
})();
</script>
