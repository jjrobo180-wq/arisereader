name: Arise To Duo signed iOS release candidate
# Signed release; upload only for a commit explicitly marked [approved-testflight].
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send this build to TestFlight (the owner's approval)
        type: boolean
        default: false
  push:
    branches: [feat/arisetodo-ios-app-store-starter, feat/arisetodo-native-ios-foundation]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/arisetodo-signed-release.yml'
      - 'arisetodo/ios-app/**'
      - 'client/src/**'
      - 'native/**'
      - 'client/index.html'
jobs:
  signed-archive:
    # GitHub's Xcode 27 image (Apple Silicon): builds with the iOS 27.1 SDK, for iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27 (the iOS 27.1 SDK makes the app fill the iPhone Duo's inner screen)
        shell: bash
        run: |
          set -euo pipefail
          # The newest final release of Xcode 27 (App Store Connect doesn't take builds from betas);
          # a release candidate only when no final one is installed.
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [[ -z "$X" ]]; then X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -1 || true); fi
          if [[ -z "$X" ]]; then X=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          SDK=$(DEVELOPER_DIR="$X/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)
          echo "::notice title=Xcode::$(basename "$X") with the iOS $SDK SDK"
          if [[ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -1)" != "27.1" ]]; then
            echo "::warning title=iPhone Duo::The iOS $SDK SDK is older than 27.1, so the app won't fill the iPhone Duo's inner screen."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app sources
        run: test -f arisetodo/ios-app/capacitor.config.json
      - name: Verify signing configuration
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build and bundle local frontend
        run: |
          npm ci
          npx vite build
          bash .github/scripts/prune_todo_bundle.sh dist/public
          rm -rf arisetodo/ios-app/www
          mkdir -p arisetodo/ios-app/www
          cp -R dist/public/. arisetodo/ios-app/www/
      - name: Install native dependencies and generate iOS project
        working-directory: arisetodo/ios-app
        run: |
          npm install --no-audit --no-fund
          python3 ../../.github/scripts/ota_setup.py todo
          npx cap add ios
          npx cap sync ios
      - name: Prepare beta icon and build number
        working-directory: arisetodo/ios-app
        run: |
          set -euo pipefail
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON"
          sips -s format jpeg -s formatOptions 100 ../../client/public/app-icons/todo-1024.png --out "$RUNNER_TEMP/todo-icon.jpg" >/dev/null
          sips -z 1024 1024 -s format png "$RUNNER_TEMP/todo-icon.jpg" --out "$ICON/AppIcon-1024.png" >/dev/null
          printf '%s' '{"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON/Contents.json"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ios/App/App/Info.plist
      - name: Permission text, name and export compliance (Info.plist)
        working-directory: arisetodo/ios-app
        run: |
          python3 configure-ios.py ios/App/App/Info.plist
          python3 add-sound.py ios/App/App.xcodeproj/project.pbxproj ios/App/App
          python3 ../../.github/scripts/adopt_uiscene.py ios/App/App/Info.plist
          python3 ../../.github/scripts/ipad_universal.py ios/App/App/Info.plist
      - name: Import Apple signing certificate and provisioning profile
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          # Sign in with Apple, Apple Health and push notifications on the App ID, and a profile that includes them (same certificate).
          python3 .github/scripts/apple_signing.py com.arisereader.arisetodo "$RUNNER_TEMP/profile.mobileprovision" HEALTHKIT APPLE_ID_AUTH PUSH_NOTIFICATIONS APP_GROUPS
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$PROFILE_APP_ID" != '6TYWWNKX6P.com.arisereader.arisetodo' ]]; then
            echo "::error::Provisioning profile does not match A.R.I.S.E. To-Do bundle ID"
            exit 1
          fi
          security create-keychain -p "" "$RUNNER_TEMP/arisetodo.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/arisetodo.keychain-db"
          # Never lock by itself: the default locks it after 5 idle minutes, and a later signing step (the Apple TV
          # app, after the iPhone upload) then waited for a password forever.
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/arisetodo.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/arisetodo.keychain-db" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/arisetodo.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/arisetodo.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          # Apple Health needs the HealthKit capability on the App ID and in this profile.
          # Until the profile has it, build without the entitlement (the app works; Health shows as unavailable).
          ENT=arisetodo/ios-app/ios/App/App/App.entitlements
          USE_ENT=""
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.healthkit' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.healthkit bool true' "$ENT" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.healthkit true' "$ENT"
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.healthkit.access array' "$ENT" 2>/dev/null || true
            USE_ENT=1
            echo "Apple Health: HealthKit entitlement enabled"
          else
            echo "::warning::The provisioning profile has no HealthKit capability. Building without Apple Health."
          fi
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.applesignin' "$ENT" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin array' "$ENT"
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin:0 string Default' "$ENT"
            USE_ENT=1
            echo "Sign in with Apple: entitlement enabled"
          else
            echo "::warning::The provisioning profile has no Sign in with Apple capability. Building without it."
          fi
          APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          if [[ -n "$APS" ]]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string $APS" "$ENT" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :aps-environment $APS" "$ENT"
            USE_ENT=1
            echo "Push notifications: entitlement enabled ($APS)"
          else
            echo "::warning::The provisioning profile has no Push Notifications capability. Building without server notifications."
          fi
          # Widgets: the app's profile needs the App Group and the widget extension needs a profile of its own.
          # Without both, the app is built as before, without widgets.
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            SEED_PROFILE="$RUNNER_TEMP/profile.mobileprovision" python3 .github/scripts/apple_signing.py com.arisereader.arisetodo.widgets "$RUNNER_TEMP/widget.mobileprovision" APP_GROUPS || true
            if [[ -s "$RUNNER_TEMP/widget.mobileprovision" ]] && security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" > "$RUNNER_TEMP/widget.plist" 2>/dev/null && /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/widget.plist" >/dev/null 2>&1; then
              cp "$RUNNER_TEMP/widget.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget.plist").mobileprovision"
              /usr/libexec/PlistBuddy -c 'Delete :com.apple.security.application-groups' "$ENT" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.application-groups array' "$ENT"
              /usr/libexec/PlistBuddy -c 'Add :com.apple.security.application-groups:0 string group.com.arisereader.arisetodo' "$ENT"
              USE_ENT=1
              echo "WIDGETS=1" >> "$GITHUB_ENV"
              echo "WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget.plist")" >> "$GITHUB_ENV"
              echo "Widgets: App Group and widget profile ready"
            else
              echo "::warning::No provisioning profile for the widget extension (com.arisereader.arisetodo.widgets). Building without widgets."
            fi
          else
            echo "::warning::The app's provisioning profile has no App Group. Building without widgets."
          fi
          if [[ -n "$USE_ENT" ]]; then echo "HEALTH_ENTITLEMENTS=CODE_SIGN_ENTITLEMENTS=App/App.entitlements" >> "$GITHUB_ENV"; else echo "HEALTH_ENTITLEMENTS=" >> "$GITHUB_ENV"; fi
      - name: Profiles for the Apple Watch and Apple TV apps
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -uo pipefail
          # The watch app has an App ID of its own (registered the first time); a TV app is the same App ID
          # as the iPhone app (one App Store listing) with a tvOS profile.
          SEED_PROFILE="$RUNNER_TEMP/profile.mobileprovision" CREATE_APP_ID="Arise Duo Watch" python3 .github/scripts/apple_signing.py com.arisereader.arisetodo.watchkitapp "$RUNNER_TEMP/watch.mobileprovision"
          python3 .github/scripts/add_tvos_platform.py com.arisereader.arisetodo
          SEED_PROFILE="$RUNNER_TEMP/profile.mobileprovision" PROFILE_TYPE=TVOS_APP_STORE python3 .github/scripts/apple_signing.py com.arisereader.arisetodo "$RUNNER_TEMP/tv.mobileprovision"
          for kind in watch tv; do
            f="$RUNNER_TEMP/$kind.mobileprovision"
            [[ -s "$f" ]] || continue
            if security cms -D -i "$f" > "$RUNNER_TEMP/$kind.plist" 2>/dev/null; then
              cp "$f" "$HOME/Library/MobileDevice/Provisioning Profiles/$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$kind.plist").mobileprovision"
              echo "$(echo "$kind" | tr a-z A-Z)_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/$kind.plist")" >> "$GITHUB_ENV"
              echo "$kind: profile ready"
            fi
          done
          [[ -s "$RUNNER_TEMP/watch.mobileprovision" ]] || echo "::warning title=Apple Watch::No App Store profile for the watch app. Building without it."
      - name: Add the widget extension (signed)
        if: env.WIDGETS == '1'
        working-directory: arisetodo/ios-app
        env:
          SIGN_TEAM: 6TYWWNKX6P
          APP_ENTITLEMENTS: App/App.entitlements
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION' || gem install xcodeproj --no-document --user-install
          export GEM_PATH="$(ruby -e 'puts Gem.user_dir'):$(ruby -e 'puts Gem.default_dir')"
          APP_PROFILE="$PROFILE_NAME" WIDGET_PROFILE="$WIDGET_PROFILE_NAME" ruby ../../.github/scripts/add_widget.rb ios/App/App.xcodeproj com.arisereader.arisetodo "$(cat widgets.json)" f5b400
          # The Apple Watch app goes inside the iPhone app; the Apple TV app is archived on its own below.
          if [[ -n "${WATCH_PROFILE_NAME:-}" ]]; then
            (cd ../.. && COMPANION_PROFILE="$WATCH_PROFILE_NAME" ruby .github/scripts/add_companion.rb "$OLDPWD/ios/App/App.xcodeproj" --kind watch --name DuoWatch --display "Arise Duo" --host com.arisereader.arisetodo --sources native/watch-kit/AriseWatchLink.swift,native/duo-watch/DuoWatchApp.swift --icon client/public/app-icons/todo-1024.png --embed)
            echo "WATCH_ADDED=1" >> "$GITHUB_ENV"
          fi
          if [[ -n "${TV_PROFILE_NAME:-}" ]]; then
            (cd ../.. && COMPANION_PROFILE="$TV_PROFILE_NAME" ruby .github/scripts/add_companion.rb "$OLDPWD/ios/App/App.xcodeproj" --kind tv --name DuoTV --display "Arise Duo" --host com.arisereader.arisetodo --sources native/duo-tv/DuoTVApp.swift --tv-assets native/duo-tv/Assets.xcassets)
            echo "TV_ADDED=1" >> "$GITHUB_ENV"
          fi
      - name: Add the privacy manifest to the app and its extensions
        working-directory: arisetodo/ios-app
        run: |
          set -euo pipefail
          ruby -rxcodeproj -e 'puts Xcodeproj::VERSION' || gem install xcodeproj --no-document --user-install
          export GEM_PATH="$(ruby -e 'puts Gem.user_dir'):$(ruby -e 'puts Gem.default_dir')"
          ruby ../../.github/scripts/add_privacy_manifest.rb ios/App/App.xcodeproj PrivacyInfo.xcprivacy
      - name: Archive signed app with widgets
        if: env.WIDGETS == '1'
        working-directory: arisetodo/ios-app
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ARISEToDo.xcarchive" archive
          test -d "$RUNNER_TEMP/ARISEToDo.xcarchive/Products/Applications/App.app/PlugIns/AriseWidgets.appex"
      - name: Archive signed app for physical iPhone
        if: env.WIDGETS != '1'
        working-directory: arisetodo/ios-app
        env:
          TEAM_ID: 6TYWWNKX6P
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ARISEToDo.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.arisereader.arisetodo \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            $HEALTH_ENTITLEMENTS \
            archive
      - name: Show what the signed app is allowed to use (Apple Health, Sign in with Apple)
        run: |
          APP="$RUNNER_TEMP/ARISEToDo.xcarchive/Products/Applications/App.app"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          for k in com.apple.developer.healthkit com.apple.developer.applesignin aps-environment; do
            if printf '%s' "$ENT" | grep -q "$k"; then echo "::notice title=Entitlement::$k is ON in the signed app"; else echo "::warning title=Entitlement::$k is OFF in the signed app"; fi
          done
      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": "6TYWWNKX6P",
              "provisioningProfiles": {"com.arisereader.arisetodo": os.environ["PROFILE_NAME"]},
          }
          if os.environ.get("WIDGET_PROFILE_NAME"):
              options["provisioningProfiles"]["com.arisereader.arisetodo.widgets"] = os.environ["WIDGET_PROFILE_NAME"]
          if os.environ.get("WATCH_ADDED") and os.environ.get("WATCH_PROFILE_NAME"):
              options["provisioningProfiles"]["com.arisereader.arisetodo.watchkitapp"] = os.environ["WATCH_PROFILE_NAME"]
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ARISEToDo.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/arisetodo-export"
      - name: Save IPA for review (not uploaded to Apple)
        uses: actions/upload-artifact@v4
        with:
          name: arisetodo-ios-ipa-not-submitted
          path: ${{ runner.temp }}/arisetodo-export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload signed archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisetodo-ios-signed-archive
          path: ${{ runner.temp }}/ARISEToDo.xcarchive
          if-no-files-found: error
          retention-days: 3
      - name: Validate beta and perform explicitly approved TestFlight upload
        env:
          APPROVED_UPLOAD: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-testflight]')) || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Existing App Store Connect credential $name is unavailable to this job. No upload attempted."
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA=("$RUNNER_TEMP"/arisetodo-export/*.ipa)
          xcrun altool --validate-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          if [[ "$APPROVED_UPLOAD" == "true" ]]; then
            xcrun altool --upload-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
      - name: Apple TV build (archive, validate, and upload with the same approval)
        if: env.TV_ADDED == '1'
        continue-on-error: true
        working-directory: arisetodo/ios-app
        env:
          APPROVED_UPLOAD: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-testflight]')) || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "" "$RUNNER_TEMP/arisetodo.keychain-db"
          xcodebuild -project ios/App/App.xcodeproj -scheme DuoTV -configuration Release -destination 'generic/platform=tvOS' -archivePath "$RUNNER_TEMP/DuoTV.xcarchive" archive
          python3 - <<'PY'
          import os, plistlib
          with open(os.path.join(os.environ["RUNNER_TEMP"], "TVExportOptions.plist"), "wb") as f:
              plistlib.dump({"method": "app-store-connect", "destination": "export", "signingStyle": "manual", "teamID": "6TYWWNKX6P",
                             "provisioningProfiles": {"com.arisereader.arisetodo": os.environ["TV_PROFILE_NAME"]}}, f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DuoTV.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/TVExportOptions.plist" -exportPath "$RUNNER_TEMP/tv-export"
          IPA=("$RUNNER_TEMP"/tv-export/*.ipa)
          xcrun altool --validate-app -f "${IPA[0]}" -t appletvos --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          if [[ "$APPROVED_UPLOAD" == "true" ]]; then
            xcrun altool --upload-app -f "${IPA[0]}" -t appletvos --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/arisetodo.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
