name: Live updates for the iPhone apps
# Every change to the web code on master is built for each iPhone app and published as a GitHub
# release "ota-<app>-<version>" with a zip. The apps ask arisetodo.com/api/ota/<app> when they open
# (server/ota.ts) and switch to the new copy the next time they open, with no App Store build.
# Native changes (plugins, Info.plist, icons) still need a TestFlight build: raise
# .github/ota/native-level when making one, so older app builds never get web code made for it.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'podscroll/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.*'
      - 'postcss.config.*'
      - '.github/ota/native-level'
      - '.github/workflows/ota-publish.yml'
permissions:
  contents: write
concurrency:
  group: ota-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        app: [todo, podplus, reader, educator, fit, eyegaze, trainer, notes, talk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app's web code
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.app }}" in
            podplus)
              PODPLUS_IOS=1 npx vite build --config podscroll/vite.config.ts
              node podscroll/ios-app/prepare-web.mjs
              echo "OUT=podscroll/dist" >> "$GITHUB_ENV" ;;
            notes)
              VITE_NATIVE_APP=notes npx vite build
              bash .github/scripts/prune_notes_bundle.sh dist/public
              echo "OUT=dist/public" >> "$GITHUB_ENV" ;;
            todo)
              npx vite build
              bash .github/scripts/prune_todo_bundle.sh dist/public
              echo "OUT=dist/public" >> "$GITHUB_ENV" ;;
            educator)
              VITE_NATIVE_APP=educator npx vite build
              bash .github/scripts/prune_educator_bundle.sh dist/public
              echo "OUT=dist/public" >> "$GITHUB_ENV" ;;
            fit|trainer|talk)
              VITE_NATIVE_APP=${{ matrix.app }} npx vite build
              bash .github/scripts/prune_own_app_bundle.sh ${{ matrix.app }} dist/public
              echo "OUT=dist/public" >> "$GITHUB_ENV" ;;
            *)
              VITE_NATIVE_APP=${{ matrix.app }} npx vite build
              echo "OUT=dist/public" >> "$GITHUB_ENV" ;;
          esac
      - name: Zip and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f "$OUT/index.html"
          LEVEL=$(tr -d '[:space:]' < .github/ota/native-level)
          V="$LEVEL.$(( $(date +%s) / 60 )).0"
          TAG="ota-${{ matrix.app }}-$V"
          ZIP="$RUNNER_TEMP/$TAG.zip"
          (cd "$OUT" && zip -qr -X "$ZIP" .)
          # Every phone downloads and unpacks this zip, so each app has a ceiling: fail if an update balloons
          # again (each of these was 160 MB until the unused folders were taken out; the eye-gaze engine alone
          # is 145 MB, and only Arise AAC and Arise Reader carry it).
          case "${{ matrix.app }}" in
            reader|eyegaze) LIMIT=200 ;;
            todo|educator) LIMIT=100 ;;
            *) LIMIT=30 ;;
          esac
          if [ "$(stat -c %s "$ZIP")" -gt $(( LIMIT * 1024 * 1024 )) ]; then
            echo "::error::The ${{ matrix.app }} live update is $(du -h "$ZIP" | cut -f1), over its $LIMIT MB limit"; exit 1
          fi
          echo "::notice title=${{ matrix.app }}::$TAG ($(du -h "$ZIP" | cut -f1))"
          # The tag goes on the built commit when GitHub allows it. Once master has moved on with a change to a
          # workflow file, GitHub refuses (403) to let this run's token put a tag on the older commit, so the
          # release is tagged on master's tip instead. The phones only read the tag name and the zip, and the
          # notes still say which commit the zip was built from.
          NOTES="Web code for the ${{ matrix.app }} iPhone app at ${GITHUB_SHA::8}."
          made=""
          for try in 1 2 3; do
            if gh release create "$TAG" "$ZIP" --title "Live update: ${{ matrix.app }} $V" --notes "$NOTES" --prerelease --latest=false --target "$GITHUB_SHA"; then made=1; break; fi
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            if gh release create "$TAG" "$ZIP" --title "Live update: ${{ matrix.app }} $V" --notes "$NOTES" --prerelease --latest=false; then made=1; break; fi
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            sleep $(( try * 15 ))
          done
          test -n "$made"
          # Keep the 6 newest for each app.
          gh release list --limit 200 --json tagName,createdAt --jq "[.[] | select(.tagName | startswith(\"ota-${{ matrix.app }}-\"))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName" \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
