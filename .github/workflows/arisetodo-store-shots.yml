name: Arise To Duo App Store screenshots
# Framed 6.9" and 6.5" screenshots from the built-in sample profile. Run from the Actions tab.
# The pictures are in the run's "todo-store-shots" artifact and on the todo-store-shots branch.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Take and frame the screenshots
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          node script/appStoreListing.mjs
      - name: Keep them on the todo-store-shots branch (readable without downloading the artifact)
        working-directory: listing
        run: |
          git init -q -b todo-store-shots
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "To Duo store shots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" todo-store-shots
      - uses: actions/upload-artifact@v4
        with:
          name: todo-store-shots
          path: listing/
          retention-days: 14
