name: All Access review screenshot
# The Reader iPhone app's pages and the website, in an iPhone-sized Safari (WebKit), with a fake server:
# a parent signs up, lands on the plan page, taps a plan, and Safari opens signed in on the payment page.
# Also To Duo's sign-up. Screenshots and results go to the all-access-shot-out branch. See script/readerSignupCheck.mjs.
on:
  push:
    branches: [all-access-shot]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app's pages (as inside the iPhone apps)
        run: |
          grep -rl 'window.location.protocol === "capacitor:"' client/src | xargs sed -i 's/window.location.protocol === "capacitor:"/true/g'
          VITE_NATIVE_APP=todo npx vite build && mv dist/public dist-todo
          git checkout -- client/src
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Sign up, plan, pay
        timeout-minutes: 10
        run: node script/allAccessShot.mjs
      - name: Save to the all-access-shot-out branch
        if: always()
        working-directory: screens
        run: |
          git init -q && git checkout -q -b all-access-shot-out
          git config user.name "all-access-shot-out" && git config user.email "all-access-shot-out@users.noreply.github.com"
          git add -A && git commit -qm "Sign-up check ${{ github.sha }}" || true
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" all-access-shot-out
