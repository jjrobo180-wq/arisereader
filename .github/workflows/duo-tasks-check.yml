name: Arise To Duo Tasks check (tick and add, in a browser)
# The built app, signed in with a workspace shaped like a real one; ticks and adds a task and checks each is saved.
# Run on the website's build and on the To Duo iPhone app's own build (vite.todo.config.ts: To Duo alone).
# Screenshots and results go to the duo-tasks-check branch (duo-tasks-check-todo for the app's build).
on:
  workflow_dispatch:
    inputs:
      plan:
        description: "unlimited or free"
        default: unlimited
  push:
    branches: [master]
    paths:
      - 'client/src/pages/AriseTodo.tsx'
      - 'client/src/components/family-hub/LifeTasksScreen.tsx'
      - 'client/src/components/teacher-hub/HubTasks.tsx'
      - 'client/src/lib/useTodoCloud.ts'
      - 'shared/hubSwap.ts'
      - 'script/duoTasksCheck.mjs'
      - 'script/fitFoodCheck.mjs'
      - 'client/src/pages/fit/**'
      - '.github/workflows/duo-tasks-check.yml'
      - 'vite.todo.config.ts'
      - 'script/todoBundle.mjs'
      - '.github/scripts/prune_todo_bundle.sh'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [website, todo-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          if [ "${{ matrix.build }}" = "todo-app" ]; then
            npx vite build --config vite.todo.config.ts
            bash .github/scripts/prune_todo_bundle.sh dist/public
          else
            npx vite build
          fi
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Tick and add
        timeout-minutes: 10
        env:
          PLAN: ${{ github.event.inputs.plan || 'unlimited' }}
        run: node script/duoTasksCheck.mjs
      - name: Cooked, log food
        timeout-minutes: 10
        run: node script/fitFoodCheck.mjs
      - name: Save to the duo-tasks-check branch
        if: always()
        working-directory: screens
        run: |
          BRANCH=duo-tasks-check${{ matrix.build == 'todo-app' && '-todo' || '' }}
          git init -q -b "$BRANCH"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Duo tasks check ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
