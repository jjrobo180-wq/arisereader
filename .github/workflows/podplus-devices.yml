name: Podster on iPad and iPhone Duo (screenshots)
# Builds Podster and opens it in Safari's engine at iPad and iPhone Duo screen sizes (tests/podplus-devices),
# then saves the screenshots and a report to the podplus-device-shots branch.
on:
  workflow_dispatch:
  push:
    branches: [test/podplus-devices]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --config podscroll/vite.config.ts
      - name: Safari's engine
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
      - run: node tests/podplus-devices/run.mjs
      - name: Save the screenshots to the podplus-device-shots branch
        if: always()
        run: |
          cd tests/podplus-devices/out
          git init -q -b podplus-device-shots
          git config user.name "podplus-devices"; git config user.email "podplus-devices@users.noreply.github.com"
          git add -A && git commit -qm "Podster device shots ${GITHUB_SHA::8}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" podplus-device-shots
