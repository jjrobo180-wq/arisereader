name: 5-Minute Reads check (in a browser)
# The library's 5-Minute Reads shelf and the Reads page, one section per category, and a few reads, in the
# built app on an iPhone and a computer. Screenshots and results go to the reads-check branch.
on:
  workflow_dispatch:
  push:
    branches: [master, 'claude/more-five-minute-reads', 'claude/reads-rows']
    paths:
      - 'shared/funReads*.ts'
      - 'shared/ariseNews.ts'
      - 'shared/quickReads.ts'
      - 'client/src/components/QuickReadsShelf.tsx'
      - 'client/src/reader-app.css'
      - 'client/src/pages/reads/**'
      - 'client/src/pages/news/**'
      - 'script/readsCheck.ts'
      - '.github/workflows/reads-check.yml'
permissions:
  contents: write
concurrency:
  group: reads-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Open the shelf, the Reads page and some reads
        timeout-minutes: 15
        run: npx tsx script/readsCheck.ts
      - name: Save to the reads-check branch
        if: always()
        working-directory: screens
        run: |
          git init -q -b reads-check
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Reads check ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" reads-check
