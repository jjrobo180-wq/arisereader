name: Office and AI apps build
on:
  pull_request:
    paths:
      - "client/src/pages/AriseOffice.tsx"
      - "client/src/pages/PremiumStudio.tsx"
      - "client/src/lib/cloudDocs.ts"
      - "client/src/App.tsx"
      - "client/src/pages/TeacherHub.tsx"
      - "client/src/pages/AriseTodo.tsx"
      - "server/userDocs.ts"
      - "server/proAppsAI.ts"
      - "server/routes.ts"
      - ".github/workflows/office-and-ai.yml"
  push:
    branches:
      - feature/office-and-premium-apps-20261013
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Production build
        run: npm run build
