name: Build web app for a visual check
# Builds the web client and pushes dist/public to the audit-dist branch, so the To Duo desktop
# can be opened in a browser (with a made-up account) and screenshotted theme by theme.
on:
  push:
    branches: ['feat/themed-notifications']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - name: Push the build to audit-dist
        run: |
          cd dist/public
          git init -q -b audit-dist
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add -A && git commit -qm "web build of ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" audit-dist
