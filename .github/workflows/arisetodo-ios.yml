name: A.R.I.S.E. To-Do iOS build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'arisetodo/ios-app/**'
      - '.github/workflows/arisetodo-ios.yml'
  push:
    branches: [master]
    paths:
      - 'arisetodo/ios-app/**'
      - '.github/workflows/arisetodo-ios.yml'
jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install native tools
        working-directory: arisetodo/ios-app
        run: npm install --no-audit --no-fund
      - name: Generate native project
        working-directory: arisetodo/ios-app
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Compile iOS simulator app
        working-directory: arisetodo/ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ./derived CODE_SIGNING_ALLOWED=NO build
      - name: Save simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisetodo-ios-simulator
          path: arisetodo/ios-app/derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
