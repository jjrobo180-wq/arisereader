name: A.R.I.S.E. To-Do iOS build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'arisetodo/ios-app/**'
      - '.github/workflows/arisetodo-ios.yml'
      - '.github/scripts/adopt_uiscene.py'
  push:
    branches: [master]
    paths:
      - 'arisetodo/ios-app/**'
      - '.github/workflows/arisetodo-ios.yml'
      - '.github/scripts/adopt_uiscene.py'
jobs:
  ios:
    # Xcode 27 (iOS 27 SDK), like the TestFlight builds, so this catches what only fails there
    # (an app that doesn't open on iOS 27).
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [[ -z "$X" ]]; then X=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Bundle A.R.I.S.E. application locally
        run: |
          npx vite build
          rm -rf arisetodo/ios-app/www
          mkdir -p arisetodo/ios-app/www
          cp -R dist/public/. arisetodo/ios-app/www/
      - name: Install native tools
        working-directory: arisetodo/ios-app
        run: npm install --no-audit --no-fund
      - name: Generate native project
        working-directory: arisetodo/ios-app
        run: |
          npx cap add ios
          npx cap sync ios
          python3 configure-ios.py ios/App/App/Info.plist
          python3 ../../.github/scripts/adopt_uiscene.py ios/App/App/Info.plist
      - name: Compile iOS simulator app
        working-directory: arisetodo/ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ./derived CODE_SIGNING_ALLOWED=NO build
      - name: Launch app in iPhone simulator
        working-directory: arisetodo/ios-app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); g=sorted(d["devices"].items(), key=lambda kv: [int(n) for n in kv[0].rsplit("iOS-",1)[-1].split("-") if n.isdigit()] if "iOS-" in kv[0] else [0]); print(next(x["udid"] for _, group in reversed(g) for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" derived/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.arisereader.arisetodo
          sleep 12
          # Still running after launch (iOS stops an app that can't start, e.g. without the UIScene life cycle).
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "UIKitApplication:com.arisereader.arisetodo"; then
            echo "::error title=Launch::The app quit right after it opened on the iOS simulator"
            xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'eventMessage CONTAINS[c] "scene" OR eventMessage CONTAINS[c] "com.arisereader.arisetodo"' | tail -40 || true
            exit 1
          fi
          echo "::notice title=Launch::Opened and still running on $(xcrun simctl list devices | grep "$DEVICE" | head -1 | xargs)"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/arisetodo-launch.png"
      - name: Save iPhone launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: arisetodo-iphone-launch
          path: ${{ runner.temp }}/arisetodo-launch.png
          if-no-files-found: error
      - name: Save simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisetodo-ios-simulator
          path: arisetodo/ios-app/derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
