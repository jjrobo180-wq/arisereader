name: Arise Fit screens
# Phone-size screenshots of every Arise Fit screen with a sample account (script/fitScreens.mjs), light
# and dark, to check layouts, colors and wording. The pictures go to the fit-screens branch and the
# run's "fit-screens" artifact; results.txt lists any screen that failed or had page errors.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/src/pages/fit/**'
      - 'shared/fit*.ts'
      - 'script/fitScreens*.mjs'
      - '.github/workflows/fit-screens.yml'
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check Arise Fit (its own files only; the rest of the site isn't checked here)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p . > tsc.txt 2>&1
          grep -E "^(client/src/pages/(fit|trainer)/|shared/fit|client/src/App\.tsx)" tsc.txt > fit-tsc.txt
          cat fit-tsc.txt
          mkdir -p fit-screens && cp fit-tsc.txt fit-screens/typecheck.txt
          if [ -s fit-tsc.txt ]; then echo "::error title=Arise Fit type errors::$(wc -l < fit-tsc.txt) errors"; fi
          exit 0
      - name: Build the site
        run: npx vite build
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Take the screenshots
        run: node script/fitScreens.mjs
      - name: Keep the screenshots on the fit-screens branch
        working-directory: fit-screens
        run: |
          git init -q -b fit-screens
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Arise Fit screens for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fit-screens
      - uses: actions/upload-artifact@v4
        with:
          name: fit-screens
          path: fit-screens/
          retention-days: 7
