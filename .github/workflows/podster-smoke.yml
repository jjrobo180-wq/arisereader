name: Podster opens (temporary)
on:
  push:
    branches: [fix-podster-blank]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps webkit
      - name: Build Podster
        run: npx vite build --config podscroll/vite.config.ts --outDir dist-pod
      - name: Open it
        run: node script/podsterSmoke.mjs
