name: Arise Reader signed iOS release candidate
# Built from the shared frontend with VITE_NATIVE_APP=reader (client/src/lib/nativeApp.ts).
# Uploads to TestFlight only for a pushed commit whose message has [approved-testflight].
on:
  workflow_dispatch:
  push:
    branches: [feat/arisereader-testflight]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/arisereader-ios.yml'
      - 'reader/ios-app/**'
      - 'client/src/**'
jobs:
  signed-archive:
    # GitHub's Xcode 27 image (Apple Silicon): builds with the iOS 27.1 SDK, for iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27 (the iOS 27.1 SDK makes the app fill the iPhone Duo's inner screen)
        shell: bash
        run: |
          set -euo pipefail
          # The newest final release of Xcode 27 (App Store Connect doesn't take builds from betas);
          # a release candidate only when no final one is installed.
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [[ -z "$X" ]]; then X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -1 || true); fi
          if [[ -z "$X" ]]; then X=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          SDK=$(DEVELOPER_DIR="$X/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)
          echo "::notice title=Xcode::$(basename "$X") with the iOS $SDK SDK"
          if [[ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -1)" != "27.1" ]]; then
            echo "::warning title=iPhone Duo::The iOS $SDK SDK is older than 27.1, so the app won't fill the iPhone Duo's inner screen."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app sources
        run: test -f reader/ios-app/capacitor.config.json
      - name: Verify signing configuration
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build and bundle local frontend
        run: |
          npm ci
          VITE_NATIVE_APP=reader npx vite build
          rm -rf reader/ios-app/www
          mkdir -p reader/ios-app/www
          cp -R dist/public/. reader/ios-app/www/
      - name: Install native dependencies and generate iOS project
        working-directory: reader/ios-app
        run: |
          npm install --no-audit --no-fund
          python3 ../../.github/scripts/ota_setup.py reader
          npx cap add ios
          npx cap sync ios
      - name: Prepare beta icon and build number
        working-directory: reader/ios-app
        run: |
          set -euo pipefail
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON"
          sips -s format jpeg -s formatOptions 100 ../../client/public/app-icons/reader-1024.png --out "$RUNNER_TEMP/todo-icon.jpg" >/dev/null
          sips -z 1024 1024 -s format png "$RUNNER_TEMP/todo-icon.jpg" --out "$ICON/AppIcon-1024.png" >/dev/null
          printf '%s' '{"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON/Contents.json"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ios/App/App/Info.plist
      - name: Permission text, name and export compliance (Info.plist)
        working-directory: reader/ios-app
        run: |
          python3 ../../.github/scripts/configure_reader_app.py ios/App/App/Info.plist reader
          # Full screen: the page draws behind the status bar (client/src/reader-app.css keeps it clear of the clock).
          python3 ../../.github/scripts/adopt_uiscene.py ios/App/App/Info.plist
          # Home Screen widgets: the app's data bridge and the widget's files (added to the project after signing is set up).
          python3 ../../.github/scripts/reader_widgets.py ios/App/App/AppDelegate.swift
          # Quick actions on the Home Screen icon and arisereader:// links (an iPhone app, not a web page).
          python3 ../../.github/scripts/reader_native.py ios/App/App/Info.plist
      - name: Import Apple signing certificate and provisioning profile
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          # This app's own App Store profile (made from the same certificate when it doesn't exist yet).
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" != '6TYWWNKX6P.com.arisereader.reader' ]]; then
            python3 podscroll/ios-app/find-existing-profile.py com.arisereader.reader "$RUNNER_TEMP/profile.mobileprovision" --create-missing-profile
          fi
          # Its capabilities on the App ID (notifications from teachers, Sign in with Apple), and a profile with them.
          python3 .github/scripts/apple_signing.py com.arisereader.reader "$RUNNER_TEMP/profile.mobileprovision" APPLE_ID_AUTH PUSH_NOTIFICATIONS || echo "::warning::Couldn't add notifications to the App ID; building with the profile as it is."
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$PROFILE_APP_ID" != '6TYWWNKX6P.com.arisereader.reader' ]]; then
            echo "::error::Provisioning profile does not match the Arise Reader bundle ID"
            exit 1
          fi
          security create-keychain -p "" "$RUNNER_TEMP/reader.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/reader.keychain-db"
          # Never lock by itself: the default locks it after 5 idle minutes, and a later signing step (the Apple TV
          # app, after the iPhone upload) then waited for a password forever.
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/reader.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/reader.keychain-db" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/reader.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/reader.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          # Apple Health needs the HealthKit capability on the App ID and in this profile.
          # Until the profile has it, build without the entitlement (the app works; Health shows as unavailable).
          ENT=reader/ios-app/ios/App/App/App.entitlements
          [[ -f "$ENT" ]] || printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0"><dict/></plist>' > "$ENT"
          USE_ENT=""
          # The keychain group shared with the Home Screen widgets (reader_widgets.py wrote it).
          if grep -q keychain-access-groups "$ENT"; then USE_ENT=1; fi
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.healthkit' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.healthkit bool true' "$ENT" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.healthkit true' "$ENT"
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.healthkit.access array' "$ENT" 2>/dev/null || true
            USE_ENT=1
            echo "Apple Health: HealthKit entitlement enabled"
          else
            echo "::warning::The provisioning profile has no HealthKit capability. Building without Apple Health."
          fi
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Delete :com.apple.developer.applesignin' "$ENT" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin array' "$ENT"
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin:0 string Default' "$ENT"
            USE_ENT=1
            echo "Sign in with Apple: entitlement enabled"
          else
            echo "::warning::The provisioning profile has no Sign in with Apple capability. Building without it."
          fi
          APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          if [[ -n "$APS" ]]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string $APS" "$ENT" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :aps-environment $APS" "$ENT"
            USE_ENT=1
            echo "Push notifications: entitlement enabled ($APS)"
          else
            echo "::warning::The provisioning profile has no Push Notifications capability. Building without server notifications."
          fi
          if [[ -n "$USE_ENT" ]]; then echo "HEALTH_ENTITLEMENTS=CODE_SIGN_ENTITLEMENTS=App/App.entitlements" >> "$GITHUB_ENV"; else echo "HEALTH_ENTITLEMENTS=" >> "$GITHUB_ENV"; fi
          # The Home Screen widgets' own App ID and profile (registered the first time). If Apple won't
          # give one, the app is built without widgets rather than not at all.
          if python3 podscroll/ios-app/find-existing-profile.py com.arisereader.reader.widgets "$RUNNER_TEMP/widgets.mobileprovision" --create-missing-profile --register-bundle-id "--app-name=Arise Reader Widgets"; then
            security cms -D -i "$RUNNER_TEMP/widgets.mobileprovision" > "$RUNNER_TEMP/widgets.plist"
            W_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widgets.plist")
            W_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widgets.plist")
            cp "$RUNNER_TEMP/widgets.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$W_UUID.mobileprovision"
            echo "WIDGET_PROFILE=$W_NAME" >> "$GITHUB_ENV"
            echo "::notice title=Widgets::Signing profile ready for com.arisereader.reader.widgets"
          else
            echo "::warning title=Widgets::No signing profile for the widgets. Building the app without them."
          fi
      - name: Add the Home Screen widgets to the project
        working-directory: reader/ios-app
        run: |
          set -uo pipefail
          if [[ -z "${WIDGET_PROFILE:-}" ]]; then echo "No widget profile: skipped"; exit 0; fi
          gem install xcodeproj --no-document --user-install
          if APP_PROFILE="$PROFILE_NAME" PATH="$(ruby -e 'print Gem.user_dir')/bin:$PATH" ruby ../../.github/scripts/reader_widgets.rb ios/App/App.xcodeproj; then
            echo "WIDGETS=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Widgets::Couldn't add the widgets to the project. Building the app without them."
          fi
      - name: Archive signed app for physical iPhone
        working-directory: reader/ios-app
        env:
          TEAM_ID: 6TYWWNKX6P
        run: |
          set -euo pipefail
          if [[ "${WIDGETS:-}" == "1" ]]; then
            # Each target carries its own bundle ID, profile and entitlements (reader_widgets.rb).
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/ARISEReader.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              archive
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/ARISEReader.xcarchive" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PRODUCT_BUNDLE_IDENTIFIER=com.arisereader.reader \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
              $HEALTH_ENTITLEMENTS \
              archive
          fi
      - name: Show what the signed app is allowed to use (Apple Health, Sign in with Apple)
        run: |
          APP="$RUNNER_TEMP/ARISEReader.xcarchive/Products/Applications/App.app"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          for k in com.apple.developer.healthkit com.apple.developer.applesignin aps-environment; do
            if printf '%s' "$ENT" | grep -q "$k"; then echo "::notice title=Entitlement::$k is ON in the signed app"; else echo "::warning title=Entitlement::$k is OFF in the signed app"; fi
          done
      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": "6TYWWNKX6P",
              "provisioningProfiles": {"com.arisereader.reader": os.environ["PROFILE_NAME"], **({"com.arisereader.reader.widgets": os.environ["WIDGET_PROFILE"]} if os.environ.get("WIDGETS") == "1" else {})},
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ARISEReader.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/reader-export"
      - name: Save IPA for review (not uploaded to Apple)
        uses: actions/upload-artifact@v4
        with:
          name: arisereader-ios-ipa-not-submitted
          path: ${{ runner.temp }}/reader-export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload signed archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: arisereader-ios-signed-archive
          path: ${{ runner.temp }}/ARISEReader.xcarchive
          if-no-files-found: error
          retention-days: 3
      - name: Validate beta and perform explicitly approved TestFlight upload
        env:
          APPROVED_UPLOAD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-testflight]') }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Existing App Store Connect credential $name is unavailable to this job. No upload attempted."
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA=("$RUNNER_TEMP"/reader-export/*.ipa)
          xcrun altool --validate-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          if [[ "$APPROVED_UPLOAD" == "true" ]]; then
            xcrun altool --upload-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/reader.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
