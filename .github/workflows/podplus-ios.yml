name: Pod+ iOS native build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'podscroll/**'
      - 'server/earshot.ts'
      - 'client/src/components/family-hub/earshot/**'
      - '.github/workflows/podplus-ios.yml'
  push:
    branches: [master]
    paths:
      - 'podscroll/**'
      - 'server/earshot.ts'
      - 'client/src/components/family-hub/earshot/**'
      - '.github/workflows/podplus-ios.yml'
jobs:
  ios:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Pod+ dependencies
        run: npm ci
      - name: Build actual Pod+ iOS web bundle
        env:
          PODPLUS_IOS: '1'
        run: |
          npx vite build --config podscroll/vite.config.ts
          node podscroll/ios-app/prepare-web.mjs
      - name: Install native tooling
        working-directory: podscroll/ios-app
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        working-directory: podscroll/ios-app
        run: |
          npx cap add ios
          npx cap sync ios
          python3 configure-ios.py ios/App/App/Info.plist
      - name: Compile iOS simulator app (no Apple signing required)
        working-directory: podscroll/ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ./derived CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone simulator and capture beta screen
        working-directory: podscroll/ios-app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" derived/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.arisereader.podplus
          sleep 10
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/podplus-launch.png"
      - name: Save beta launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: podplus-iphone-launch
          path: ${{ runner.temp }}/podplus-launch.png
          if-no-files-found: error
      - name: Save unsigned simulator build for review
        uses: actions/upload-artifact@v4
        with:
          name: podplus-ios-simulator
          path: podscroll/ios-app/derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
