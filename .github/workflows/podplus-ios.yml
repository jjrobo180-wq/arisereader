name: Pod+ iOS native build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'podscroll/**'
      - 'server/earshot.ts'
      - 'client/src/components/family-hub/earshot/**'
      - '.github/workflows/podplus-ios.yml'
      - '.github/scripts/adopt_uiscene.py'
  push:
    branches: [master]
    paths:
      - 'podscroll/**'
      - 'server/earshot.ts'
      - 'client/src/components/family-hub/earshot/**'
      - '.github/workflows/podplus-ios.yml'
      - '.github/scripts/adopt_uiscene.py'
jobs:
  ios:
    # Xcode 27 (iOS 27 SDK), like the TestFlight builds, so this catches what only fails there
    # (an app that doesn't open on iOS 27).
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27
        shell: bash
        run: |
          set -euo pipefail
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [[ -z "$X" ]]; then X=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Pod+ dependencies
        run: npm ci
      - name: Build actual Pod+ iOS web bundle
        env:
          PODPLUS_IOS: '1'
        run: |
          npx vite build --config podscroll/vite.config.ts
          node podscroll/ios-app/prepare-web.mjs
      - name: Install native tooling
        working-directory: podscroll/ios-app
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        working-directory: podscroll/ios-app
        run: |
          npx cap add ios
          npx cap sync ios
          python3 configure-ios.py ios/App/App/Info.plist
          python3 ../../.github/scripts/adopt_uiscene.py ios/App/App/Info.plist
      - name: Compile iOS simulator app (no Apple signing required)
        working-directory: podscroll/ios-app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ./derived CODE_SIGNING_ALLOWED=NO build
      - name: Launch iPhone simulator and capture beta screen
        working-directory: podscroll/ios-app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); g=sorted(d["devices"].items(), key=lambda kv: [int(n) for n in kv[0].rsplit("iOS-",1)[-1].split("-") if n.isdigit()] if "iOS-" in kv[0] else [0]); print(next(x["udid"] for _, group in reversed(g) for x in group if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" derived/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.arisereader.podplus
          sleep 12
          # Still running after launch (iOS stops an app that can't start, e.g. without the UIScene life cycle).
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "UIKitApplication:com.arisereader.podplus"; then
            echo "::error title=Launch::The app quit right after it opened on the iOS simulator"
            xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'eventMessage CONTAINS[c] "scene" OR eventMessage CONTAINS[c] "com.arisereader.podplus"' | tail -40 || true
            exit 1
          fi
          echo "::notice title=Launch::Opened and still running on $(xcrun simctl list devices | grep "$DEVICE" | head -1 | xargs)"
          # An iPhone Duo simulator has two screens: the picture is a nice-to-have, not the check.
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/podplus-launch.png" || xcrun simctl io "$DEVICE" screenshot --display=internal "$RUNNER_TEMP/podplus-launch.png" || echo "::warning title=Screenshot::No launch screenshot from this simulator"
      - name: Save beta launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: podplus-iphone-launch
          path: ${{ runner.temp }}/podplus-launch.png
          if-no-files-found: warn
      - name: Save unsigned simulator build for review
        uses: actions/upload-artifact@v4
        with:
          name: podplus-ios-simulator
          path: podscroll/ios-app/derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
