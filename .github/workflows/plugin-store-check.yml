name: Plugin Gallery check (in a browser)
# The Plugin Gallery's Premium and Mini switch, shelves and search, in the built app on an iPhone and a
# computer. Screenshots and results go to the plugin-store-check branch.
on:
  workflow_dispatch:
  push:
    branches: [master, 'claude/plugin-store']
    paths:
      - 'shared/pluginStore.ts'
      - 'shared/appBundles.ts'
      - 'client/src/components/plugin-store/**'
      - 'script/pluginStoreCheck.ts'
      - '.github/workflows/plugin-store-check.yml'
permissions:
  contents: write
concurrency:
  group: plugin-store-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Open the gallery, switch Premium and Mini, search
        timeout-minutes: 15
        run: npx tsx script/pluginStoreCheck.ts
      - name: Save to the plugin-store-check branch
        if: always()
        working-directory: screens
        run: |
          git init -q -b plugin-store-check
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Plugin Gallery check ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" plugin-store-check
