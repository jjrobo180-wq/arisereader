name: Link page check (in a browser)
# The Link page, shared, in each theme, in the built app on an iPhone and a
# computer. Screenshots and results go to the link-page-check branch.
on:
  workflow_dispatch:
  push:
    branches: [master, 'claude/link-page']
    paths:
      - 'shared/linkPageLook.ts'
      - 'client/src/pages/TodoShare.tsx'
      - 'client/src/components/family-hub/LinkPage*.tsx'
      - 'script/linkPageCheck.ts'
      - '.github/workflows/link-page-check.yml'
permissions:
  contents: write
concurrency:
  group: link-page-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Install a browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Open the shared Link page in each theme
        timeout-minutes: 15
        run: npx tsx script/linkPageCheck.ts
      - name: Save to the link-page-check branch
        if: always()
        working-directory: screens
        run: |
          git init -q -b link-page-check
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Link page check ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" link-page-check
