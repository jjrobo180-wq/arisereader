name: Verify approved TestFlight builds
on:
  workflow_dispatch:
  push:
    branches: [feat/arisetodo-ios-app-store-starter]
    paths: ['.github/workflows/verify-testflight.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Apple processing status of approved beta builds
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          """Find an existing App Store profile for the installed signing certificate.
          Read-only Apple API calls; never creates or replaces certificates or profiles.
          """
          import base64
          import hashlib
          import json
          import os
          import pathlib
          import plistlib
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()
          
          def integer(data, offset):
              if data[offset] != 2:
                  raise ValueError("Invalid ECDSA signature")
              length = data[offset + 1]
              value = data[offset + 2:offset + 2 + length]
              return value.lstrip(bytes([0])).rjust(32, bytes([0])), offset + 2 + length
          
          def main():
              names = ["APP_STORE_CONNECT_API_KEY", "APP_STORE_CONNECT_KEY_ID", "APP_STORE_CONNECT_ISSUER_ID"]
              for name in names:
                  if not os.environ.get(name):
                      raise RuntimeError(f"Existing credential {name} is unavailable to the release job")
              key_text = os.environ[names[0]]
              if "BEGIN PRIVATE KEY" not in key_text:
                  key_text = base64.b64decode(key_text).decode()
              key_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "profile-api-key.p8"
              key_path.write_text(key_text)
              key_path.chmod(0o600)
              try:
                  now = int(time.time())
                  header = b64(json.dumps({"alg": "ES256", "kid": os.environ[names[1]], "typ": "JWT"}).encode())
                  payload = b64(json.dumps({"iss": os.environ[names[2]], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}).encode())
                  message = (header + "." + payload).encode()
                  signature = subprocess.run(["openssl", "dgst", "-sha256", "-sign", str(key_path)],
                                             input=message, check=True, capture_output=True).stdout
                  offset = 2 if signature[1] < 128 else 2 + (signature[1] & 127)
                  r, offset = integer(signature, offset)
                  s, offset = integer(signature, offset)
                  token = header + "." + payload + "." + b64(r + s)
                  targets = {"com.arisereader.arisetodo": "6.1", "com.arisereader.podplus": "4.1"}
                  def get(path, params):
                      request = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/" + path + "?" + urllib.parse.urlencode(params), headers={"Authorization": "Bearer " + token})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)
                  results = {}
                  for attempt in range(20):
                      for bundle, version in targets.items():
                          apps = get("apps", {"filter[bundleId]": bundle})["data"]
                          if not apps:
                              results[bundle] = {"version": version, "state": "APP_RECORD_NOT_FOUND"}
                              continue
                          builds = get("builds", {"filter[app]": apps[0]["id"], "filter[version]": version})["data"]
                          if not builds:
                              results[bundle] = {"version": version, "state": "AWAITING_PROCESSING"}
                              continue
                          build = builds[0]
                          beta = get("builds/" + build["id"] + "/buildBetaDetail", {})["data"]["attributes"]
                          results[bundle] = {"version": version, "state": build["attributes"]["processingState"], "buildId": build["id"], "appId": apps[0]["id"], "usesNonExemptEncryption": build["attributes"].get("usesNonExemptEncryption"), "internalBuildState": beta.get("internalBuildState"), "externalBuildState": beta.get("externalBuildState")}
                      print(json.dumps(results), flush=True)
                      if all(x["state"] in ("VALID", "FAILED", "INVALID", "APP_RECORD_NOT_FOUND") for x in results.values()):
                          break
                      time.sleep(30)
                  pathlib.Path(os.environ["RUNNER_TEMP"], "testflight-status.json").write_text(json.dumps(results, indent=2))
                  if any(x["state"] != "VALID" for x in results.values()):
                      raise RuntimeError("One or more uploaded builds are not yet VALID; see status artifact")
              finally:
                  key_path.unlink(missing_ok=True)
          
          if __name__ == "__main__":
              main()
          
          PY
      - name: Save Apple processing status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-testflight-processing-status
          path: ${{ runner.temp }}/testflight-status.json
