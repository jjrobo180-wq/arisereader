name: Pod+ TestFlight upload
# Manual, gated release: never uploads until signing credentials are configured.
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify Apple credentials
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name. No upload attempted."
              exit 1
            fi
          done
      - name: Compile web bundle
        env:
          PODPLUS_IOS: '1'
        run: |
          npm ci
          npx vite build --config podscroll/vite.config.ts
          node podscroll/ios-app/prepare-web.mjs
      - name: Generate iOS project
        working-directory: podscroll/ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Install signing assets
        env:
          P8_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/apple-keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s\n' "$P8_KEY" > "$RUNNER_TEMP/apple-keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/build.keychain" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain" "$HOME/Library/Keychains/login.keychain-db"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/PodPlus.mobileprovision"
      - name: Create and upload signed archive
        working-directory: podscroll/ios-app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/PodPlus.xcarchive" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/apple-keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" DEVELOPMENT_TEAM=6TYWWNKX6P PRODUCT_BUNDLE_IDENTIFIER=com.arisereader.podplus archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>teamID</key><string>6TYWWNKX6P</string>
          <key>destination</key><string>upload</string>
          <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PodPlus.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/apple-keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" -exportPath "$RUNNER_TEMP/podplus-export"
