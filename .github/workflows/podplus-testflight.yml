name: Pod+ signed iOS beta validation
# Development beta validation only. Upload is a separate, explicitly approved release step.
# Release: now playing on show pages, Continue listening, live News Radio screen
on:
  workflow_dispatch:
  push:
    branches: [feat/podplus-ios-app-store-starter]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/podplus-testflight.yml'
jobs:
  signed-archive:
    # GitHub's Xcode 27 image (Apple Silicon): builds with the iOS 27.1 SDK, for iPhone Duo.
    runs-on: xcode-27
    timeout-minutes: 60
    environment: app-store
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode 27 (the iOS 27.1 SDK makes the app fill the iPhone Duo's inner screen)
        shell: bash
        run: |
          set -euo pipefail
          # The newest final release of Xcode 27 (App Store Connect doesn't take builds from betas);
          # a release candidate only when no final one is installed.
          X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1 || true)
          if [[ -z "$X" ]]; then X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta' | sort -V | tail -1 || true); fi
          if [[ -z "$X" ]]; then X=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          SDK=$(DEVELOPER_DIR="$X/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version)
          echo "::notice title=Xcode::$(basename "$X") with the iOS $SDK SDK"
          if [[ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -1)" != "27.1" ]]; then
            echo "::warning title=iPhone Duo::The iOS $SDK SDK is older than 27.1, so the app won't fill the iPhone Duo's inner screen."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify app sources
        run: test -f podscroll/ios-app/capacitor.config.json
      - name: Verify signing configuration
        shell: bash
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in IOS_DISTRIBUTION_CERT_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build bundled Pod+ app
        env:
          PODPLUS_IOS: '1'
        run: |
          npm ci
          npx vite build --config podscroll/vite.config.ts
          node podscroll/ios-app/prepare-web.mjs
      - name: Install native dependencies and generate iOS project
        working-directory: podscroll/ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          python3 configure-ios.py ios/App/App/Info.plist
          python3 ../../.github/scripts/adopt_uiscene.py ios/App/App/Info.plist
      - name: Prepare beta icon and build number
        working-directory: podscroll/ios-app
        run: |
          set -euo pipefail
          ICON=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON"
          sips -s format jpeg -s formatOptions 100 ../public/icon-512.png --out "$RUNNER_TEMP/podplus-icon.jpg" >/dev/null
          sips -z 1024 1024 -s format png "$RUNNER_TEMP/podplus-icon.jpg" --out "$ICON/AppIcon-1024.png" >/dev/null
          printf '%s' '{"images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON/Contents.json"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" ios/App/App/Info.plist
      - name: Import Apple signing certificate and provisioning profile
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_DISTRIBUTION_CERT_BASE64" | base64 -D > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" != '6TYWWNKX6P.com.arisereader.podplus' ]]; then
            python3 podscroll/ios-app/find-existing-profile.py com.arisereader.podplus "$RUNNER_TEMP/profile.mobileprovision" --create-missing-profile
            security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          fi
          # Sign in with Apple and push notifications on the App ID, and a profile that includes them (same certificate).
          python3 .github/scripts/apple_signing.py com.arisereader.podplus "$RUNNER_TEMP/profile.mobileprovision" APPLE_ID_AUTH PUSH_NOTIFICATIONS
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            ENT=podscroll/ios-app/ios/App/App/App.entitlements
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin array' "$ENT"
            /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.applesignin:0 string Default' "$ENT"
            echo "SIGN_ENTITLEMENTS=CODE_SIGN_ENTITLEMENTS=App/App.entitlements" >> "$GITHUB_ENV"
          else
            echo "::warning::The provisioning profile has no Sign in with Apple capability. Building without it."
            echo "SIGN_ENTITLEMENTS=" >> "$GITHUB_ENV"
          fi
          # Push notifications (new episodes from followed shows): the aps-environment entitlement.
          APS=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || true)
          if [[ -n "$APS" ]]; then
            ENT=podscroll/ios-app/ios/App/App/App.entitlements
            [[ -f "$ENT" ]] || printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict/></plist>\n' > "$ENT"
            /usr/libexec/PlistBuddy -c "Add :aps-environment string $APS" "$ENT" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :aps-environment $APS" "$ENT"
            echo "SIGN_ENTITLEMENTS=CODE_SIGN_ENTITLEMENTS=App/App.entitlements" >> "$GITHUB_ENV"
            echo "Push notifications: entitlement enabled ($APS)"
          else
            echo "::warning::The provisioning profile has no Push Notifications capability. Building without notifications."
          fi
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [[ "$PROFILE_APP_ID" != '6TYWWNKX6P.com.arisereader.podplus' ]]; then
            echo "::error::Provisioning profile does not match Pod+ bundle ID"
            exit 1
          fi
          security create-keychain -p "" "$RUNNER_TEMP/podplus.keychain-db"
          security unlock-keychain -p "" "$RUNNER_TEMP/podplus.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/podplus.keychain-db" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/podplus.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/podplus.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Archive signed app for physical iPhone
        working-directory: podscroll/ios-app
        env:
          TEAM_ID: 6TYWWNKX6P
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PodPlus.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.arisereader.podplus \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            $SIGN_ENTITLEMENTS \
            archive
      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": "6TYWWNKX6P",
              "provisioningProfiles": {"com.arisereader.podplus": os.environ["PROFILE_NAME"]},
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PodPlus.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/podplus-export"
      - name: Save IPA for review (not uploaded to Apple)
        uses: actions/upload-artifact@v4
        with:
          name: podplus-ios-ipa-not-submitted
          path: ${{ runner.temp }}/podplus-export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload signed archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: podplus-ios-signed-archive
          path: ${{ runner.temp }}/PodPlus.xcarchive
          if-no-files-found: error
          retention-days: 3
      - name: Validate beta and perform explicitly approved TestFlight upload
        env:
          APPROVED_UPLOAD: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-testflight]') }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Existing App Store Connect credential $name is unavailable to this job. No upload attempted."
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          IPA=("$RUNNER_TEMP"/podplus-export/*.ipa)
          xcrun altool --validate-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          if [[ "$APPROVED_UPLOAD" == "true" ]]; then
            xcrun altool --upload-app -f "${IPA[0]}" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/podplus.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
